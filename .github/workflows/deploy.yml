name: Deploy to Neocities

# Only deploys when something in site/ changes on main.
# This means you can commit backend/ or README changes without
# triggering a live deploy.
on:
  push:
    branches:
      - main
    paths:
      - "site/**"

concurrency:
  group: deploy-to-neocities
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Neocities is a public static host. Keep client work and internal tools
      # out of its deployment payload; they remain in the repository only.
      - name: Prepare public site
        run: |
          mkdir -p .neocities-deploy
          rsync -a --delete \
            --exclude='/ActiveClients/' \
            --exclude='/Campaigns/' \
            --exclude='/Content-Proposal/' \
            --exclude='/Editorials/' \
            --exclude='/Images/' \
            --exclude='/Next priority from Milky project roadmap - Claude_files/' \
            --exclude='/Prompts/' \
            --exclude='/Taskmaster/' \
            --exclude='/dashboards/' \
            --exclude='/e/' \
            --exclude='/leads/' \
            --exclude='/payment/' \
            --exclude='/private-data/' \
            --exclude='/Productions/' \
            --exclude='/reports/' \
            --exclude='/staging/' \
            --exclude='/.env' \
            --exclude='/.env.example' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/server.js' \
            --exclude='/payment-lib.js' \
            --exclude='/payment-test-cases.md' \
            --exclude='/proof-audit.json' \
            --exclude='/service-map.json' \
            --exclude='/site-data-model.json' \
            --exclude='/atomic-shelf-commitment-terms.md' \
            --exclude='/Atomic_Shelf_Website_Relaunch_PRD.md' \
            --exclude='/README.md' \
            site/ .neocities-deploy/

      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_TOKEN }}
          dist_dir: .neocities-deploy
          cleanup: false
          # If you ever get a Supporter account and want larger file types
          # allowed through, flip this to true.
          neocities_supporter: false
