  - generic [ref=f11e277]:
    - paragraph [ref=f11e278]: Our commitment
    - generic [ref=f11e279]:
      - paragraph [ref=f11e280]: We don't promise that every book will explode overnight. Publishing doesn't work that way — and neither does building a readership.
      - paragraph [ref=f11e281]: What we do promise is that we'll do the work we've committed to, measure what happens, and stay accountable for the outcome.
      - paragraph [ref=f11e282]: If we fall short of the work, delivery, or agreed commitments on our side, we'll make it right — at our cost.
      - paragraph [ref=f11e283]: If the results show that something needs to change, we explain what we are seeing, adjust the plan, and stay involved until the work is back on track.
    - separator [ref=f11e284]
    - paragraph [ref=f11e285]: We commit to doing the work, learning from the results, and improving it as we go.
  - generic [ref=f11e287]:
    - generic [ref=f11e288]:
      - paragraph [ref=f11e289]: FAQ
      - heading "Questions authors actually ask." [level=2] [ref=f11e290]
    - generic [ref=f11e291]:
      - generic [ref=f11e292]:
        - button "Do you guarantee sales? +" [ref=f11e293] [cursor=pointer]:
          - text: Do you guarantee sales?
          - generic [ref=f11e294]: +
        - generic:
          - paragraph [ref=f11e295]: "Short answer: No."
          - paragraph [ref=f11e296]: Then, what's the point? We do the work that earns attention and gives the book a better chance with the right readers.
          - paragraph [ref=f11e297]: "Long answer: Although it is possible to estimate expected downloads or sales for lower-priced books, those outcomes cannot be guaranteed because they depend on reader behaviour, market conditions, and platform performance. We control the work we commit to — production, campaigns, reviews recruitment, listing optimisation, reporting. We influence reach, clicks, and conversion. We don't guarantee a specific number of sales, a bestseller position, a ranking, or an algorithmic viral event — no one honestly can."
      - generic [ref=f11e298]:
        - button "What happens if Atomic Shelf doesn't deliver? +" [ref=f11e299] [cursor=pointer]:
          - text: What happens if Atomic Shelf doesn't deliver?
          - generic [ref=f11e300]: +
        - paragraph [ref=f11e301]: Money-back applies to the specific line items that weren't delivered at all — not a blanket refund, and not triggered simply by results coming in lower than the estimated range. If delivery is confirmed but performance is below range, we keep working, diagnose, and adjust at no extra cost rather than refunding.
      - generic [ref=f11e302]:
        - button "Why are longer commitments discounted? +" [ref=f11e303] [cursor=pointer]:
          - text: Why are longer commitments discounted?
          - generic [ref=f11e304]: +
        - paragraph [ref=f11e305]: Longer commitments are prepaid savings. We have more time to compound the work, and predictable planning lets us give you better economics.
      - generic [ref=f11e306]:
        - button "Can I change plans? +" [ref=f11e307] [cursor=pointer]:
          - text: Can I change plans?
          - generic [ref=f11e308]: +
        - paragraph [ref=f11e309]: Yes — upgrading, downgrading, or pausing is allowed at any time. Current ad spend is taken into account and applied as available credit toward the new plan.
      - generic [ref=f11e310]:
        - button "What happens after a commitment ends? +" [ref=f11e311] [cursor=pointer]:
          - text: What happens after a commitment ends?
          - generic [ref=f11e312]: +
        - paragraph [ref=f11e313]: Everything is handed over via secure transfer if needed — videos created, account info, and related assets. In practice, most content is already accessible to you throughout, since every content gallery is public to you via your progress-report link.
      - generic [ref=f11e314]:
        - button "Do I need to appear on camera? +" [ref=f11e315] [cursor=pointer]:
          - text: Do I need to appear on camera?
          - generic [ref=f11e316]: +
        - paragraph [ref=f11e317]: No. You provide a link to your book (or, for a backlist, your catalogue), plus optionally any planned discount-deal dates so campaigns can be planned around them.
      - generic [ref=f11e318]:
        - button "Who manages the campaigns? +" [ref=f11e319] [cursor=pointer]:
          - text: Who manages the campaigns?
          - generic [ref=f11e320]: +
        - paragraph [ref=f11e321]: A dedicated outreach team manages your account day-to-day, handles ARC/reviewer list outreach, and monitors that campaigns are running smoothly.
      - generic [ref=f11e322]:
        - button "What genres do you support? +" [ref=f11e323] [cursor=pointer]:
          - text: What genres do you support?
          - generic [ref=f11e324]: +
        - paragraph [ref=f11e325]: All genres. Bigger, higher-volume genres tend to see stronger results than smaller genres, simply due to reader pool size.
