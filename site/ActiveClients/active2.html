<head>
<meta charset="UTF-8"/>

<title>Atomic Shelf · Author Command Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fdf8f0;--surface:#fff;--surface2:#faf4ea;
  --border:#e6d3bb;--border-lt:#f0e6d5;
  --amber:#c47a2a;--amber-lt:#fef3dc;
  --dark:#2c1a12;--text:#1e1108;--text2:#6b5440;--text3:#9d8070;
  --r:10px;--r-sm:7px;--r-lg:18px;
}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── HEADER ── */
.hdr{background:var(--dark);padding:13px 22px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:600;color:#fef3dc;white-space:nowrap;letter-spacing:-.01em;}
.logo span{color:var(--amber);}
.srch-wrap{position:relative;flex:1;max-width:340px;}
.srch-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.4);pointer-events:none;}
.srch{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:40px;padding:7px 14px 7px 34px;color:#fff;font-family:inherit;font-size:.82rem;outline:none;}
.srch::placeholder{color:rgba(255,255,255,.38);}
.srch:focus{border-color:rgba(196,122,42,.6);background:rgba(255,255,255,.14);}
.hdr-right{display:flex;gap:8px;margin-left:auto;}
.btn-sm{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.75);padding:6px 14px;border-radius:40px;font-size:.73rem;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:5px;}
.btn-sm:hover{background:rgba(255,255,255,.18);color:#fff;}

/* ── FILTER TABS ── */
.tabs{background:var(--surface);border-bottom:1px solid var(--border-lt);padding:0 22px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:11px 14px;font-size:.75rem;font-weight:500;color:var(--text3);cursor:pointer;white-space:nowrap;border:none;border-bottom:2px solid transparent;background:none;font-family:inherit;display:flex;align-items:center;gap:5px;transition:color .12s,border-color .12s;}
.tab:hover{color:var(--text);}
.tab.on{color:var(--amber);border-bottom-color:var(--amber);}
.pill{background:var(--amber-lt);color:var(--amber);border-radius:40px;padding:1px 7px;font-size:.67rem;font-family:'DM Mono',monospace;}
.tab.on .pill{background:var(--amber);color:#fff;}

/* ── CONTROLS BAR ── */
.ctrl{padding:11px 22px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-lt);background:var(--surface);}
.ctrl-lbl{font-size:.75rem;color:var(--text3);}
.sel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 10px;font-size:.75rem;font-family:inherit;color:var(--text2);cursor:pointer;outline:none;}
.sel:focus{border-color:var(--amber);}
.view-tog{display:flex;gap:4px;margin-left:auto;}
.vbtn{padding:5px 12px;border-radius:var(--r-sm);background:none;border:1px solid var(--border);color:var(--text3);cursor:pointer;font-size:.73rem;font-family:inherit;transition:all .12s;}
.vbtn.on{background:var(--dark);color:#fef3dc;border-color:var(--dark);}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;padding:14px 22px;background:var(--surface2);border-bottom:1px solid var(--border-lt);}
.stat{background:var(--surface);border:1px solid var(--border-lt);border-radius:var(--r);padding:12px 14px;}
.stat-lbl{font-size:.64rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-family:'DM Mono',monospace;}
.stat-val{font-size:1.45rem;font-weight:600;font-family:'DM Mono',monospace;color:var(--text);margin-top:3px;}
.stat-sub{font-size:.66rem;color:var(--text3);margin-top:1px;}

/* ── MAIN CONTENT ── */
.main{padding:18px 22px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:13px;}

/* ── AUTHOR CARD ── */
.card{background:var(--surface);border:1px solid var(--border-lt);border-radius:var(--r-lg);padding:17px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08);}
.card.s-active{border-left:3px solid #22c55e;}
.card.s-needs{border-left:3px solid #ef4444;}
.card.s-awaiting{border-left:3px solid #f59e0b;}
.card.s-content{border-left:3px solid #14b8a6;}
.card.s-prospect{border-left:3px solid #f97316;}
.card.s-low{border-left:3px solid #94a3b8;}
.card.s-old-check{border-left:3px solid #94a3b8;}
.c-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;}
.c-name{font-family:'Cormorant Garamond',serif;font-size:1.08rem;font-weight:600;color:var(--text);line-height:1.2;}
.c-book{font-size:.77rem;color:var(--amber);font-style:italic;margin-bottom:9px;}
.c-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.c-foot{display:flex;gap:6px;margin-top:11px;border-top:1px solid var(--border-lt);padding-top:9px;}
.vip-dot{display:inline-block;width:6px;height:6px;background:#f59e0b;border-radius:50%;margin-right:5px;vertical-align:middle;}
.vip-tag{font-size:.63rem;color:#b45309;font-family:'DM Mono',monospace;margin-top:1px;}

/* ── LIST VIEW ── */
.list-hdr{display:grid;grid-template-columns:2fr 1.6fr 1fr 1fr 1fr 110px;gap:10px;padding:7px 14px;font-size:.63rem;font-family:'DM Mono',monospace;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;}
.lst{display:flex;flex-direction:column;gap:5px;}
.row{background:var(--surface);border:1px solid var(--border-lt);border-radius:var(--r);padding:11px 14px;display:grid;grid-template-columns:2fr 1.6fr 1fr 1fr 1fr 110px;align-items:center;gap:10px;cursor:pointer;transition:box-shadow .12s;}
.row:hover{box-shadow:0 4px 12px rgba(0,0,0,.07);border-color:var(--border);}
.r-name{font-family:'Cormorant Garamond',serif;font-size:.97rem;font-weight:600;}
.r-book{font-size:.72rem;color:var(--text3);font-style:italic;}
.r-acts{display:flex;gap:5px;justify-content:flex-end;}

/* ── STATUS BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:40px;font-size:.63rem;font-weight:500;letter-spacing:.03em;white-space:nowrap;}
.b-active{background:#dcfce7;color:#166534;}
.b-needs{background:#fee2e2;color:#991b1b;}
.b-awaiting{background:#fef3c7;color:#92400e;}
.b-content{background:#ccfbf1;color:#134e4a;}
.b-prospect{background:#ffedd5;color:#c2410c;}
.b-low{background:#f1f5f9;color:#475569;}
.b-old-check{background:#f1f5f9;color:#475569;}

/* ── DAYS BADGE ── */
.dbadge{font-family:'DM Mono',monospace;font-size:.63rem;padding:2px 7px;border-radius:40px;}
.d-fresh{background:#dcfce7;color:#166534;}
.d-ok{background:#fef3c7;color:#92400e;}
.d-stale{background:#ffedd5;color:#9a3412;}
.d-urgent{background:#fee2e2;color:#991b1b;}
.d-none{background:#f1f5f9;color:#64748b;}

/* ── INVOICE CHIP ── */
.ichip{font-size:.63rem;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:4px;}
.i-paid{background:#dcfce7;color:#166534;}
.i-due{background:#fef3c7;color:#92400e;}
.i-pend{background:#f1f5f9;color:#475569;}
.i-na{color:var(--text3);font-size:.63rem;font-family:'DM Mono',monospace;}

/* ── EMAIL CHIP ── */
.email-chip{font-size:.68rem;color:var(--text3);font-family:'DM Mono',monospace;background:var(--surface2);padding:2px 7px;border-radius:4px;cursor:pointer;}
.email-chip:hover{background:var(--border-lt);}

/* ── BUTTONS ── */
.btn-contact{font-size:.7rem;font-family:inherit;padding:4px 11px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;transition:all .1s;white-space:nowrap;}
.btn-contact:hover{background:var(--border-lt);}
.btn-contact.done{background:#dcfce7;border-color:#86efac;color:#166534;}
.btn-view{font-size:.7rem;font-family:inherit;padding:4px 11px;border-radius:var(--r-sm);border:none;background:var(--dark);color:#fef3dc;cursor:pointer;margin-left:auto;}
.btn-view:hover{background:#3d2518;}

/* ── DRAWER ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:98;opacity:0;pointer-events:none;transition:opacity .25s;}
.overlay.on{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;width:560px;max-width:95vw;height:100vh;overflow-y:auto;background:var(--surface);z-index:99;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:-16px 0 48px rgba(0,0,0,.12);}
.drawer.on{transform:translateX(0);}
.d-hdr{background:var(--dark);padding:18px 22px;position:sticky;top:0;z-index:1;}
.d-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.1);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;}
.d-close:hover{background:rgba(255,255,255,.2);}
.d-name{font-family:'Cormorant Garamond',serif;font-size:1.55rem;font-weight:600;color:#fef3dc;line-height:1.15;}
.d-book{font-size:.82rem;color:rgba(196,122,42,.9);font-style:italic;margin-top:3px;}
.d-badges{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.d-body{padding:22px;}
.d-sec{margin-bottom:22px;}
.d-sec-ttl{font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border-lt);}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ibox{background:var(--surface2);border-radius:var(--r-sm);padding:10px 12px;}
.ibox-lbl{font-size:.63rem;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:3px;}
.ibox-val{font-size:.82rem;color:var(--text);font-weight:500;word-break:break-all;}
.notes-ro{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:13px;font-size:.78rem;color:var(--text);line-height:1.65;white-space:pre-line;}
.notes-ed{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:13px;font-size:.78rem;color:var(--text);font-family:inherit;min-height:110px;resize:vertical;line-height:1.65;outline:none;}
.notes-ed:focus{border-color:var(--amber);}
.btn-save{background:var(--amber);color:#fff;border:none;padding:7px 16px;border-radius:var(--r-sm);font-size:.78rem;font-family:inherit;cursor:pointer;margin-top:7px;}
.btn-save:hover{background:#a8631e;}
.log-item{background:var(--surface2);border-left:3px solid var(--amber);padding:7px 11px;border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:.73rem;color:var(--text2);}
.log-date{font-family:'DM Mono',monospace;font-size:.64rem;color:var(--text3);}
.lchip{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 11px;font-size:.73rem;color:var(--text2);text-decoration:none;margin:0 5px 5px 0;}
.lchip:hover{background:var(--border-lt);color:var(--amber);}
.d-qact{display:flex;gap:7px;flex-wrap:wrap;}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:56px 22px;color:var(--text3);}
.empty-ttl{font-family:'Cormorant Garamond',serif;font-size:1.35rem;margin-bottom:7px;color:var(--text2);}

/* ── TOAST ── */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--dark);color:#fef3dc;padding:9px 18px;border-radius:40px;font-size:.78rem;z-index:200;transition:transform .28s;pointer-events:none;}
.toast.on{transform:translateX(-50%) translateY(0);}
</style>
</head>

// ═══════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════
function parseDate(s){
  if(!s||s==='—'||s==='N/A') return null;
  const my=s.match(/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{4})$/i);
  if(my) return new Date(`${my[1]} 1, ${my[2]}`);
  const full=s.match(/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d+),?\s*(\d{4})?/i);
  if(full) return new Date(`${full[1]} ${full[2]}, ${full[3]||new Date().getFullYear()}`);
  const d=new Date(s); return isNaN(d)?null:d;
}

function daysSince(a){
  const stored=localStorage.getItem('as_lc_'+a.id);
  const d=parseDate(stored||a.lastContact);
  if(!d) return null;
  return Math.max(0,Math.floor((Date.now()-d)/(864e5)));
}

function daysBadge(days,status){
  if(days===null) return {cls:'d-none',lbl:'—'};
  if(days===0) return {cls:'d-fresh',lbl:'Today'};
  if(days<=3) return {cls:'d-fresh',lbl:days+'d ago'};
  if(days<=7) return {cls:'d-ok',lbl:days+'d ago'};
  if(days<=14) return {cls:'d-stale',lbl:days+'d ago'};
  return {cls:'d-urgent',lbl:days+'d ago'};
}

function invChip(info){
  if(!info||info==='—'||info==='N/A') return '<span class="i-na">—</span>';
  const u=info.toUpperCase();
  if(u==='PAID'||u.startsWith('PAID')) return '<span class="ichip i-paid">PAID</span>';
  if(u.includes('PAID')) return '<span class="ichip i-paid">PAID</span>';
  if(u.includes('DUE')||u.includes('INVOICE DUE')) return '<span class="ichip i-due">DUE</span>';
  if(u.includes('PENDING')||u.includes('AWAITING')) return '<span class="ichip i-due">PENDING</span>';
  if(u.includes('EXPIRED')||u.includes('INACTIVE')) return '<span class="ichip i-due">EXPIRED</span>';
  return `<span class="ichip i-pend">${info.slice(0,14)}</span>`;
}

const SB={active:['b-active','Active'],needs:['b-needs','Needs Attention'],awaiting:['b-awaiting','Awaiting'],content:['b-content','Create Content'],prospect:['b-prospect','Prospect'],low:['b-low','Low Priority'],'old-check':['b-old-check','Check Interest']};
function badge(status){const[c,l]=SB[status]||['b-low','Unknown'];return `<span class="badge ${c}">${l}</span>`;}

const SP={needs:0,active:1,awaiting:2,content:3,prospect:4,low:5,'old-check':6};
function pri(a){return SP[a.status]??7;}
function urgency(a){return pri(a)*1000+(daysSince(a)??999);}

function lc(a){
  const s=localStorage.getItem('as_lc_'+a.id);
  if(s){const d=new Date(s);return d.toDateString()===new Date().toDateString()?'Today':d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
  return a.lastContact||'—';
}
function isToday(id){const s=localStorage.getItem('as_lc_'+id);return s&&new Date(s).toDateString()===new Date().toDateString();}

function getLog(id){try{return JSON.parse(localStorage.getItem('as_log_'+id)||'[]');}catch{return [];}}
function addLog(id,note){const l=getLog(id);l.unshift({d:new Date().toISOString(),n:note});localStorage.setItem('as_log_'+id,JSON.stringify(l.slice(0,20)));}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500);}

function markContacted(id,e){
  if(e)e.stopPropagation();
  localStorage.setItem('as_lc_'+id,new Date().toISOString());
  addLog(id,'Marked as contacted');
  renderAll();
  toast('✓ Marked as contacted today');
}

function copyEmail(email,e){
  if(e)e.stopPropagation();
  navigator.clipboard.writeText(email).then(()=>toast('Copied: '+email));
}

// ═══════════════════════════════════════════════════
// FILTER & SORT
// ═══════════════════════════════════════════════════
function filtered(){
  let list=AUTHORS;
  if(filter!=='all') list=list.filter(a=>a.status===filter);
  if(q){const lq=q.toLowerCase();list=list.filter(a=>[a.name,a.primaryProject,a.email,a.social||'',a.notes].join(' ').toLowerCase().includes(lq));}
  return [...list].sort((a,b)=>{
    if(sort==='urgency') return urgency(a)-urgency(b);
    if(sort==='name') return a.name.localeCompare(b.name);
    if(sort==='status') return pri(a)-pri(b);
    if(sort==='invoice'){const iv=s=>{const u=(s||'').toUpperCase();if(u.includes('PAID'))return 0;if(u.includes('DUE')||u.includes('PENDING'))return 1;return 2;};return iv(a.invoiceInfo)-iv(b.invoiceInfo);}
    return 0;
  });
}

      <div><div class="c-name">${a.vipTag?'<span class="vip-dot"></span>':''}${a.name}</div>${a.vipTag?`<div class="vip-tag">${a.vipTag}</div>`:''}</div>

    </div>

      <span class="dbadge ${b.cls}">${b.lbl}</span>

    <div><div class="r-name">${a.vipTag?'<span class="vip-dot"></span>':''}${a.name}</div><div class="r-book">${a.primaryProject}</div></div>

function exportCSV(){
  const H=['Name','Status','Primary Project','Email','Social','Timeline','Invoice','Last Contact','Next Action','Days Since Contact'];
  const rows=AUTHORS.map(a=>[a.name,a.status,a.primaryProject,a.email,a.social||'',a.timeline,a.invoiceInfo||'',lc(a),a.nextAction||'',daysSince(a)!==null?daysSince(a)+'d':'—']);
  const csv=[H,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  const el=document.createElement('a');el.href=url;el.download=`atomic-shelf-${new Date().toISOString().slice(0,10)}.csv`;el.click();
  URL.revokeObjectURL(url);toast('⬇ CSV exported');
}
