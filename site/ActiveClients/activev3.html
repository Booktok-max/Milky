<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="https://atomic-shelf.com/book-and-people-spring-svgrepo-com.svg">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Atomic Shelf · Author CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════ TOKENS */
:root {
  --bg:         #0d0c0a;
  --bg2:        #131210;
  --bg3:        #1a1814;
  --surface:    #1f1d19;
  --surface2:   #262420;
  --border:     #2e2c27;
  --border2:    #3a3830;
  --ink:        #f0ece3;
  --ink2:       #c8c0b0;
  --ink3:       #8a8070;
  --gold:       #c9952a;
  --gold2:      #e8b84a;
  --gold3:      #f5d070;
  --gold-bg:    rgba(201,149,42,.1);
  --gold-glow:  rgba(201,149,42,.15);
  --red:        #c04040;
  --red-bg:     rgba(192,64,64,.12);
  --amber:      #c87820;
  --amber-bg:   rgba(200,120,32,.12);
  --teal:       #2a8a7a;
  --teal-bg:    rgba(42,138,122,.12);
  --blue:       #4878c8;
  --blue-bg:    rgba(72,120,200,.12);
  --green:      #3a9060;
  --green-bg:   rgba(58,144,96,.12);
  --purple:     #8060b8;
  --purple-bg:  rgba(128,96,184,.12);
  --slate:      #606870;
  --slate-bg:   rgba(96,104,112,.12);
  --r:          8px;
  --r-lg:       14px;
  --r-xl:       20px;
  --sh:         0 4px 24px rgba(0,0,0,.4);
  --sh-lg:      0 12px 60px rgba(0,0,0,.6);
  --transition: .18s cubic-bezier(.4,0,.2,1);
}

/* ═══════════════════════════════════════ RESET */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:15px;scroll-behavior:smooth;}
body{
  font-family:'Syne',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  line-height:1.5;
  overflow-x:hidden;
}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ═══════════════════════════════════════ SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}

/* ═══════════════════════════════════════ TOPBAR */
.topbar{
  position:sticky;top:0;z-index:80;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:0 24px;
  height:56px;
  display:flex;align-items:center;gap:20px;
  backdrop-filter:blur(20px);
}
.logo{
  font-family:'Cormorant Garamond',serif;
  font-size:1.45rem;font-weight:700;
  color:var(--gold2);
  letter-spacing:-.01em;
  white-space:nowrap;
  flex-shrink:0;
}
.logo span{color:var(--ink);font-weight:300;font-style:italic;}
.logo sup{font-family:'IBM Plex Mono',monospace;font-size:.42em;color:var(--ink3);vertical-align:super;letter-spacing:.1em;font-style:normal;}

.search-wrap{position:relative;flex:1;max-width:440px;}
.search-ico{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--ink3);pointer-events:none;
}
.search-input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:8px 12px 8px 34px;
  color:var(--ink);
  font-size:.8rem;font-weight:400;
  outline:none;
  transition:border-color var(--transition),background var(--transition);
}
.search-input::placeholder{color:var(--ink3);}
.search-input:focus{border-color:var(--gold);background:var(--surface2);}

.topbar-right{display:flex;gap:8px;align-items:center;margin-left:auto;}
.tbtn{
  display:flex;align-items:center;gap:5px;
  padding:6px 13px;border-radius:var(--r);
  font-size:.75rem;font-weight:600;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--ink2);
  transition:all var(--transition);
  white-space:nowrap;
}
.tbtn:hover{border-color:var(--border2);color:var(--ink);background:var(--surface2);}
.tbtn.gold{background:var(--gold);border-color:var(--gold);color:#0d0c0a;}
.tbtn.gold:hover{background:var(--gold2);}

/* ═══════════════════════════════════════ RIBBON */
.ribbon{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:12px 24px;
  display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
}
.ribbon::-webkit-scrollbar{display:none;}
.rstat{
  flex-shrink:0;
  padding:0 24px 0 0;margin-right:24px;
  border-right:1px solid var(--border);
}
.rstat:last-child{border-right:none;margin-right:0;}
.rnum{
  font-family:'Cormorant Garamond',serif;
  font-size:2rem;font-weight:700;line-height:1;
  color:var(--gold2);
}
.rlbl{
  font-family:'IBM Plex Mono',monospace;
  font-size:.57rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);margin-top:2px;
}

/* ═══════════════════════════════════════ FILTER BAR */
.filterbar{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:0 24px;
  display:flex;align-items:center;gap:4px;
  overflow-x:auto;scrollbar-width:none;
}
.filterbar::-webkit-scrollbar{display:none;}
.ftab{
  flex-shrink:0;
  padding:11px 14px;
  font-size:.72rem;font-weight:600;
  color:var(--ink3);
  background:none;border:none;
  border-bottom:2px solid transparent;
  display:flex;align-items:center;gap:7px;
  transition:all var(--transition);
  white-space:nowrap;
}
.ftab:hover{color:var(--ink);}
.ftab.on{color:var(--gold2);border-bottom-color:var(--gold);}
.fpill{
  font-family:'IBM Plex Mono',monospace;
  font-size:.6rem;
  background:var(--border);color:var(--ink3);
  padding:1px 6px;border-radius:99px;
  transition:all var(--transition);
}
.ftab.on .fpill{background:var(--gold);color:#0d0c0a;}

/* ═══════════════════════════════════════ CONTROLS */
.controls{
  padding:10px 24px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border-bottom:1px solid var(--border);
  background:var(--bg2);
}
.ctrl-lbl{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--ink3);}
.sel{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:5px 10px;
  font-size:.75rem;color:var(--ink);outline:none;
  transition:border-color var(--transition);
}
.sel:focus{border-color:var(--gold);}
.count-txt{
  font-family:'IBM Plex Mono',monospace;
  font-size:.65rem;color:var(--ink3);
  margin-left:auto;
}

/* ═══════════════════════════════════════ MAIN */
.main{padding:20px 24px 64px;}

/* ═══════════════════════════════════════ GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:16px;
}

/* ═══════════════════════════════════════ CARD */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  overflow:hidden;
  transition:transform var(--transition),box-shadow var(--transition),border-color var(--transition);
  display:flex;flex-direction:column;
  position:relative;
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:var(--sh);
  border-color:var(--border2);
}
.card-stripe{height:2px;width:100%;flex-shrink:0;}

/* Status stripe colors */
.s-paid      .card-stripe{background:linear-gradient(90deg,var(--green),var(--teal));}
.s-trial     .card-stripe{background:linear-gradient(90deg,var(--amber),var(--gold));}
.s-trial-end .card-stripe{background:linear-gradient(90deg,var(--red),var(--amber));}
.s-needs     .card-stripe{background:var(--red);}
.s-await     .card-stripe{background:var(--blue);}
.s-create    .card-stripe{background:var(--teal);}
.s-prospect  .card-stripe{background:var(--purple);}
.s-low       .card-stripe{background:var(--slate);}
.s-engage    .card-stripe{background:linear-gradient(90deg,var(--purple),var(--blue));}

.card-inner{padding:15px 16px 14px;display:flex;flex-direction:column;flex:1;gap:0;}

/* Card header */
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
.card-meta{flex:1;min-width:0;}
.vip-tag{
  font-family:'IBM Plex Mono',monospace;
  font-size:.57rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold);background:var(--gold-bg);
  border:1px solid rgba(201,149,42,.25);
  padding:2px 8px;border-radius:4px;
  display:inline-block;margin-bottom:5px;
}
.c-book{
  font-family:'Cormorant Garamond',serif;
  font-size:1.05rem;font-weight:600;line-height:1.25;
  color:var(--ink);margin-bottom:2px;
}
.c-author{
  font-family:'IBM Plex Mono',monospace;
  font-size:.63rem;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.06em;
}
.c-genre{font-size:.68rem;color:var(--teal);font-weight:600;margin-top:2px;}

/* Status badge */
.sbadge{
  flex-shrink:0;
  font-family:'IBM Plex Mono',monospace;
  font-size:.58rem;font-weight:500;letter-spacing:.04em;
  padding:3px 8px;border-radius:99px;
  white-space:nowrap;
}
.b-paid{background:var(--green-bg);color:#5fc890;}
.b-trial{background:var(--amber-bg);color:#e09050;}
.b-trial-end{background:var(--red-bg);color:#e07070;}
.b-needs{background:var(--red-bg);color:#e07070;}
.b-await{background:var(--blue-bg);color:#7aa8e8;}
.b-create{background:var(--teal-bg);color:#4ab8a8;}
.b-prospect{background:var(--purple-bg);color:#a888e0;}
.b-low{background:var(--slate-bg);color:#8090a0;}
.b-engage{background:var(--purple-bg);color:#a888e0;}

/* Card info row */
.card-info{
  display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;
  margin-bottom:10px;
}
.ci{display:flex;flex-direction:column;gap:1px;}
.ci-lbl{
  font-family:'IBM Plex Mono',monospace;
  font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);
}
.ci-val{font-size:.73rem;color:var(--ink2);font-weight:500;}
.ci-val.urgent{color:#e07070;}
.ci-val.ok{color:#e09050;}
.ci-val.fresh{color:#5fc890;}

/* Email chip */
.email-chip{
  font-family:'IBM Plex Mono',monospace;
  font-size:.62rem;color:var(--ink3);
  background:var(--bg3);
  border:1px solid var(--border);
  padding:3px 8px;border-radius:4px;
  cursor:pointer;transition:all var(--transition);
  display:inline-flex;align-items:center;gap:5px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  margin-bottom:8px;
}
.email-chip:hover{background:var(--surface2);border-color:var(--border2);color:var(--ink);}

/* Links row */
.card-links{
  display:flex;flex-wrap:wrap;gap:4px;
  padding:8px 0 6px;
  border-top:1px solid var(--border);
  margin-bottom:8px;
}
.lchip{
  display:inline-flex;align-items:center;gap:4px;
  font-size:.6rem;font-weight:600;
  padding:3px 8px;border-radius:4px;
  border:1px solid var(--border);
  transition:all var(--transition);
  cursor:pointer;
  white-space:nowrap;
}
.lchip:hover{transform:translateY(-1px);}
.lchip-page{color:#7aa8e8;background:var(--blue-bg);border-color:rgba(72,120,200,.2);}
.lchip-page:hover{background:rgba(72,120,200,.2);}
.lchip-drive{color:#5fc890;background:var(--green-bg);border-color:rgba(58,144,96,.2);}
.lchip-drive:hover{background:rgba(58,144,96,.2);}
.lchip-receipt{color:#e09050;background:var(--amber-bg);border-color:rgba(200,120,32,.2);}
.lchip-receipt:hover{background:rgba(200,120,32,.2);}
.lchip-tiktok{color:#f0c0e0;background:rgba(240,192,224,.08);border-color:rgba(240,192,224,.15);}
.lchip-tiktok:hover{background:rgba(240,192,224,.15);}
.lchip-yt{color:#e05050;background:rgba(224,80,80,.08);border-color:rgba(224,80,80,.15);}
.lchip-yt:hover{background:rgba(224,80,80,.15);}

/* Next action */
.next-action{
  background:var(--bg3);border-left:2px solid var(--gold);
  padding:6px 10px;border-radius:0 var(--r) var(--r) 0;
  font-size:.7rem;color:var(--ink2);line-height:1.5;
  margin-bottom:10px;
}
.next-action .na-lbl{
  font-family:'IBM Plex Mono',monospace;font-size:.56rem;
  color:var(--gold);text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:2px;
}

/* Card footer */
.card-foot{display:flex;gap:6px;margin-top:auto;}
.cf-btn{
  font-size:.68rem;font-weight:600;
  padding:5px 11px;border-radius:var(--r);
  border:1px solid var(--border);
  background:var(--bg3);color:var(--ink3);
  transition:all var(--transition);
  white-space:nowrap;
}
.cf-btn:hover{background:var(--surface2);border-color:var(--border2);color:var(--ink);}
.cf-btn.contacted{background:var(--green-bg);border-color:rgba(58,144,96,.3);color:#5fc890;}
.cf-btn.view{background:var(--gold);border-color:var(--gold);color:#0d0c0a;margin-left:auto;}
.cf-btn.view:hover{background:var(--gold2);}

/* ═══════════════════════════════════════ PANEL (DETAIL DRAWER) */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  z-index:150;opacity:0;pointer-events:none;
  transition:opacity .28s;
}
.overlay.on{opacity:1;pointer-events:auto;}

.panel{
  position:fixed;top:0;right:0;
  width:640px;max-width:96vw;height:100vh;
  overflow-y:auto;
  background:var(--bg2);
  z-index:160;
  transform:translateX(100%);
  transition:transform .32s cubic-bezier(.4,0,.2,1);
  box-shadow:var(--sh-lg);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
}
.panel.on{transform:translateX(0);}

.panel-hdr{
  background:var(--bg3);
  padding:20px 24px 16px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:1;
  flex-shrink:0;
}
.panel-close{
  position:absolute;top:14px;right:14px;
  width:30px;height:30px;border-radius:99px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--ink3);
  display:flex;align-items:center;justify-content:center;
  font-size:.9rem;
  transition:all var(--transition);
}
.panel-close:hover{background:var(--red-bg);border-color:var(--red);color:#e07070;}
.ph-book{
  font-family:'Cormorant Garamond',serif;
  font-size:1.5rem;font-weight:700;line-height:1.2;
  color:var(--gold2);padding-right:40px;margin-bottom:3px;
}
.ph-author{
  font-family:'IBM Plex Mono',monospace;
  font-size:.68rem;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;
}
.ph-badges{display:flex;flex-wrap:wrap;gap:6px;}

.panel-body{padding:24px;flex:1;}
.psec{margin-bottom:24px;}
.psec-ttl{
  font-family:'IBM Plex Mono',monospace;
  font-size:.6rem;text-transform:uppercase;letter-spacing:.12em;
  color:var(--ink3);margin-bottom:10px;
  padding-bottom:6px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ibox{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:9px 12px;
}
.ibox-lbl{
  font-family:'IBM Plex Mono',monospace;font-size:.58rem;
  text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-bottom:3px;
}
.ibox-val{font-size:.8rem;color:var(--ink);font-weight:500;line-height:1.4;word-break:break-all;}
.ibox-val a{color:var(--gold);font-weight:400;}
.ibox-val a:hover{text-decoration:underline;}

.notes-box{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:12px;
  font-size:.78rem;color:var(--ink2);line-height:1.7;
  white-space:pre-line;
}
.notes-area{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:11px;
  font-size:.78rem;color:var(--ink);line-height:1.65;
  min-height:90px;resize:vertical;outline:none;
  transition:border-color var(--transition);
}
.notes-area:focus{border-color:var(--gold);}

/* Panel buttons */
.p-btn{
  font-size:.75rem;font-weight:600;
  padding:7px 14px;border-radius:var(--r);
  border:1px solid var(--border);
  background:var(--surface);color:var(--ink2);
  transition:all var(--transition);
  white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
}
.p-btn:hover{background:var(--surface2);color:var(--ink);}
.p-btn.gold{background:var(--gold);border-color:var(--gold);color:#0d0c0a;}
.p-btn.gold:hover{background:var(--gold2);}
.p-btn.teal{background:var(--teal-bg);border-color:rgba(42,138,122,.3);color:#4ab8a8;}
.p-btn.red{background:var(--red-bg);border-color:rgba(192,64,64,.3);color:#e07070;}

.p-actions{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}

/* Log */
.log-item{
  background:var(--surface);border-left:2px solid var(--border2);
  border-radius:0 var(--r) var(--r) 0;
  padding:7px 11px;margin-bottom:6px;
}
.log-date{
  font-family:'IBM Plex Mono',monospace;font-size:.6rem;
  color:var(--ink3);margin-bottom:2px;
}
.log-txt{font-size:.73rem;color:var(--ink2);}

/* ═══════════════════════════════════════ EDIT MODAL */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  z-index:200;display:none;align-items:flex-start;
  justify-content:center;padding:32px 16px;overflow-y:auto;
}
.modal-bg.on{display:flex;}
.modal{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r-xl);
  width:100%;max-width:680px;
  box-shadow:var(--sh-lg);
  animation:modalIn .22s ease both;
  margin:auto;
}
@keyframes modalIn{from{opacity:0;transform:scale(.97) translateY(-10px);}to{opacity:1;transform:none;}}

.modal-hdr{
  padding:20px 24px 16px;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.modal-ttl{
  font-family:'Cormorant Garamond',serif;
  font-size:1.3rem;font-weight:700;color:var(--gold2);
}
.modal-close{
  background:none;border:none;color:var(--ink3);font-size:1.1rem;
  transition:color var(--transition);padding:4px;
}
.modal-close:hover{color:var(--ink);}
.modal-body{padding:22px 24px;}
.modal-foot{
  padding:14px 24px;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:8px;
}

/* Form */
.fg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg.full{grid-column:1/-1;}
.flbl{
  font-family:'IBM Plex Mono',monospace;font-size:.62rem;
  text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);
}
.finput,.fsel,.ftxt{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:8px 11px;
  font-size:.82rem;color:var(--ink);outline:none;
  transition:border-color var(--transition);
  width:100%;
}
.finput:focus,.fsel:focus,.ftxt:focus{border-color:var(--gold);}
.ftxt{resize:vertical;min-height:72px;line-height:1.6;}

/* ═══════════════════════════════════════ STATUS DOTS */
.sdot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  display:inline-block;margin-right:2px;
}
.dot-paid{background:var(--green);}
.dot-trial{background:var(--amber);}
.dot-trial-end{background:var(--red);}
.dot-needs{background:var(--red);}
.dot-await{background:var(--blue);}
.dot-create{background:var(--teal);}
.dot-prospect{background:var(--purple);}
.dot-low{background:var(--slate);}
.dot-engage{background:var(--purple);}

/* ═══════════════════════════════════════ TOAST */
.toast{
  position:fixed;bottom:22px;left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--surface2);color:var(--gold2);
  border:1px solid var(--border2);
  padding:9px 20px;border-radius:99px;

function daysSince(a) {
  const s = localStorage.getItem('as_lc_'+a.id) || a.lastContact;
  if (!s) return null;
  const d = new Date(s);
  if (isNaN(d)) return null;
  return Math.max(0, Math.floor((Date.now() - d) / 86400000));
}
function dayLabel(days) {
  if (days === null) return {txt:'—', cls:''};
  if (days === 0)    return {txt:'Today', cls:'fresh'};
  if (days <= 3)     return {txt:days+'d ago', cls:'fresh'};
  if (days <= 7)     return {txt:days+'d ago', cls:'ok'};
  if (days <= 14)    return {txt:days+'d ago', cls:''};
  return {txt:days+'d ago', cls:'urgent'};
}
function urgency(a) {
  const p = STATUS_CFG[a.status]?.pri ?? 9;
  const d = daysSince(a) ?? 999;
  return p * 1000 + d;
}
function badge(status) {
  const c = STATUS_CFG[status] || {lbl:status, bc:'b-low'};
  return `<span class="sbadge ${c.bc}">${c.lbl}</span>`;
}
function isToday(id) {
  const s = localStorage.getItem('as_lc_'+id);
  return s && new Date(s).toDateString() === new Date().toDateString();
}
function getMyNote(id) { return localStorage.getItem('as_note_'+id) || ''; }
function saveMyNote(id, txt) { localStorage.setItem('as_note_'+id, txt); }
function getLog(id) {
  try { return JSON.parse(localStorage.getItem('as_log_'+id) || '[]'); }
  catch { return []; }
}
function addLog(id, msg) {
  const l = getLog(id);
  l.unshift({t: new Date().toISOString(), m: msg});
  localStorage.setItem('as_log_'+id, JSON.stringify(l.slice(0,30)));
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._to);
  t._to = setTimeout(() => t.classList.remove('on'), 2600);
}
function fmtDate(id, fallback) {
  const s = localStorage.getItem('as_lc_'+id) || fallback;
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d)) return s;
  if (d.toDateString() === new Date().toDateString()) return 'Today';
  return d.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
}
function saveAuthors() {
  localStorage.setItem('as_authors', JSON.stringify(AUTHORS));
  if (API_URL) syncToAPI();
}
function copyText(txt) {
  navigator.clipboard?.writeText(txt).then(() => toast('Copied: ' + txt));
}
function h(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════════════════════
// API SYNC (optional — works when API_URL is set)
// ═══════════════════════════════════════════════════════════════════
async function syncToAPI() {
  if (!API_URL) return;
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'bulkUpdate', authors: AUTHORS }),
    });
  } catch(e) { console.warn('API sync failed:', e); }
}
async function loadFromAPI() {
  if (!API_URL) return;
  try {
    const res = await fetch(API_URL + '?action=read');
    const data = await res.json();
    if (data.success && data.authors?.length) {
      AUTHORS = data.authors;
      localStorage.setItem('as_authors', JSON.stringify(AUTHORS));
      renderAll();
      toast('✓ Loaded from Google Sheets');
    }
  } catch(e) { console.warn('API load failed:', e); }
}

// ═══════════════════════════════════════════════════════════════════
// FILTER + SORT
// ═══════════════════════════════════════════════════════════════════
function filtered() {
  const q = document.getElementById('srch').value.toLowerCase();
  const sort = document.getElementById('sortSel').value;
  let list = AUTHORS;
  if (activeFilter !== 'all') list = list.filter(a => a.status === activeFilter);
  if (q) {
    list = list.filter(a => {
      return [a.name,a.book,a.email||'',a.genre||'',a.notes||'',a.nextAction||'',a.social||''].join(' ').toLowerCase().includes(q);
    });
  }
  return [...list].sort((a,b) => {
    if (sort==='urgency') return urgency(a) - urgency(b);
    if (sort==='status')  return (STATUS_CFG[a.status]?.pri??9) - (STATUS_CFG[b.status]?.pri??9);
    if (sort==='name')    return (a.book||'').localeCompare(b.book||'');
    if (sort==='author')  return (a.name||'').localeCompare(b.name||'');
    return 0;
  });
}

// ═══════════════════════════════════════════════════════════════════
// RIBBON
// ═══════════════════════════════════════════════════════════════════
function renderRibbon() {
  const paid    = AUTHORS.filter(a => a.status==='paid').length;
  const active  = AUTHORS.filter(a => a.status==='paid'||a.status==='trial').length;
  const needs   = AUTHORS.filter(a => a.status==='needs'||a.status==='trial-end').length;
  const overdue = AUTHORS.filter(a => { const d=daysSince(a); return d!==null&&d>7&&a.status!=='low'&&a.status!=='engage'; }).length;
  const stats = [
    {n:AUTHORS.length, l:'Total Authors'},
    {n:active,         l:'Active Campaigns'},
    {n:paid,           l:'Paid Retainers'},
    {n:needs,          l:'Needs Action'},
    {n:overdue,        l:'>7d No Contact'},
  ];
  document.getElementById('ribbon').innerHTML = stats.map(s =>
    `<div class="rstat"><div class="rnum">${s.n}</div><div class="rlbl">${s.l}</div></div>`
  ).join('');
}

// ═══════════════════════════════════════════════════════════════════
// FILTER TABS
// ═══════════════════════════════════════════════════════════════════
function renderTabs() {
  const counts = {};
  AUTHORS.forEach(a => { counts[a.status] = (counts[a.status]||0)+1; });
  document.getElementById('filterbar').innerHTML = TAB_DEFS.map(t => `
    <button class="ftab ${activeFilter===t.k?'on':''}" onclick="setFilter('${t.k}')">
      ${t.l} <span class="fpill">${t.k==='all'?AUTHORS.length:(counts[t.k]||0)}</span>
    </button>`).join('');
}

// ═══════════════════════════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════════════════════════
function renderAll() {
  renderRibbon();
  renderTabs();
  const list = filtered();
  document.getElementById('countTxt').textContent = list.length + ' of ' + AUTHORS.length + ' authors';
  const el = document.getElementById('main');

    el.innerHTML = `<div class="empty"><span class="empty-ico">📭</span><div class="empty-ttl">No results</div><p>Try a different search or filter.</p></div>`;
    return;

  el.innerHTML = `<div class="grid">${list.map(buildCard).join('')}</div>`;
}

function setFilter(k) { activeFilter = k; renderAll(); }
function markContacted(id, e) {
  if (e) e.stopPropagation();
  localStorage.setItem('as_lc_'+id, new Date().toISOString());
  addLog(id, 'Marked as contacted');
  renderAll();
  if (activePanel === id) openPanel(id);
  toast('✓ Marked as contacted');
}
function updateStatus(id, newStatus) {
  const a = AUTHORS.find(x => x.id === id);
  if (!a) return;
  const old = a.status;
  a.status = newStatus;
  saveAuthors();
  addLog(id, `Status changed: ${old} → ${newStatus}`);
  renderAll();
  if (activePanel === id) openPanel(id);
  toast('✓ Status updated to: ' + STATUS_CFG[newStatus]?.lbl);
}

function saveNote(id) {
  const v = document.getElementById('pnote_'+id)?.value || '';
  saveMyNote(id, v);
  addLog(id, `Note saved: "${v.slice(0,60)}${v.length>60?'…':''}"`);
  renderAll();
  toast('✓ Note saved');
}
function addLink(id) {
  const lbl = document.getElementById('addlnk_lbl_'+id)?.value?.trim();
  const url  = document.getElementById('addlnk_url_'+id)?.value?.trim();
  if (!lbl || !url) { toast('Enter both label and URL'); return; }
  const a = AUTHORS.find(x => x.id === id);
  if (!a) return;
  // Detect type and store in right field
  if (url.includes('drive.google')) { a.linkDrive = url; }
  else if (url.toLowerCase().includes('receipt')) { a.linkReceipt = url; }
  else if (url.includes('tiktok.com')) { a.tiktok = url; }
  else if (url.includes('youtube.com')) { a.youtube = url; }
  else { a.linkPage = url; } // default to campaign page
  saveAuthors();
  addLog(id, `Link added: ${lbl} → ${url}`);
  openPanel(id); // refresh panel
  toast('✓ Link added');
}

function val(id) { return document.getElementById(id)?.value?.trim() || ''; }
function saveModal(editId) {
  const name = val('mf_name');
  const book = val('mf_book');
  if (!name || !book) { toast('Name and book are required'); return; }

  const fields = ['name','email','book','genre','status','payment','retainer','social','timeline','nextAction','linkPage','linkDrive','linkReceipt','tiktok','youtube','views','series','vip','notes'];
  if (editId) {
    const a = AUTHORS.find(x => x.id === editId);
    if (!a) return;
    fields.forEach(f => { a[f] = val('mf_'+f); });
    saveAuthors();
    addLog(editId, 'Author record updated');
    toast('✓ Changes saved');
  } else {
    const newId = 'author_'+Date.now();
    const a = { id: newId, lastContact: new Date().toISOString().split('T')[0] };
    fields.forEach(f => { a[f] = val('mf_'+f); });
    AUTHORS.push(a);
    saveAuthors();
    addLog(newId, 'Author added');
    toast('✓ Author added');
  }
  closeModal();
  renderAll();
  if (editId && activePanel === editId) openPanel(editId);
}
function deleteAuthor(id) {
  if (!confirm('Delete this author? This cannot be undone.')) return;
  AUTHORS = AUTHORS.filter(a => a.id !== id);
  saveAuthors();
  closeModal();
  if (activePanel === id) closePanel();
  renderAll();
  toast('Author deleted');
}

// ═══════════════════════════════════════════════════════════════════
// CSV EXPORT
// ═══════════════════════════════════════════════════════════════════
function exportCSV() {
  const headers = ['Name','Book','Genre','Status','Email','Social','Timeline','Retainer','Payment','Last Contact','Next Action','Views','Series','Campaign Page','Drive','Notes'];
  const rows = filtered().map(a => [
    a.name, a.book, a.genre||'',
    STATUS_CFG[a.status]?.lbl||a.status,
    a.email, a.social||'', a.timeline||'',
    a.retainer||'', a.payment||'',
    fmtDate(a.id, a.lastContact),
    a.nextAction||'', a.views||'', a.series||'',
    a.linkPage||'', a.linkDrive||'', a.notes||''
  ]);
  const csv = [headers, ...rows].map(r =>
    r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')
  ).join('\n');
  const url = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  const el = document.createElement('a');
  el.href=url; el.download=`atomic-shelf-${new Date().toISOString().slice(0,10)}.csv`;
  el.click(); URL.revokeObjectURL(url);
  toast('⬇ CSV exported');
}

  if ((e.metaKey||e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('srch').focus();
  }
});
