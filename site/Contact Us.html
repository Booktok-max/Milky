<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="https://atomic-shelf.com/book-and-people-spring-svgrepo-com.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Atomic-Shelf</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Georgia, 'Times New Roman', serif; }
    .form-card { background: #dbeafe; }
  </style>
</head>
<body class="bg-[#eff6ff] text-[#1e3a8a] min-h-screen flex items-center justify-center p-6">
  <div class="max-w-2xl w-full">
    <div class="text-center mb-10">
      <div class="inline-flex items-center gap-3 text-5xl font-extrabold bg-gradient-to-r from-blue-600 to-blue-800 text-transparent bg-clip-text">
        Atomic-Shelf 💎
      </div>
      <h1 class="text-4xl font-bold mt-4">Get in Touch</h1>
      <p class="text-xl text-blue-700 mt-2">Tell us about your book — we'll reply within 24 hours</p>
    </div>

    <div class="form-card rounded-3xl shadow-2xl p-10 border border-blue-300">
      <form id="contactForm" class="space-y-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium mb-2">Full Name</label>
            <input type="text" id="name" required
                   class="w-full px-5 py-4 rounded-2xl border border-blue-300 focus:outline-none focus:border-blue-600 text-lg">
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">Email Address</label>
            <input type="email" id="email" required
                   class="w-full px-5 py-4 rounded-2xl border border-blue-300 focus:outline-none focus:border-blue-600 text-lg">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium mb-2">Book Title (optional)</label>
            <input type="text" id="bookTitle"
                   class="w-full px-5 py-4 rounded-2xl border border-blue-300 focus:outline-none focus:border-blue-600 text-lg">
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">Genre</label>
            <select id="genre"
                    class="w-full px-5 py-4 rounded-2xl border border-blue-300 focus:outline-none focus:border-blue-600 text-lg">
              <option value="">Select genre...</option>
              <option value="Romance & LGBTQ+">Romance & LGBTQ+</option>
              <option value="Fantasy & Romantasy">Fantasy & Romantasy</option>
              <option value="Mystery & Thriller">Mystery & Thriller</option>
              <option value="Self-Help & Growth">Self-Help & Growth</option>
              <option value="Children's Books">Children's Books</option>
              <option value="Contemporary Fiction">Contemporary Fiction</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Your Message</label>
          <textarea id="message" rows="6" required
                    class="w-full px-5 py-4 rounded-3xl border border-blue-300 focus:outline-none focus:border-blue-600 text-lg resize-y"></textarea>
        </div>

        <button type="submit"
                id="submitBtn"
                class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold text-xl py-6 rounded-3xl transition-all shadow-lg">
          Send Message
        </button>
      </form>

      <div id="status" class="mt-6 text-center text-lg font-medium hidden"></div>
    </div>

    <p class="text-center text-sm text-blue-600 mt-8">
      Or email us directly: <a href="mailto:nick@atomic-shelf.com" class="underline">nick@atomic-shelf.com</a>
    </p>
  </div>

 <script>
  const form = document.getElementById('contactForm');
  const status = document.getElementById('status');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Sending...';
    status.classList.remove('hidden', 'text-green-600', 'text-red-600');
    status.textContent = '';

    const data = {
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      bookTitle: document.getElementById('bookTitle').value.trim(),
      genre: document.getElementById('genre').value,
      message: document.getElementById('message').value.trim()
    };

    try {
      const res = await fetch('const res = await fetch('https://brevo-git-main-booktok-maxs-projects.vercel.app/api/contact', {', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const result = await res.json();

      if (res.ok && result.success) {
        status.innerHTML = `✅ ${result.message}<br><span class="text-sm">We'll reply within 24 hours!</span>`;
        status.classList.add('text-green-600');
        form.reset();
      } else {
        throw new Error(result.error || 'Server error');
      }
    } catch (err) {
      console.error(err);
      status.innerHTML = `❌ Could not send message.<br>Please email <strong>nick@atomic-shelf.com</strong> directly.`;
      status.classList.add('text-red-600');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send Message';
    }
  });
</script>
</body>
</html>
