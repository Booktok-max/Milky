  {book:'jade', vo:"At six years old, Clara watched everything she loved burn. Her parents. Her home. Her memories. All that remained was the jade necklace around her neck. Fifteen years later, the past is catching up with her — and the power she's been suppressing is about to explode. The Jade Necklace by Jad Phillip. Start the series today — link in bio.", title:"A Childhood Tragedy. A Thousand-Year Secret. One Necklace.", desc:"Six years old. A fire. A massacre. A jade necklace that survived everything. Fifteen years later, the truth comes for Clara — and it's not coming gently. 💚🔥", tags:"#TheJadeNecklace #JadPhillip #BookTok #DarkFantasy #FantasyRomance #Romantasy #OriginStory #KindleUnlimited #AmazonBooks #ChosenAndCursed"},
  {book:'monster', vo:"Aurora didn't just escape an arranged marriage. She escaped something that was suppressing the power inside her. Now that she's free — and now that she's near him — something ancient is waking up. Something her stepmother desperately wants to control. To Love a Monster by Jad Phillip — the story where love is the most dangerous magic of all. On Amazon now!", title:"Forbidden Powers Awakening", desc:"The escape awakened something in her. Forbidden powers. Ancient magic. And a connection to the creature who saved her that defies every rule her kingdom ever wrote. ⚡🖤", tags:"#ForbiddenPowers #MagicAwakening #ToLoveaMonster #JadPhillip #BookTok #Romantasy #FantasyRomance #PowerfulHeroine #KindleUnlimited #AmazonBooks"},

  // Day 12 – May 26
  {book:'shards', vo:"Robin wants to protect Clara. His darkness wants to consume everything around him. Every time he gets close to her, he has to fight himself — the monster, the desire, the thousand years of violence inside him. The Black Shards turns their relationship into something genuinely dangerous and genuinely beautiful. On Amazon and Kindle Unlimited — link in bio.", title:"The Protector vs the Predator", desc:"He protects her. He's also the most dangerous thing near her. Robin's internal war in The Black Shards makes for one of fantasy's most compelling love interests. 🖤⚔️", tags:"#TheBlackShards #JadPhillip #MorallyGrayRomance #ForbiddenLove #SlowBurn #BookTok #Romantasy #FantasyRomance #KindleUnlimited #AmazonBooks"},
  {book:'life', vo:"'I finished it in one sitting. This is one of the best fantasy books I've ever read.' That's a real Amazon review of The Book of Life. Five stars. Zero hesitation. If you've been following The Chosen and the Cursed, Book Three is the one that will break your heart and put it back together again. On Amazon — link in bio.", title:"Readers Finished It in One Sitting", desc:"'One of the best fantasy books I've ever read.' A reader who finished in one sitting. The Book of Life is the series entry that fans can't stop talking about. ⭐⭐⭐⭐⭐", tags:"#TheBookofLife #JadPhillip #FiveStars #BookReview #BookTok #Romantasy #FantasyRomance #OneSitRead #KindleUnlimited #AmazonBooks"},

  // Day 13 – May 27
  {book:'crown', vo:"By the end of The Chosen and the Cursed, Clara isn't the girl she was. She's lost friends. Lost her innocence. Lost parts of herself she can never get back. But in their place — purpose. The Crimson Crown is about what it costs to win. And whether the Clara who wins is still someone she recognizes. On Amazon — link in bio.", title:"Right and Wrong Blur. Survival Demands Everything.", desc:"She's lost her friends, her innocence, and her powers. But in their place: purpose. The Crimson Crown asks what it costs to win — and whether winning is enough. 💔👑", tags:"#TheCrimsonCrown #JadPhillip #CharacterGrowth #BookTok #Romantasy #DarkFantasy #SeriesEnding #ChosenAndCursed #KindleUnlimited #AmazonBooks"},
  {book:'jade', vo:"Clara and Robin's love story doesn't happen fast. It shouldn't. He's been alive a thousand years. She's been through trauma that would break most people. What they build — slowly, painfully, beautifully — is one of the most earned romances in modern fantasy. If you've been burned by rushed love stories, The Jade Necklace is the reset you need. On Amazon now!", title:"Slow Burn Romance Done Right", desc:"Slow burn done RIGHT. Clara and Robin's love story is agonizingly, beautifully earned over an entire series. This is the book that starts it all. 🖤✨", tags:"#SlowBurn #SlowBurnRomance #FantasyRomance #TheJadeNecklace #JadPhillip #BookTok #Romantasy #RomanceBooks #KindleUnlimited #EnemiestoLovers"},

  // Day 14 – May 28
  {book:'monster', vo:"Aurora isn't strong because the plot says so. She's strong because she acts — she escapes, she fights, she makes choices even when they're terrifying. And she falls in love in a way that never weakens her. She stays herself through every trial. To Love a Monster by Jad Phillip is the book strong-heroine fans have been waiting for. Link in bio!", title:"This Is How You Write a Strong Heroine", desc:"Aurora doesn't just survive — she fights, chooses, and falls in love without losing herself. To Love a Monster is the strong-heroine story done right. 👑⚔️", tags:"#StrongHeroine #ToLoveaMonster #JadPhillip #BookTok #FeministFantasy #Romantasy #ForbiddenLove #YAFantasy #KindleUnlimited #AmazonBooks"},
  {book:'shards', vo:"The International Review of Books called The Black Shards 'utterly addictive' and said the writing 'keeps you up well into the night.' They praised the pacing as relentless, the world-building as layered, and the blending of fairytale and dark romantasy as masterful. That's the kind of review that means something. Find it on Amazon — link in bio.", title:"An International Review of Books Pick", desc:"Called 'utterly addictive' by the International Review of Books. The Black Shards is the sequel that doesn't just match Book One — it surpasses it. 📰⭐", tags:"#TheBlackShards #JadPhillip #BookReview #InternationalReview #BookTok #Romantasy #DarkFantasy #SlowBurn #KindleUnlimited #AmazonBooks"},

  // Day 15 – May 29
  {book:'life', vo:"In The Book of Life, no one is safe and no one is fully trustworthy. Allies become uncertain. Ancient powers long buried begin to surface. And the book that holds the key to Clara's destiny has pages she never knew existed. Jad Phillip turns the screw in Book Three — and it is genuinely breathtaking. On Amazon and Kindle Unlimited — link in bio.", title:"Betrayals Loom. Ancient Powers Awaken.", desc:"Allies become uncertain. Ancient powers stir. And the Book of Life holds pages Clara never knew existed. This is the series entry where everything unravels — beautifully. 🕯️📖", tags:"#TheBookofLife #JadPhillip #BookTok #Romantasy #DarkFantasy #Betrayal #AncientMagic #FantasyRomance #KindleUnlimited #AmazonBooks"},
  {book:'crown', vo:"Thwarted for three books. Pushed apart by prophecy, power, and pain. But in The Crimson Crown, Robin and Clara's bond finally burns brighter than everything standing in their way. Jad Phillip gives these two characters the ending they've earned — beautifully, heartbreakingly, perfectly. On Amazon and Kindle Unlimited — link in bio.", title:"Their Bond Finally Burns Bright", desc:"Three books of waiting. One book of payoff. Robin and Clara's bond in The Crimson Crown finally burns brighter than everything in their way. Worth every page. 🔥🖤", tags:"#TheCrimsonCrown #JadPhillip #SlowBurnPayoff #ClaraAndRobin #BookTok #Romantasy #FantasyRomance #ForbiddenLove #KindleUnlimited #AmazonBooks"},

  {book:'jade', vo:"Clara thinks she's a normal pre-med student. She has a best friend. A crush. A quiet apartment and a life she built from the ruins of her past. Then a stranger attacks her — and something inside her snaps. Raw, electric, impossible power. She is not what she thought she was. Not even close. The Jade Necklace — on Amazon and Kindle Unlimited.", title:"Meet Clara — The Girl Who Doesn't Know What She Is", desc:"She thought she was ordinary. She was wrong. Clara's awakening in The Jade Necklace is one of the most satisfying moments in YA fantasy. Don't miss it. ⚡", tags:"#TheJadeNecklace #ChosenOne #FantasyBooks #BookTok #JadPhillip #Romantasy #YAFantasy #PowerAwakening #KindleUnlimited #AmazonBooks"},
  {book:'monster', vo:"'The vivid descriptions of her magical abilities and palace intrigue made it feel like a cinematic adventure.' That's a real review of To Love a Monster by Jad Phillip. The writing puts you inside a world you can see, hear, and feel. If you've been looking for a fantasy that plays like a film in your head — this is it. Available on Amazon — link in bio.", title:"Readers Called It a Cinematic Adventure", desc:"'It felt like a cinematic adventure.' Readers say To Love a Monster reads like a film you can't look away from — full of magic, palace intrigue, and forbidden tension. 🎬✨", tags:"#ToLoveaMonster #JadPhillip #CinematicReads #BookTok #Romantasy #FantasyRomance #ForbiddenLove #PalaceIntrigue #KindleUnlimited #AmazonBooks"},

  // Day 17 – May 31
  {book:'shards', vo:"There's a character in The Black Shards unlike any other in the series: a fae-human hybrid, raised as a king's son, then betrayed, killed, and resurrected by a vampire — only to be imprisoned for his heritage. He is the last of his kind. And he changes everything. The Black Shards — where the world gets bigger and darker. On Amazon now!", title:"The Fae-Vampire Hybrid No One Expected", desc:"A fae-human hybrid. Stolen. Betrayed. Resurrected. Imprisoned. The Black Shards introduces a character so compelling, readers couldn't stop talking about him. 🧝🧛", tags:"#TheBlackShards #JadPhillip #FaeFantasy #HybridCharacter #BookTok #Romantasy #DarkFantasy #FantasyLore #KindleUnlimited #AmazonBooks"},
  {book:'life', vo:"Robin and Clara have always had obstacles. But The Book of Life puts the kind of obstacles between them that feel truly impossible — an escaped, murderous father. A prophecy that names Clara as the end of the world. A blood moon that's almost here. Their love has never been more tested or more worth rooting for. On Amazon — link in bio.", title:"Love Under the Most Impossible Conditions", desc:"A murderous father. A world-ending prophecy. A blood moon. Robin and Clara's love in The Book of Life is tested like never before — and more worth rooting for than ever. 🖤🌒", tags:"#TheBookofLife #JadPhillip #ForbiddenLove #FantasyRomance #BookTok #Romantasy #SlowBurn #EnemiestoLovers #KindleUnlimited #AmazonBooks"},

  // Day 18 – June 1
  {book:'crown', vo:"Three books of watching Clara run from what she is. In The Crimson Crown, she stops running. Her destiny is finally clear. The jade necklace. The black blade. The book of life. The crimson crown. Everything she's survived has brought her here — to the final battle. And she walks toward it. On Amazon — link in bio.", title:"Her Destiny Is No Longer Shrouded in Shadow", desc:"She stopped running. She knows who she is. She knows what she carries. In The Crimson Crown, Clara walks toward her destiny — and it's extraordinary. ⚡👑", tags:"#TheCrimsonCrown #JadPhillip #DestinyRevealed #BookTok #Romantasy #DarkFantasy #HeroineArc #ChosenAndCursed #KindleUnlimited #AmazonBooks"},
  {book:'jade', vo:"The Chosen and the Cursed series by Jad Phillip has everything BookTok loves: forbidden love, slow burn, morally complex characters, ancient magic, and a world that keeps getting darker as the stakes get higher. It starts with The Jade Necklace and does not let go. Four books. One unforgettable saga. Grab Book One on Amazon — link in bio!", title:"Why BookTok Is Obsessed With This Series", desc:"Everything BookTok loves in one series: forbidden love, slow burn, ancient magic, morally gray characters, and devastating stakes. Start with The Jade Necklace. 📚🖤", tags:"#BookTok #TheChosenAndTheCursed #JadPhillip #SlowBurn #ForbiddenLove #Romantasy #FantasyRomance #BookSeries #KindleUnlimited #AmazonBooks"},

  // Day 19 – June 2
  {book:'monster', vo:"To Love a Monster stands on its own — you can read it without having read The Chosen and the Cursed. But if you're a fan of the series, you'll recognize familiar faces and a world that now feels richer and deeper. Jad Phillip built a universe. And To Love a Monster is its most romantic corner. Available on Amazon and Kindle Unlimited — link in bio!", title:"A Standalone Story Connected to the Main Series", desc:"A standalone you can read fresh OR a deeper layer of the main series. To Love a Monster rewards both new readers and fans of The Chosen and the Cursed. 📚🖤", tags:"#ToLoveaMonster #JadPhillip #Standalone #BookSeries #ChosenAndCursed #BookTok #Romantasy #ForbiddenLove #KindleUnlimited #AmazonBooks"},
  {book:'shards', vo:"The vampires in The Chosen and the Cursed don't just want to feed. They want to awaken Lilith — the primordial vampire goddess — and plunge the entire world into eternal darkness. That's the threat building in the background of The Black Shards. And every chapter brings them closer. The Black Shards by Jad Phillip — on Amazon and Kindle Unlimited.", title:"The Vampires Have a Plan. And It's Apocalyptic.", desc:"The vampires have a plan: awaken Lilith and end the world as we know it. The Black Shards raises the stakes to apocalyptic levels — and it's thrilling. 🩸🌑", tags:"#TheBlackShards #Lilith #VampireApocalypse #WorldEndingStakes #JadPhillip #BookTok #DarkFantasy #Romantasy #KindleUnlimited #AmazonBooks"},

  // Day 20 – June 3
  {book:'life', vo:"The prophecy says Clara is the harbinger of darkness. But prophecies have been wrong before. Can she find a new path — one that doesn't require her to become what everyone fears? The Book of Life is the most philosophical entry in The Chosen and the Cursed, and the most emotionally devastating. On Amazon and Kindle Unlimited — link in bio.", title:"Can a Destiny Be Rewritten?", desc:"The prophecy calls her the end of the world. But Clara is determined to rewrite it. The Book of Life asks whether destiny is fixed — or whether it can be unmade. ✨", tags:"#TheBookofLife #JadPhillip #ProphecyBooks #DestinyAndChoice #BookTok #Romantasy #DarkFantasy #PhilosophicalFantasy #KindleUnlimited #AmazonBooks"},
  {book:'crown', vo:"That's the impossible contradiction at the heart of The Crimson Crown. Robin is the monster Clara was warned about. He's also the man who has been by her side through every battle, every loss, every moment she almost gave up. The final book asks whether love is powerful enough to survive destiny. The answer — is everything. On Amazon now.", title:"The Monster She Fears. The Man She Loves.", desc:"The monster she fears. The man she loves. The protector she never asked for. The Crimson Crown gives Clara and Robin the ending this impossible love deserves. 🖤", tags:"#TheCrimsonCrown #JadPhillip #MonsterRomance #ForbiddenLove #SlowBurn #BookTok #Romantasy #FantasyRomance #KindleUnlimited #AmazonBooks"},

  // Day 21 – June 4
  {book:'jade', vo:"You know the feeling — you pick up a book at ten p.m. and suddenly it's two in the morning and you're in too deep to stop. The Jade Necklace is that book. Multiple readers have said they finished it in one sitting. Ancient magic, emotional depth, a love story that actually earns it — all in one. Link in bio to find it on Amazon.", title:"The 2 AM Book You've Been Looking For", desc:"The kind of book you start at 10pm and finish at 2am. Multiple readers report one-sitting reads. The Jade Necklace is that good — and it's just the beginning. 🌙", tags:"#OneSitRead #BookTok #TheJadeNecklace #JadPhillip #FantasyBooks #Romantasy #CantPutItDown #KindleUnlimited #AmazonBooks #ReadingCommunity"},
  {book:'monster', vo:"The darkness in To Love a Monster isn't just out there in the world — it's inside the palace. Dorova's schemes have been spreading like poison through the king's court for years. Aurora can feel it. She just can't prove it. Until now. A dark fairy tale about power, truth, and the courage to name the real monster. On Amazon — link in bio.", title:"Dark Magic at the Heart of the Throne", desc:"The real darkness isn't outside the castle walls — it's on the throne. To Love a Monster is a dark fairy tale about courage, truth, and naming the real monster. 👑🌑", tags:"#ToLoveaMonster #DarkFairytale #PalaceIntrigue #JadPhillip #BookTok #Romantasy #DarkFantasy #EvilQueen #KindleUnlimited #AmazonBooks"},

  // Day 22 – June 5
  {book:'shards', vo:"'Once you start reading The Black Shards, there's no stopping.' 'It's utterly addictive.' 'I tore through it in just a couple of sittings.' These are real readers. Real reviews. The second book in The Chosen and the Cursed series earns every word. Find it on Amazon — link in bio.", title:"Readers Called It Unputdownable", desc:"'There's no stopping once you start.' Real readers. Real reviews. The Black Shards is the sequel that earns every bit of praise it gets. 🔥📖", tags:"#TheBlackShards #JadPhillip #BookReview #CantPutItDown #BookTok #Romantasy #FantasyRomance #SlowBurn #KindleUnlimited #AmazonBooks"},
  {book:'life', vo:"The Book of Life promises sacrifices — and it delivers. Not every character makes it through intact. Not every relationship survives. Jad Phillip does not shy away from the cost of war, love, and power in this third installment. If you thought you were prepared, you're not. On Amazon and Kindle Unlimited — link in bio.", title:"Sacrifices Will Be Made", desc:"The Book of Life promised sacrifices — and it delivers. Not everyone survives. Not everything survives. This is the book that costs you something. 💔", tags:"#TheBookofLife #JadPhillip #CharacterDeaths #BookTok #Romantasy #DarkFantasy #BookFeelings #FantasyRomance #KindleUnlimited #AmazonBooks"},

  // Day 23 – June 6
  {book:'crown', vo:"'As the fourth and final book in the series, it delivers a satisfying and well-earned conclusion that ties everything together beautifully.' Real reader. Real review. Verified purchase. The Crimson Crown pays off four books of investment — every mystery, every hint, every heartbreak. On Amazon — link in bio.", title:"A Satisfying Conclusion That Ties Everything Together", desc:"'Ties everything together beautifully.' A real reader. A real review. The Crimson Crown is the series finale that earns every star it's been given. ⭐⭐⭐⭐⭐", tags:"#TheCrimsonCrown #JadPhillip #SeriesConclusion #BookReview #BookTok #Romantasy #DarkFantasy #ChosenAndCursed #KindleUnlimited #AmazonBooks"},
  {book:'jade', vo:"What makes The Jade Necklace stand out from other fantasy is how it blends ancient, mythological darkness with completely relatable modern life — college classes, friendship drama, unrequited love. Clara lives in the real world. And the real world is being invaded by something very, very old. Jad Phillip's debut series is something special. Grab it on Amazon — link in bio!", title:"Ancient Magic Meets Modern Life", desc:"Ancient magic bleeding into modern life. College classes by day, gargoyles and vampires by night. The Jade Necklace is grounded fantasy done brilliantly. 🌆🔮", tags:"#UrbanFantasy #ModernFantasy #TheJadeNecklace #JadPhillip #BookTok #Romantasy #CollegeLife #AncientMagic #KindleUnlimited #AmazonBooks"},

  {book:'shards', vo:"The world gets bigger. The stakes get higher. Robin and Clara's tension finally ignites. And the mythology that felt distant in Book One moves terrifyingly close. The Black Shards is the book in this series where everything accelerates — and where you'll truly understand how vast and dark this world is. Book Two. Available on Amazon — link in bio.", title:"If You Haven't Read Book Two Yet, Here's Why You Should", desc:"The world gets bigger. The romance finally ignites. The threat becomes terrifyingly real. The Black Shards is where The Chosen and the Cursed becomes epic. 🌍🔥", tags:"#TheBlackShards #JadPhillip #BookTwo #SeriesUpdate #BookTok #Romantasy #EpicFantasy #SlowBurnPayoff #KindleUnlimited #AmazonBooks"},

  monster: 'To Love a Monster'
};

const startDate = new Date(2026, 4, 15);
let activeFilter = 'all';

function formatDate(d){
  return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
}

function buildCard(num, v){
  const asin = BOOKS[v.book].asin;
  const amazonUrl = `https://www.amazon.com/dp/${asin}`;
  const bookName = BOOK_NAMES[v.book];
  const search = (v.title + ' ' + v.vo + ' ' + v.desc + ' ' + v.tags + ' ' + bookName).toLowerCase();

  return `
  <div class="video-card" data-book="${v.book}" data-search="${search}">
    <div class="card-top">
      <div class="video-num">VIDEO #${String(num).padStart(2,'0')}</div>
      <div class="book-tag" data-book="${v.book}">${BOOKS[v.book].emoji} ${bookName}</div>
    </div>
    <div class="card-body">
      <div class="section-label">🎙 Voiceover Script</div>
      <div class="vo-text" id="vo-${num}">${v.vo}</div>
      <button class="copy-btn" onclick="copyText('vo-${num}',this,'Copy Voiceover')">Copy Voiceover</button>

      <div class="section-label" style="margin-top:1.5rem">📝 Title · Description · Hashtags</div>
      <div class="desc-text" id="desc-${num}">
        <strong>${v.title}</strong><br/><br/>
        ${v.desc}<br/><br/>
        <span class="hashtags">${v.tags}</span>
      </div>
      <button class="copy-btn" onclick="copyText('desc-${num}',this,'Copy Description')">Copy Description</button>

      <a class="amazon-link" href="${amazonUrl}" target="_blank" rel="noopener">
        Shop on Amazon →
      </a>
    </div>
  </div>`;
}

function buildCards(){
  const container = document.getElementById('allCards');
  let html = '';
  for(let day=0;day<30;day++){
    const date = new Date(startDate);
    date.setDate(startDate.getDate()+day);
    const v1 = videos[day*2];
    const v2 = videos[day*2+1];
    html += `
    <div class="day-group">
      <div class="day-label">
        <div class="day-number">Day ${day+1}</div>
        <div class="day-date">${formatDate(date)}</div>
      </div>
      <div class="day-cards">
        ${buildCard(day*2+1, v1)}
        ${buildCard(day*2+2, v2)}
      </div>
    </div>`;
  }
  container.innerHTML = html;
}

function copyText(id, btn, label){
  const el = document.getElementById(id);
  navigator.clipboard.writeText(el.innerText).then(()=>{
    btn.classList.add('copied');
    btn.textContent = '✅ Copied!';
    setTimeout(()=>{ 
      btn.classList.remove('copied');
      btn.textContent = label;
    }, 2000);
  });
}

function filterCards(){
  const q = document.getElementById('searchBox').value.toLowerCase().trim();
  let visible = 0;
  document.querySelectorAll('.video-card').forEach(c=>{
    const bookMatch = activeFilter==='all' || c.dataset.book===activeFilter;
    const searchMatch = !q || c.dataset.search.includes(q);
    const show = bookMatch && searchMatch;
    c.style.display = show ? '' : 'none';
    if(show) visible++;
  });
  document.getElementById('visibleCount').textContent = visible;
}

function setFilter(book, btn){
  activeFilter = book;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filterCards();
}

buildCards();
</script>
</body>
</html>
