/* ── Content Library helpers ─────────────────────────────────────── */
function _wcToggle(id, hdr) {
  const el = document.getElementById(id); if (!el) return;
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  const arrow = hdr && hdr.querySelector('[class$="-arrow"]');
  if (arrow) arrow.style.transform = open ? 'rotate(0)' : 'rotate(180deg)';
}
function _clipFallback(text, done) {
  const ta = document.createElement('textarea'); ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (_) {} ta.remove(); if (done) done();
}
function copyToClip(text, btn) {
  const done = () => { if (btn) { const t = btn.textContent; btn.textContent = '✓'; setTimeout(() => { btn.textContent = t; }, 1400); } };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => _clipFallback(text, done));
  } else { _clipFallback(text, done); }
}

/* ═════════════════════════════════════════════════════════════════
   Content Library · per-week videos (named) + their scripts, copyable.
   The team enters this in the Command Centre; the author watches the
   series build up here, week by week.
   ═════════════════════════════════════════════════════════════════ */
function buildContentScriptsSection(b) {
  const wc = b.weeklyContent || {};
  const weekNums = Object.keys(wc).map(Number).filter(n => n > 0).sort((a, z) => a - z);
  let totalVideos = 0;
  weekNums.forEach(wn => { totalVideos += (wc[String(wn)] || []).length; });

  if (!totalVideos) {
    return section({
      id: 'sec-content', icon: '📚', title: 'Content Library',
      pills: [{ text: 'Building up', cls: '' }], accent: 'acc-blue', startOpen: false,
      body: `<div class="sec-pad"><div class="media-empty" style="padding:20px 0">Your content scripts appear here as videos are produced — you'll watch your series build up week by week.</div></div>`,
    });
  }

  const fieldRow = (label, val, cid) => {
    if (!val) return '';
    return `<div class="wc-field">
      <div class="wc-field-lbl">${label}</div>
      <div class="wc-field-val" id="${cid}">${esc(val)}</div>
      <button class="wc-copy" title="Copy ${label}" onclick="copyToClip(document.getElementById('${cid}').textContent, this)">📋</button>
    </div>`;
  };

  const weeksHtml = weekNums.map(wn => {
    const vids = wc[String(wn)] || [];
    const wid = `wcw-${wn}`;
    const videosHtml = vids.map((v, i) => {
      const vidId = `wcv-${wn}-${i}`;
      const anyScript = v.hook || v.description || v.hashtags || v.voiceover;
      return `<div class="wc-video">
        <div class="wc-video-hdr" onclick="_wcToggle('${vidId}',this)">
          <span class="wc-video-name">🎬 ${esc(v.name || 'Untitled video')}</span>
          <span class="wc-video-arrow">▾</span>
        </div>
        <div class="wc-video-body" id="${vidId}" style="display:none">
          ${fieldRow('Hook', v.hook, vidId + '-hook')}
          ${fieldRow('Description', v.description, vidId + '-desc')}
          ${fieldRow('Hashtags', v.hashtags, vidId + '-tags')}
          ${fieldRow('Voiceover', v.voiceover, vidId + '-vo')}
          ${!anyScript ? `<div class="wc-field-val" style="color:var(--muted);font-style:italic;padding:6px 0">Script details coming soon.</div>` : ''}
        </div>
      </div>`;
    }).join('');
    return `<div class="wc-week">
      <div class="wc-week-hdr" onclick="_wcToggle('${wid}',this)">
        <span>Week ${wn}</span>
        <span class="wc-week-count">${vids.length} video${vids.length > 1 ? 's' : ''}</span>
        <span class="wc-week-arrow">▾</span>
      </div>
      <div class="wc-week-body" id="${wid}" style="display:none">${videosHtml}</div>
    </div>`;
  }).join('');

  const body = `<div class="sec-pad">
    <div class="wc-intro">Every video we produce for you — named and scripted, your series building up week by week. Tap any video to see and copy its hook, description, hashtags, and voiceover.</div>
    ${weeksHtml}
  </div>`;

  return section({
    id: 'sec-content', icon: '📚', title: 'Content Library',
    pills: [{ text: `${totalVideos} videos`, cls: 'blue' }, { text: `${weekNums.length} week${weekNums.length > 1 ? 's' : ''}`, cls: '' }],
    accent: 'acc-blue', startOpen: false, body,
  });
}

/* ═════════════════════════════════════════════════════════════════
   Feature E · "Where Your Campaign Stands" — done vs next, at a glance.
   Includes the "to be published" backlog: content CREATED for past weeks
   but not yet POSTED, which rolls out across the coming weeks.
   ═════════════════════════════════════════════════════════════════ */
function buildStatusCard(b) {
  const RM = b.roadmap || {};
  const rmDone = k => !!(RM[k] && RM[k].done);
  const MS = [
    { k: 'yt_editor',        done: 'YouTube editor access confirmed', next: 'Get YouTube editor access' },
    { k: 'yt_live',          done: 'YouTube is live',                 next: 'Getting YouTube live' },
    { k: 'tiktok_live',      done: 'TikTok set up & posting',         next: 'Setting up TikTok' },
    { k: 'posting_started',  done: 'Posting weekly',                  next: 'Starting regular posting' },
    { k: 'followers_growth', done: 'Growing your followers',          next: 'Growing your followers' },
    { k: 'traffic_started',  done: 'Reach campaigns running',         next: 'Launching reach campaigns' },
  ];

  const weeksByNum = {};
  (b.weeks || []).forEach(w => { weeksByNum[w.weekNum] = w; });
  const maxWeek = Math.max(b.currentWeek || 0, ...(b.weeks || []).map(w => w.weekNum || 0), 0);
  let pReady = 0, vReady = 0; const pMiss = [], vMiss = [], toPublish = [];
  for (let n = 1; n <= maxWeek; n++) {
    const w = weeksByNum[n];
    const hp = !!(w && w.links && w.links.photos);
    const hv = !!(w && w.links && w.links.videos);
    if (hp) pReady++; else pMiss.push(n);
    if (hv) vReady++; else vMiss.push(n);
    const posted = w && w.steps && (stepDone(w.steps, 'Posted TikTok') || stepDone(w.steps, 'Posted YouTube'));
    if ((hp || hv) && !posted) toPublish.push(n); // created but not yet published
  }
  const contentWeeks = Math.max(pReady, vReady);
  const ttViews = numV(b['TikTok Views']), ttFoll = numV(b['TikTok Follower Count']), ytViews = numV(b['YT Views']);

  const done = [];
  MS.forEach(m => { if (rmDone(m.k)) done.push(m.done); });
  if (contentWeeks) done.push(`${contentWeeks} week${contentWeeks > 1 ? 's' : ''} of content created`);
  if (ttViews) done.push(`${fmtN(ttViews)} TikTok views`);
  if (ytViews) done.push(`${fmtN(ytViews)} YouTube views`);
  if (ttFoll)  done.push(`${fmtN(ttFoll)} TikTok followers`);

  const next = [];
  MS.forEach(m => { if (!rmDone(m.k)) next.push(m.next); });
  if (vMiss.length)      next.push(`Videos for week${vMiss.length > 1 ? 's' : ''} ${summarizeWeekRanges(vMiss)}`);
  else if (pMiss.length) next.push(`Photos for week${pMiss.length > 1 ? 's' : ''} ${summarizeWeekRanges(pMiss)}`);

  const doneTop = done.slice(0, 5);
  const nextTop = next.slice(0, 4);

  const pubBanner = toPublish.length ? `<div class="status-pub">
    <span class="status-pub-ico">📤</span>
    <div><strong>${toPublish.length} week${toPublish.length > 1 ? 's' : ''} of content ready to publish.</strong> Your created content (week${toPublish.length > 1 ? 's' : ''} ${summarizeWeekRanges(toPublish)}) rolls out across the coming weeks as we post it to your channels — nothing already made is lost.</div>
  </div>` : '';

  const body = `<div class="sec-pad">
    ${pubBanner}
    <div class="status-grid">
      <div class="status-col done">
        <div class="status-col-hdr">✅ Done so far</div>
        ${doneTop.length ? doneTop.map(d => `<div class="status-item">${esc(d)}</div>`).join('') : `<div class="status-empty">Getting your campaign set up…</div>`}
      </div>
      <div class="status-col next">
        <div class="status-col-hdr">🎯 Coming next</div>
        ${nextTop.length ? nextTop.map(d => `<div class="status-item">${esc(d)}</div>`).join('') : `<div class="status-empty">You're all caught up — steady growth from here.</div>`}
      </div>
    </div>
  </div>`;

  return section({ id: 'sec-status', icon: '📊', title: 'Where Your Campaign Stands', pills: [], accent: 'acc-green', startOpen: true, body });
}

function buildThisWeekSection(b) {
  const cw = b.currentWeekData;
  const wi = getCampaignWeekInfo(b);
  const steps = cw ? cw.steps : {};
  const activeSteps = getActiveSteps(b);
  const done  = activeSteps.filter(s => stepDone(steps, s.key)).length;
  const pct   = activeSteps.length ? Math.round(done / activeSteps.length * 100) : 0;
  const wl = b._weekLinks || {};

  const mediaTile = (ico, label, url, cls, openLabel, coverUrl, coverId) => {
    const noun = cls === 'videos' ? 'videos' : 'photos';
    // No album yet → fold to a warm one-line note instead of an empty box.
    if (!url) {
      return `<div class="media-fold ${cls}">
        <span class="media-fold-ico">${ico}</span>
        <span class="media-fold-txt">We're adding this week's ${noun}…</span>
      </div>`;
    }
    if (!coverUrl) queueAlbumCoverFetch(url, coverId);
    return `
    <div class="media-tile">
      <div class="media-tile-cover ${cls}" style="position:relative"><img id="${coverId}" src="${coverUrl ? esc(coverUrl) : ''}" style="${coverUrl ? '' : 'display:none'}" alt="${esc(label)}"><button class="cover-refresh-btn" title="Refresh cover" data-url="${esc(url)}" onclick="refreshAlbumCoverManual(this.dataset.url,'${coverId}',this)">🔄</button></div>
      <div class="media-tile-hdr ${cls}">
        <span class="media-tile-ico">${ico}</span>
        <span class="media-tile-lbl">${label}</span>
      </div>
      <div class="media-tile-body">
        <a class="media-open ${cls}" href="${esc(url)}" target="_blank" rel="noopener">${openLabel} →</a>
      </div>
    </div>`;
  };

  const body = `<div class="sec-pad">
    <div class="cw-tiles">
      <div class="cw-tile"><div class="cw-tile-label">Week Start</div><div class="cw-tile-val">${cw ? formatDate(cw.weekStart) : '—'}</div></div>
      <div class="cw-tile highlight"><div class="cw-tile-label">Week End</div><div class="cw-tile-val">${cw ? formatDate(cw.weekEnd) : '—'}</div></div>
    </div>
    <div class="prog-wrap">
      <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${pct}%"></div></div>
      <div class="prog-pct">${done}/${activeSteps.length} · ${pct}%</div>
    </div>
    <div class="step-grid">
      ${activeSteps.map(s => `<div class="step-item ${stepDone(steps, s.key) ? 'done' : ''}">
        <div class="step-dot">${stepDone(steps, s.key) ? '✓' : ''}</div>
        <div class="step-label">${esc(s.label)}</div>
      </div>`).join('')}
    </div>
    <div class="media-tiles">
      ${mediaTile('📸', "This Week's Photos", wl.photos, 'photos', 'Open Album', wl.photosCoverUrl, 'cover-thisweek-photos')}
      ${mediaTile('🎬', "This Week's Videos", wl.videos, 'videos', 'Open Videos', wl.videosCoverUrl, 'cover-thisweek-videos')}
    </div>
    <div id="week-thumbs-wrap" style="margin-top:14px">${buildWeekThumbsWidget(b)}</div>
  </div>`;

  const pills = [
    { text: `${done}/${activeSteps.length} steps`, cls: pct === 100 ? 'green' : 'gold' },
  ];
  if (b['Maintenance Mode']) pills.push({ text: '🌙 Maintenance Mode', cls: 'gold' });
  if (wi && wi.started) pills.push({ text: `Day ${wi.dayOfCampaign}`, cls: 'purple' });
  if (wl.photos || wl.videos) pills.push({ text: 'Media ready', cls: 'blue' });

  return section({
    id: 'sec-thisweek',
    icon: '<span class="cw-now-dot"></span>',
    title: b['Maintenance Mode'] ? `Maintenance Week ${b.currentWeek||1}` : `Week ${b.currentWeek||1} in Progress`,
    pills,
    accent: 'acc-green',
    startOpen: true,
    body,
  });
}

/* ═════════════════════════════════════════════════════════════════
   3 · TIKTOK PERFORMANCE — expanded when it has data
   (Now opens with the 7-day summary bar with week-over-week deltas,
    previously written but never wired in.)
   ═════════════════════════════════════════════════════════════════ */

function buildMetricsSummaryBar(b) {
  const history = (b.metricsHistory || []).slice().sort((a, z) => new Date(a.date) - new Date(z.date));
  const last7  = history.slice(-7);
  const prior7 = history.slice(-14, -7);
  const sum = (arr, key, alt) => arr.reduce((s, e) => s + parseFloat(e[key] || e[alt] || 0), 0);

  const curViews  = sum(last7,  'TikTok Views',    'tikTokViews');
  const prevViews = sum(prior7, 'TikTok Views',    'tikTokViews');
  const curLikes  = sum(last7,  'TikTok Likes',    'tikTokLikes');
  const prevLikes = sum(prior7, 'TikTok Likes',    'tikTokLikes');
  const curShares = sum(last7,  'TikTok Shares',   'tikTokShares');
  const curComm   = sum(last7,  'TikTok Comments', 'tikTokComments');

  const snapViews  = parseFloat(b['TikTok Views'] || 0);
  const snapLikes  = parseFloat(b['TikTok Likes'] || 0);
  const snapFollow = parseFloat(b['TikTok Follower Count'] || 0);

  const displayViews  = curViews  || snapViews;
  const displayLikes  = curLikes  || snapLikes;

  const er = _engRate(displayViews, displayLikes, curComm, curShares);
  const erBenchmark = 6.5;
  const erGood = er !== null && parseFloat(er) >= erBenchmark;

  const tile = (label, value, delta, note, sparkData, sparkColor) => `
    <div style="background:var(--surface);border:1px solid var(--border-lt);
                border-radius:var(--r);padding:12px 15px;min-width:0">
      <div style="font-family:var(--font-m);font-size:.5rem;text-transform:uppercase;
                  letter-spacing:.12em;color:var(--muted);margin-bottom:5px">${label}</div>
      <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
        <div style="font-family:var(--font-d);font-size:1.6rem;font-weight:700;
                    color:var(--b800);line-height:1">${value}</div>
        ${delta}
      </div>
      ${sparkData ? _sparkline(sparkData, sparkColor || 'var(--purple)') : ''}
      ${note ? `<div style="font-size:.65rem;color:var(--muted);margin-top:4px">${note}</div>` : ''}
    </div>`;

  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
                      gap:9px;margin-bottom:2px">
    ${tile('Views (7d)', fmtN(displayViews), _deltaChip(curViews, prevViews), '',
           history.slice(-14).map(e => parseFloat(e['TikTok Views']||e['tikTokViews']||0)), 'var(--purple)')}
    ${tile('Likes (7d)', fmtN(displayLikes), _deltaChip(curLikes, prevLikes), '',
           history.slice(-14).map(e => parseFloat(e['TikTok Likes']||e['tikTokLikes']||0)), 'var(--purple)')}
    ${tile('Followers',  fmtN(snapFollow),   '', '',
           history.slice(-14).map(e => parseFloat(e['TikTok Follower Count']||e['tikTokFollowerCount']||0)), 'var(--purple)')}
    ${tile('Eng. Rate',
      er !== null ? er + '%' : '—', '',
      er !== null
        ? (erGood
            ? `<span style="color:var(--f600)">✓ Above avg (${erBenchmark}%)</span>`
            : `<span style="color:var(--orange)">Avg is ${erBenchmark}%</span>`)
        : ''
    )}
  </div>`;
}

/* F1 — AMIE narrative tray. One per platform, rendered only when that
   platform has data at all (per PRD: "Empty if no data for that platform"). */
let _amieTrayCounter = 0;
function amieNarrativeTray(b, platformKey, hasData) {
  const n = (b.narratives || {})[platformKey];
  if (!hasData || !n || !n.text) return '';
  const preview = (n.text.match(/^.*?[.!?](?:\s|$)/) || [n.text])[0].trim();
  const trayId = `amie-tray-${platformKey}-${_amieTrayCounter++}`;
  return `<div class="amie-narrative-tray" id="${trayId}">
    <button class="amie-tray-toggle" onclick="toggleAmieTray('${trayId}')">
      <span class="amie-preview">${esc(preview)}</span>
      <span class="amie-chevron">▶</span>
    </button>
    <div class="amie-tray-body">${esc(n.text)}</div>
  </div>`;
}
function toggleAmieTray(trayId) {
  const el = document.getElementById(trayId);
  if (el) el.classList.toggle('open');
}

function buildTikTokSection(b) {
  const hasTT = parseFloat(b['TikTok Views'] || 0) > 0
             || parseFloat(b['TikTok Likes'] || 0) > 0
             || parseFloat(b['TikTok Follower Count'] || 0) > 0
             || (b.metricsHistory || []).length > 0;
  const hasHistory = (b.metricsHistory || []).length > 0;

  const metric = (label, value) => `
    <div class="pf-tile tiktok-accent">
      <div class="pf-tile-v">${fmtN(value)}</div>
      <div class="pf-tile-l">${label}</div>
    </div>`;

  const engViews = parseFloat(b['TikTok Views'] || 0);
  const engLikes = parseFloat(b['TikTok Likes'] || 0);
  const engComm  = parseFloat(b['TikTok Comments'] || 0);
  const engShare = parseFloat(b['TikTok Shares'] || 0);
  const er = engViews > 0 ? ((engLikes + engComm + engShare) / engViews * 100).toFixed(2) + '%' : '—';

  const body = !hasTT
    ? `<div class="sec-pad"><div class="media-empty" style="padding:22px 0">No TikTok data yet — your team logs stats weekly, and numbers appear here as soon as the first videos go live.</div></div>`
    : `<div class="sec-pad" style="display:flex;flex-direction:column;gap:14px">
    ${hasHistory ? buildMetricsSummaryBar(b) : ''}
    <div class="platform-block">
      <div class="platform-title">Core</div>
      <div class="platform-grid">
        ${metric('Views',    b['TikTok Views'])}
        ${metric('Likes',    b['TikTok Likes'])}
        ${metric('Comments', b['TikTok Comments'])}
        ${metric('Shares',   b['TikTok Shares'])}
        ${metric('Saves',    b['TikTok Saves'])}
        <div class="pf-tile tiktok-accent"><div class="pf-tile-v">${er}</div><div class="pf-tile-l">Engagement Rate</div></div>
      </div>
    </div>
    <div class="platform-block">
      <div class="platform-title">Reach &amp; Audience</div>
      <div class="platform-grid">
        ${metric('Reach',          b['TikTok Reach'])}
        ${metric('Profile Visits', b['TikTok Profile Visits'])}
        ${metric('New Followers',  b['TikTok New Followers'])}
        ${metric('Follower Count', b['TikTok Follower Count'])}
      </div>
    </div>
    <div class="platform-block">
      <div class="platform-title">Watch Behaviour</div>
      <div class="platform-grid">
        ${metric('Avg Watch Time (s)', b['TikTok Avg Watch Time'])}
        ${metric('Video Completions',  b['TikTok Video Completions'])}
      </div>
    </div>
    ${hasHistory ? `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="chart-box">
        <div class="chart-box-ttl">Views over time</div>
        <div style="height:160px;position:relative"><canvas id="chart-views"></canvas></div>
      </div>
      <div class="chart-box" id="chart-audience-wrap">
        <div class="chart-box-ttl">Audience growth</div>
        <div style="height:160px;position:relative"><canvas id="chart-audience"></canvas></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:180px 1fr;gap:12px">
      <div class="chart-box" id="chart-engagement-wrap">
        <div class="chart-box-ttl">Engagement split</div>
        <div style="height:140px;position:relative"><canvas id="chart-engagement"></canvas></div>
      </div>
      <div class="chart-box">
        <div class="chart-box-ttl">Engagement benchmarks</div>
        ${_buildBenchmarkBars(b)}
      </div>
    </div>` : ''}
    ${amieNarrativeTray(b, 'tiktok', hasTT)}
    ${buildTopVideosTable(b)}
  </div>`;

  if (hasTT && hasHistory) _sectionChartInits['sec-tiktok-body'] = initTikTokCharts;

  return section({
    id: 'sec-tiktok',
    icon: '𝕋',
    title: 'TikTok Performance',
    pills: hasTT
      ? [{ text: fmtN(b['TikTok Views']) + ' views', cls: 'purple' },
         { text: fmtN(b['TikTok Follower Count']) + ' followers', cls: 'purple' }]
      : [{ text: 'No data yet', cls: '' }],
    accent: 'acc-purple',
    startOpen: hasTT,
    body,
  });
}

/* ═════════════════════════════════════════════════════════════════
   4 · YOUTUBE PERFORMANCE — metrics + daily views chart merged
   (Previously a separate "YouTube Views Over Time" card whose chart
    could never render — see fix notes on _buildYouTubeViewsChart.)
   ═════════════════════════════════════════════════════════════════ */

function buildYouTubeSection(b) {
  const hasYT = parseFloat(b['YT Views'] || 0) > 0
             || parseFloat(b['YT Subscribers'] || 0) > 0;
  const rows = b.videoDailyMetrics || [];
  const hasDaily = rows.some(r => (parseFloat(r.engagedViews) || 0) > 0);

  // ── Derive aggregates from daily data if Production aggregate is 0 ──────
  // (Chart shows views but tiles read 0 because the aggregate was never
  // written back to the sheet — sum the daily rows as a fallback.)
  const dailyViewsSum = rows.reduce((s,r) => s + (parseFloat(r.engagedViews)||0), 0);
  const dailyWatchSum = rows.reduce((s,r) => s + (parseFloat(r.watchHours)||0), 0);
  const dailyImprSum  = rows.reduce((s,r) => s + (parseFloat(r.impressions)||0), 0);
  const dailyLikesSum = rows.reduce((s,r) => s + (parseFloat(r.likes)||0), 0);
  const dailyCommSum  = rows.reduce((s,r) => s + (parseFloat(r.comments)||0), 0);

  // Use aggregate if present, otherwise use derived sum
  const ytViews    = parseFloat(b['YT Views'])    || dailyViewsSum;
  const ytWatch    = parseFloat(b['YT Watch Hours']) || dailyWatchSum;
  const ytImpr     = parseFloat(b['YT Impressions']) || dailyImprSum;
  const ytLikes    = parseFloat(b['YT Likes'])    || dailyLikesSum;
  const ytComm     = parseFloat(b['YT Comments']) || dailyCommSum;

  const metric = (label, value, fmt) => {
    const display = fmt ? fmt(parseFloat(value||0)) : fmtN(value);
    return `<div class="pf-tile yt-accent">
      <div class="pf-tile-v">${display}</div>
      <div class="pf-tile-l">${label}</div>
    </div>`;
  };

  const body = (!hasYT && !hasDaily)
    ? `<div class="sec-pad"><div class="media-empty" style="padding:22px 0">No YouTube data yet — once editor access is confirmed and videos go live, your channel stats appear here.</div></div>`
    : `<div class="sec-pad" style="display:flex;flex-direction:column;gap:14px">
    <div class="platform-block">
      <div class="platform-title">Core</div>
      <div class="platform-grid">
        ${metric('Views',        ytViews)}
        ${metric('Watch Hours',  ytWatch)}
        ${metric('Subscribers',  b['YT Subscribers'])}
        ${metric('Impressions',  ytImpr)}
        ${metric('CTR %',        b['YT CTR %'],  v => v.toFixed(1)+'%')}
        ${metric('Avg Duration', b['YT Avg View Duration'], v => v > 0 ? v + 's' : '—')}
      </div>
    </div>
    <div class="platform-block">
      <div class="platform-title">Engagement</div>
      <div class="platform-grid">
        ${metric('Likes',             ytLikes)}
        ${metric('Comments',          ytComm)}
        ${metric('Cards CTR %',       b['YT Cards CTR %'], v => v.toFixed(1)+'%')}
        ${metric('End Screen Clicks', b['YT End Screen Clicks'])}
      </div>
    </div>
    ${parseFloat(b['YT Revenue USD']||0) > 0 ? `
    <div class="platform-block">
      <div class="platform-title">Revenue</div>
      <div class="platform-grid">
        <div class="pf-tile yt-accent">
          <div class="pf-tile-v">$${parseFloat(b['YT Revenue USD']).toFixed(2)}</div>
          <div class="pf-tile-l">Revenue (USD)</div>
        </div>
      </div>
    </div>` : ''}
    ${hasDaily ? `
    <div class="platform-block">
      <div class="platform-title">Daily engaged views · all videos</div>
      <div class="chart-box" style="border:none;padding:6px 0 0">
        <div style="height:240px;position:relative"><canvas id="chart-yt-views"></canvas></div>
      </div>
    </div>` : ''}
    ${amieNarrativeTray(b, 'youtube', hasYT || hasDaily)}
  </div>`;

  if (hasDaily) _sectionChartInits['sec-youtube-body'] = _buildYouTubeViewsChart;

  return section({
    id: 'sec-youtube',
    icon: '▶',
    title: 'YouTube Performance',
    pills: (hasYT || hasDaily)
      ? [{ text: fmtN(b['YT Views']) + ' views', cls: 'red' },
         { text: fmtN(b['YT Subscribers']) + ' subs', cls: 'red' }]
      : [{ text: 'No data yet', cls: '' }],
    accent: 'acc-red',
    startOpen: hasYT || hasDaily,
    body,
  });
}

/* ═════════════════════════════════════════════════════════════════
   5 · AMAZON — expanded when it has data
   ═════════════════════════════════════════════════════════════════ */

function buildAmazonSection(b) {
  const hasAZ = !!(b['Amazon BSR'] || b['Amazon KENP Reads'] || b['Amazon Review Count'] || b['Amazon ASIN']);
  // Also check imported KDP data
  const amazonData = (window._rawData && window._rawData.amazonMetrics) ? (window._rawData.amazonMetrics[b.book_id] || []) : [];
  const snapshots  = (window._rawData && window._rawData.amazonSnapshots) ? (window._rawData.amazonSnapshots[b.book_id] || []) : [];
  const hasImported = amazonData.length > 0 || snapshots.length > 0;

  const fmtRank = v => { const n = parseFloat(v); return (!n || isNaN(n)) ? '—' : '#' + Math.round(n).toLocaleString(); };
  const fmtRtg  = v => { const n = parseFloat(v); return (!n || isNaN(n)) ? '—' : n.toFixed(1) + ' ★'; };

  const metric = (label, value, sub) => `
    <div class="pf-tile az-accent" style="padding:13px 15px">
      <div class="pf-tile-v" style="font-size:1.3rem">${value}</div>
      <div class="pf-tile-l">${label}</div>
      ${sub ? `<div style="font-size:.65rem;color:var(--muted);margin-top:3px">${sub}</div>` : ''}
    </div>`;

  // Aggregate imported KDP data
  const totalUnits = amazonData.reduce((s,r) => s + r.units, 0);
  const totalKenp  = amazonData.reduce((s,r) => s + r.kenp,  0);
  const totalRoyalty = amazonData.reduce((s,r) => s + r.royalty, 0);
  const latestSnap = snapshots.length ? snapshots[snapshots.length - 1] : null;

  let metricsGrid = '';
  if (hasAZ || hasImported) {
    metricsGrid = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px">
      ${metric('BSR', fmtRank(latestSnap ? latestSnap.bsr : b['Amazon BSR']), 'Best Seller Rank')}
      ${metric('Reviews', fmtN(latestSnap ? latestSnap.reviewCount : b['Amazon Review Count']), latestSnap ? fmtRtg(latestSnap.rating) : fmtRtg(b['Amazon Avg Rating']))}
      ${metric('KENP Reads', fmtN(totalKenp || b['Amazon KENP Reads']), 'Kindle pages')}
      ${metric('Units Sold', fmtN(totalUnits || b['Amazon Units Sold']), '')}
      ${totalRoyalty > 0 ? metric('Royalty', '$' + totalRoyalty.toFixed(2), 'From KDP data') : ''}
    </div>`;
  }

  // v22b — Rank goals ("#500 in Social Media by 15 Aug"), set by your team,
  // powered by the organic content engine + a small Amazon DSP campaign.
  let goalsBlock = '';
  const g = b.bsrGoals || {};
  if (g.goalCategory > 0 || g.goalOverall > 0) {
    const goalRow = (label, current, target, dateIso) => {
      if (!target) return '';
      const reached = current > 0 && current <= target;
      const proximity = reached ? 100 : (current > 0 ? Math.min(99, Math.round(target / current * 100)) : 0);
      const dateTxt = dateIso ? new Date(dateIso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
      return `<div style="margin-bottom:12px">
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
          <span style="font-size:.78rem;font-weight:700;color:var(--b800)">${esc(label)}</span>
          <span style="font-family:var(--font-m);font-size:.66rem;color:var(--muted)">${current > 0 ? 'now ' + fmtRank(current) : 'not ranked yet'} → goal <strong style="color:var(--orange)">${fmtRank(target)}</strong>${dateTxt ? ' by ' + dateTxt : ''}</span>
          ${reached ? '<span style="font-size:.68rem;font-weight:700;color:var(--f600)">🎉 Goal reached</span>' : ''}
        </div>
        <div style="height:7px;background:var(--border-lt);border-radius:4px;overflow:hidden;margin-top:5px">
          <div style="height:100%;width:${proximity}%;background:linear-gradient(90deg,var(--orange),#D4A84D);border-radius:4px"></div>
        </div>
      </div>`;
    };
    const overallCurrent = parseFloat(latestSnap ? latestSnap.bsr : b['Amazon BSR']) || 0;
    const topVideoViews = Math.max(0, ...((b.contentHistory || []).map(v => parseFloat(v.views || v['Total views'] || 0) || 0)), 0);
    const DSP_THRESHOLD = 5000;
    goalsBlock = `<div style="margin-top:14px;padding:14px 16px;background:rgba(201,144,38,.05);border:1px solid var(--border-lt);border-radius:var(--r-sm)">
      <div class="platform-title" style="margin-bottom:10px">🎯 Rank Goals</div>
      ${goalRow(g.categoryName ? g.categoryName + ' Rank' : 'Category Rank', g.categoryBsr, g.goalCategory, g.goalCategoryDate)}
      ${goalRow('Overall Best Seller Rank', overallCurrent, g.goalOverall, g.goalOverallDate)}
      <div style="font-size:.72rem;color:var(--b700);line-height:1.55;margin-top:4px;padding-top:10px;border-top:1px dashed var(--border-lt)">
        ${topVideoViews >= DSP_THRESHOLD
          ? `🚀 Your top video (<strong>${fmtN(topVideoViews)}</strong> views) qualifies for a small <strong>Amazon DSP campaign</strong> — retargeting the viewers your content has already reached to push these ranks.`
          : `These goals are driven by your weekly content, boosted by a small <strong>Amazon DSP campaign</strong> once a video crosses <strong>${fmtN(DSP_THRESHOLD)}</strong> views${topVideoViews > 0 ? ` (top so far: ${fmtN(topVideoViews)})` : ''}.`}
      </div>
    </div>`;
  }

  // BSR trend from snapshots
  let bsrTrend = '';
  if (snapshots.length >= 2) {
    bsrTrend = `<div style="margin-top:14px">
      <div class="platform-title" style="margin-bottom:8px">BSR Trend</div>
      <div style="display:flex;align-items:flex-end;gap:4px;height:60px">
        ${snapshots.slice(-12).map(s => {
          const maxBsr = Math.max(...snapshots.slice(-12).map(x=>x.bsr||1));
          const h = s.bsr ? Math.max(4, Math.round((1 - s.bsr/maxBsr) * 56) + 4) : 4;
          return `<div title="${s.date}: #${(s.bsr||0).toLocaleString()}" style="flex:1;height:${h}px;background:linear-gradient(180deg,var(--orange),#D4A84D);border-radius:3px;min-width:8px"></div>`;
        }).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;font-size:.55rem;color:var(--muted);margin-top:3px">
        <span>${snapshots[snapshots.length - Math.min(12,snapshots.length)].date}</span>
        <span>${snapshots[snapshots.length-1].date}</span>
      </div>
    </div>`;
  }

  // KDP CSV upload area
  const uploadArea = `<div style="margin-top:16px;padding:16px;border:2px dashed var(--border);border-radius:var(--r-sm);text-align:center;background:rgba(201,144,38,.04)">
    <div style="font-size:.82rem;font-weight:600;color:var(--b700);margin-bottom:6px">📊 Upload Your KDP Sales Report</div>
    <div style="font-size:.72rem;color:var(--muted);margin-bottom:10px;line-height:1.5">
      Download your report from <strong>KDP → Reports → Sales Dashboard → Export CSV</strong>, then upload it here. We'll match it to your campaign timeline automatically.
    </div>
    <label style="display:inline-block;background:linear-gradient(135deg,var(--orange),#D4A84D);color:#fff;padding:8px 20px;border-radius:var(--r-sm);font-family:var(--font-b);font-size:.78rem;font-weight:700;cursor:pointer">
      Choose CSV File
      <input type="file" accept=".csv,.txt" onchange="handleKdpUpload(this)" style="display:none">
    </label>
    <div id="kdp-upload-status" style="font-size:.72rem;color:var(--muted);margin-top:8px"></div>
  </div>`;

  // Correlation insight (if we have both video and KDP data)
  let correlation = '';
  if (amazonData.length >= 2 && b.weeks && b.weeks.length >= 2) {
    correlation = `<div style="margin-top:14px;padding:12px 16px;background:rgba(45,122,82,.06);border-radius:var(--r-sm);border-left:4px solid var(--f600)">
      <div style="font-size:.78rem;font-weight:700;color:var(--f600);margin-bottom:4px">📈 Campaign Impact</div>
      <div style="font-size:.74rem;color:var(--b700);line-height:1.5">
        ${totalUnits > 0 ? `<strong>${totalUnits}</strong> units sold and <strong>${fmtN(totalKenp)}</strong> KENP reads recorded during your ${b.weeks.length}-week campaign.` : ''}
        ${totalRoyalty > 0 ? ` Total royalties: <strong>$${totalRoyalty.toFixed(2)}</strong>.` : ''}
      </div>
    </div>`;
  }

  const body = `<div class="sec-pad">
    ${metricsGrid}
    ${goalsBlock}
    ${bsrTrend}
    ${correlation}
    ${(b['Amazon ASIN'] || (latestSnap && latestSnap.asin)) ? `<div style="margin-top:10px;font-family:var(--font-m);font-size:.62rem;color:var(--muted)">ASIN: <strong style="color:var(--orange)">${esc(latestSnap ? latestSnap.asin : b['Amazon ASIN'])}</strong></div>` : ''}
    <div style="margin-top:14px">${amieNarrativeTray(b, 'amazon', hasAZ || hasImported)}</div>
    ${uploadArea}
  </div>`;

  const pills = [];
  if (latestSnap && latestSnap.bsr) pills.push({ text: 'BSR #' + Math.round(latestSnap.bsr).toLocaleString(), cls: 'orange' });
  else if (b['Amazon BSR']) pills.push({ text: 'BSR #' + Math.round(parseFloat(b['Amazon BSR'])).toLocaleString(), cls: 'orange' });
  if (hasImported) pills.push({ text: amazonData.length + ' KDP records', cls: 'green' });
  if (!pills.length) pills.push({ text: 'Not tracked yet', cls: '' });

  return section({
    id: 'sec-amazon',
    icon: '📦',
    title: 'Amazon Performance',
    pills,
    accent: 'acc-orange',
    startOpen: hasAZ || hasImported,
    body,
  });
}

/* ═════════════════════════════════════════════════════════════════
   6 · AUDIENCE BREAKDOWN — expanded when it has data
   ═════════════════════════════════════════════════════════════════ */

function buildAudienceSection(b) {
  const snaps = b.audienceSnapshots || {};
  const gender = snaps.gender || {};
  const territory = snaps.territory || {};
  const hasGender = Object.keys(gender).length > 0;
  const hasTerritory = Object.keys(territory).length > 0;
  if (!hasGender && !hasTerritory) return '';   // nothing to say — omit card entirely

  const genderColors = { Female: 'var(--purple)', Male: 'var(--blue)', Other: 'var(--muted)' };
  const genderRows = Object.entries(gender).sort((a, z) => z[1] - a[1]).map(([label, val]) => {
    const pct = (parseFloat(val) * 100).toFixed(1);
    return `<div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:3px">
        <span style="font-weight:600;color:var(--b700)">${esc(label)}</span>
        <span style="font-family:var(--font-m);color:${genderColors[label]||'var(--muted)'}">${pct}%</span>
      </div>
      <div style="height:6px;background:var(--b100);border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${genderColors[label]||'var(--muted)'};border-radius:3px"></div>
      </div>
    </div>`;
  }).join('');

  const TERRITORY_LABELS = { Other: 'International / Developing' };
  const territoryRows = Object.entries(territory).sort((a, z) => z[1] - a[1]).slice(0, 8).map(([code, val]) => {
    const pct = (parseFloat(val) * 100).toFixed(1);
    const label = TERRITORY_LABELS[code] || code;
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border-lt)">
      <span style="font-size:.8rem;font-weight:600;color:var(--b700)">${esc(label)}</span>
      <span style="font-family:var(--font-m);font-size:.78rem;color:var(--purple)">${pct}%</span>
    </div>`;
  }).join('');

  const body = `<div class="sec-pad" style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
    ${hasGender ? `<div>
      <div class="platform-title" style="margin-bottom:10px">Audience Gender</div>
      ${genderRows}
    </div>` : ''}
    ${hasTerritory ? `<div>
      <div class="platform-title" style="margin-bottom:10px">Top Locations</div>
      ${territoryRows}
      <div style="font-size:.68rem;color:var(--muted);margin-top:8px;line-height:1.5">Reflects live data during the early campaign phase — audience geography typically narrows as targeting matures.</div>
    </div>` : ''}
  </div>`;

  return section({
    id: 'sec-audience',
    icon: '🌍',
    title: 'Audience Breakdown',
    pills: [{ text: 'Gender & locations', cls: 'blue' }],
    accent: 'acc-blue',
    startOpen: true,
    body,
  });
}

/* ═════════════════════════════════════════════════════════════════
   7 · CAMPAIGN HISTORY — expanded when weeks exist
   ═════════════════════════════════════════════════════════════════ */

function buildHistorySection(b) {
  const isTrial = normStatus(b['Campaign Status']) === 'trial';
  const weeks   = isTrial ? b.weeks.slice(0, 1) : b.weeks;
  const hasWeeks = weeks.length > 0;

  let inner;
  if (!hasWeeks) {
    inner = `<div class="sec-pad"><div class="media-empty">No weeks logged yet — your first week appears here once production starts.</div></div>`;
  } else {
    // P1.2 — group by the locked 4-week CAMPAIGN month (Math.ceil(weekNum/4)),
    // not the calendar month. Calendar dates are retained as secondary
    // context per the v20 PRD ("LABELLING MONTHS IS FINE"), just not as the
    // primary grouping key — a book live May 20 is in Month 2 by June 20
    // regardless of calendar month boundaries.
    const byMonth = {};
    weeks.forEach(w => {
      const cm = w.weekNum ? Math.ceil(w.weekNum / 4) : 0;
      (byMonth[cm] = byMonth[cm] || []).push(w);
    });
    const monthKeys = Object.keys(byMonth).map(Number).sort((a,z) => a - z);
    const totalDone = weeks.reduce((a,w) => a + w.stepsDone, 0);
    const totalSteps = weeks.length * STEPS.length;
    const curCampaignMonth = b.currentWeek ? Math.ceil(b.currentWeek / 4) : 0;

    inner = `<div class="hist-summary">
      <span>Total steps done: <strong>${totalDone}/${totalSteps}</strong></span>
      <span>Avg completion: <strong>${totalSteps ? Math.round(totalDone/totalSteps*100) : 0}%</strong></span>
    </div>`;
    if (weeks.length >= 2) {
      inner += `<div style="padding:14px 20px;border-bottom:1px solid var(--border-lt)">
        <div class="chart-box-ttl" style="margin-bottom:10px">Week-over-week: completion vs TikTok views</div>
        <div style="height:200px;position:relative"><canvas id="chart-wow"></canvas></div>
      </div>
      <div style="padding:14px 20px;border-bottom:1px solid var(--border-lt)">
        <div class="chart-box-ttl" style="margin-bottom:10px">Platform comparison — views per week</div>
        <div style="height:160px;position:relative"><canvas id="chart-platform-compare"></canvas></div>
      </div>
      <div style="padding:14px 20px;border-bottom:1px solid var(--border-lt)">
        <div class="chart-box-ttl" style="margin-bottom:10px">Month-level aggregates</div>
        ${buildMonthAggregateTable(b)}
      </div>`;
      _sectionChartInits['sec-history-body'] = (book) => { _buildWeekOverWeekChart(book); _buildPlatformComparisonChart(book); };
    } else {
      inner += `<div style="padding:14px 20px;border-bottom:1px solid var(--border-lt)"><div class="media-empty">Not enough data yet — charts appear after Week 2.</div></div>`;
    }
    monthKeys.forEach(cm => {
      const monthWeeks = byMonth[cm].slice().sort((a,z) => a.weekNum - z.weekNum);
      const label = cm ? `Month ${cm}` : 'Undated';
      // Secondary calendar context — the date range this campaign month spans.
      const datedWeeks = monthWeeks.filter(w => w.weekStart);
      const calendarRange = datedWeeks.length
        ? `${formatDate(datedWeeks[0].weekStart)} – ${formatDate(datedWeeks[datedWeeks.length-1].weekEnd || datedWeeks[datedWeeks.length-1].weekStart)}`
        : '';
      const isCurrent = cm === curCampaignMonth;
      const monthDone  = monthWeeks.reduce((s,w) => s + w.stepsDone, 0);
      const monthTotal = monthWeeks.length * STEPS.length;
      const monthPct   = monthTotal ? Math.round(monthDone/monthTotal*100) : 0;
      // Calendar leads with wins: show only weeks that have a ready album.
      // Empty weeks (and any month with none) are skipped — their gaps live in
      // the Roadmap, not here. Every month group renders expanded by default.
      const albumWeeks = monthWeeks.filter(w => w.links && (w.links.photos || w.links.videos));
      if (!albumWeeks.length) return;
      const collapseId = 'hist-month-' + String(cm).replace(/[^a-z0-9]/gi,'');
      inner += `<div class="week-section-label ${isCurrent?'healthy':''}" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center" onclick="(function(){var e=document.getElementById('${collapseId}');var a=e.previousElementSibling.querySelector('.hist-arrow');if(e.style.display==='none'){e.style.display='';a.textContent='▾'}else{e.style.display='none';a.textContent='▸'}})()">
        <span>${esc(label)}${calendarRange ? ` <span style="font-weight:400;color:var(--muted);font-size:.68rem">(${esc(calendarRange)})</span>` : ''}</span>
        <span style="display:flex;align-items:center;gap:8px">
          <span style="font-family:var(--font-m);font-size:.62rem;color:var(--muted)">${monthPct}%</span>
          <span class="hist-arrow" style="font-size:.7rem;color:var(--muted)">▾</span>
        </span>
      </div><div id="${collapseId}" class="weeks-grid">`;
      albumWeeks.forEach(w => { inner += buildWeekCellHTML(w, w.weekNum === b.currentWeek); });
      inner += `</div>`;
    });
  }

  return section({
    id: 'sec-history',
    icon: '📅',
    title: 'Campaign History',
    pills: [{ text: `${weeks.length} week${weeks.length===1?'':'s'} logged`, cls: hasWeeks ? 'green' : '' }],
    accent: 'acc-green',
    startOpen: hasWeeks,
    body: inner,
  });
}

function buildWeekCellHTML(w, isCurrent) {
  const dots = STEPS.map(s => `<div class="wk-step-dot ${stepDone(w.steps, s.key) ? 'done' : ''}"></div>`).join('');
  const clId = `wkcl_${w.weekNum}`;
  const isOpen = !!wkCLExpanded[clId];
  const photosUrl = (w.links && w.links.photos) || '';
  const videosUrl = (w.links && w.links.videos) || '';
  const photosCoverUrl = (w.links && w.links.photosCoverUrl) || '';
  const videosCoverUrl = (w.links && w.links.videosCoverUrl) || '';
  const photosCoverId = `cover-week-${w.weekNum}-photos`;
  const videosCoverId = `cover-week-${w.weekNum}-videos`;
  if (photosUrl && !photosCoverUrl) queueAlbumCoverFetch(photosUrl, photosCoverId);
  if (videosUrl && !videosCoverUrl) queueAlbumCoverFetch(videosUrl, videosCoverId);
  // Only render a card for an album that actually exists — a partially-filled
  // week leads with the album it has; the missing piece is tracked in the
  // Roadmap, not shown here as an empty placeholder.
  const photoCard = photosUrl ? `<div class="week-media-card">
      <div class="week-media-card-cover" style="position:relative"><img id="${photosCoverId}" src="${photosCoverUrl ? esc(photosCoverUrl) : ''}" style="${photosCoverUrl ? '' : 'display:none'}" alt="Photos"><button class="cover-refresh-btn" title="Refresh cover" data-url="${esc(photosUrl)}" onclick="refreshAlbumCoverManual(this.dataset.url,'${photosCoverId}',this)">🔄</button></div>
      <div class="week-media-card-hdr photos">
        <span class="week-media-card-ico">📸</span>
        <span class="week-media-card-label">Photos</span>
      </div>
      <div class="week-media-card-body">
        <a class="week-media-open photos" href="${esc(photosUrl)}" target="_blank" rel="noopener">Open Album →</a>
      </div>
    </div>` : '';
  const videoCard = videosUrl ? `<div class="week-media-card">
      <div class="week-media-card-cover" style="position:relative"><img id="${videosCoverId}" src="${videosCoverUrl ? esc(videosCoverUrl) : ''}" style="${videosCoverUrl ? '' : 'display:none'}" alt="Videos"><button class="cover-refresh-btn" title="Refresh cover" data-url="${esc(videosUrl)}" onclick="refreshAlbumCoverManual(this.dataset.url,'${videosCoverId}',this)">🔄</button></div>
      <div class="week-media-card-hdr videos">
        <span class="week-media-card-ico">🎬</span>
        <span class="week-media-card-label">Videos</span>
      </div>
      <div class="week-media-card-body">
        <a class="week-media-open videos" href="${esc(videosUrl)}" target="_blank" rel="noopener">Open Videos →</a>
      </div>
    </div>` : '';
  const mediaCards = `<div class="week-media-cards">${photoCard}${videoCard}</div>`;

  return `<div class="week-cell ${isCurrent ? 'wk-current' : 'wk-past'}">
    <div class="wk-label">
      <span>${isCurrent ? '<span class="wk-now-dot"></span>' : ''}Week ${w.weekNum}</span>
      <span class="wk-badge ${isCurrent ? 'now' : 'past'}">${isCurrent ? 'Current' : 'Done'}</span>
    </div>
    <div class="wk-pbar-wrap">
      <div class="wk-pbar-bg"><div class="wk-pbar-fill" style="width:${w.pctDone}%"></div></div>
      <div class="wk-pbar-lbl"><span>${w.stepsDone}/${STEPS.length}</span><span>${w.pctDone}%</span></div>
    </div>
    <div class="wk-step-dots">${dots}</div>
    <button class="wk-cl-toggle" onclick="toggleWkCL('${clId}')">${isOpen ? 'Hide' : 'Show'} checklist</button>
    <div class="wk-cl-panel ${isOpen ? 'open' : ''}" id="${clId}">
      ${STEPS.map(s => `<div class="wk-cl-item ${stepDone(w.steps, s.key) ? 'done' : ''}">
        <div class="wk-cl-dot">${stepDone(w.steps, s.key) ? '✓' : ''}</div>
        <div class="wk-cl-lbl">${esc(s.label)}</div>
      </div>`).join('')}
    </div>
    ${mediaCards}
  </div>`;
}

function toggleWkCL(id) {
  wkCLExpanded[id] = !wkCLExpanded[id];
  const panel = document.getElementById(id);
  if (panel) {
    panel.classList.toggle('open');
    const btn = panel.previousElementSibling;
    if (btn) btn.textContent = (wkCLExpanded[id] ? 'Hide' : 'Show') + ' checklist';
  }
}

function renderThread(messages) {
  const wrap = document.getElementById('message-thread-wrap');
  if (!wrap) return;
  if (!messages || !messages.length) {
    wrap.innerHTML = `<div style="text-align:center;padding:24px;color:var(--muted);font-size:.82rem;font-style:italic">
      No messages yet — send your first message below.
    </div>`;
  } else {
    wrap.innerHTML = `<div style="display:flex;flex-direction:column;gap:10px;max-height:360px;overflow-y:auto;
                                  padding:14px;background:var(--surface);border:1px solid var(--border-lt);
                                  border-radius:var(--r-sm)" id="thread-scroll">
      ${messages.map(msg => {
        const isAuthor = msg.from === 'author';
        const d = new Date(msg.ts);
        const dateStr = isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
        if (msg.type === 'update') {
          const fresh = (Date.now() - d.getTime()) < AUTO_READ_MS;
          return `<div style="align-self:stretch">
            <div style="display:flex;align-items:center;gap:8px;font-family:var(--font-m);font-size:.56rem;color:var(--muted);margin-bottom:4px">
              📣 Progress update · ${dateStr}${fresh ? ' <span style="background:var(--w600);color:#3D1E08;font-weight:700;padding:1px 6px;border-radius:8px;font-size:.5rem;letter-spacing:.04em">NEW</span>' : ''}
            </div>
            <div style="background:linear-gradient(90deg,rgba(201,168,76,.13),var(--surface));border:1px solid var(--w600);border-left:3px solid var(--w600);border-radius:10px;padding:11px 14px;font-size:.83rem;line-height:1.6;color:var(--b700);white-space:pre-wrap">${esc(msg.text)}</div>
          </div>`;
        }
        return `<div style="display:flex;flex-direction:column;align-items:${isAuthor ? 'flex-end' : 'flex-start'}">
          <div style="font-family:var(--font-m);font-size:.56rem;color:var(--muted);margin-bottom:3px;${isAuthor ? 'text-align:right' : ''}">
            ${esc(msg.senderName || (isAuthor ? 'You' : 'Editor'))} · ${dateStr}
          </div>
          <div style="max-width:82%;padding:10px 14px;border-radius:${isAuthor ? '14px 14px 4px 14px' : '14px 14px 14px 4px'};
                      font-size:.84rem;line-height:1.6;
                      background:${isAuthor ? 'linear-gradient(135deg,var(--f600),var(--f500))' : 'var(--b100)'};
                      color:${isAuthor ? '#fff' : 'var(--text)'};box-shadow:0 2px 8px rgba(30,18,8,.1)">
            ${esc(msg.text)}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }

  // Unread badge
  const unread = countUnread(messages || []);
  updateUnreadBadge(unread);

  requestAnimationFrame(() => {
    const scroller = document.getElementById('thread-scroll');
    if (scroller) scroller.scrollTop = scroller.scrollHeight;
  });

  // Mark read when the author interacts with the thread
  if (wrap && !wrap._readListenerAdded) {
    wrap._readListenerAdded = true;
    wrap.addEventListener('click', markMessagesRead, { once: false });
  }
}

async function loadThread() {
  const b = CURRENT_BOOK; if (!b) return;
  try {
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'getMessages',
        bookId: b.book_id || b['Book ID'],
        author: b['Author Name'],
        title:  b['Book Title'],
      }),
    });
    const data = await r.json();
    if (data.success) {
      _threadMessages = data.thread || [];
      renderThread(_threadMessages);
    }
  } catch(e) {
    console.warn('Thread load failed:', e);
    renderThread([]);
  }
}

async function sendMessage() {
  const b = CURRENT_BOOK; if (!b) return;
  const ta = document.getElementById('new-message-text');
  const text = (ta?.value || '').trim();
  if (!text) { showToast('Please type a message first.', 'error'); return; }

  ta.value = '';
  ta.disabled = true;

  const optimistic = { id: Date.now().toString(36), from: 'author', senderName: b['Author Name'], text, ts: new Date().toISOString() };
  _threadMessages.push(optimistic);
  renderThread(_threadMessages);

  try {
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'saveMessage',
        bookId: b.book_id || b['Book ID'],
        author: b['Author Name'],
        title:  b['Book Title'],
        message: { from: 'author', senderName: b['Author Name'], text },
      }),
    });
    const data = await r.json();
    if (!data.success) throw new Error(data.error);
    showToast('Message sent ✓');
  } catch(e) {
    showToast('Could not send — please try again.', 'error');
    _threadMessages.pop();
    renderThread(_threadMessages);
  } finally {
    ta.disabled = false;
    ta.focus();
  }
}

/* ── KDP CSV Upload Handler ──────────────────────────────────── */
async function handleKdpUpload(input) {
  const b = CURRENT_BOOK; if (!b) return;
  const file = input.files && input.files[0];
  if (!file) return;
  const status = document.getElementById('kdp-upload-status');
  if (status) status.textContent = '⏳ Reading CSV…';

  try {
    const text = await file.text();
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) throw new Error('CSV appears empty');

    // Parse header row — KDP reports use various column names
    const hdr = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').toLowerCase());
    const ci = (names) => {
      for (const n of names) { const i = hdr.findIndex(h => h.includes(n)); if (i !== -1) return i; }
      return -1;
    };
    const iDate    = ci(['date', 'order date', 'transaction date']);
    const iUnits   = ci(['net units', 'units sold', 'units']);
    const iKenp    = ci(['kenp', 'pages read', 'kindle edition normalized pages']);
    const iRoyalty  = ci(['royalty', 'net royalty']);
    const iReturns  = ci(['returns', 'units returned']);
    const iMarket   = ci(['marketplace', 'territory']);

    if (iDate === -1) throw new Error('Could not find a Date column in the CSV. Expected columns like "Date" or "Order Date".');

    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
      if (!cols[iDate]) continue;
      rows.push({
        date:        cols[iDate] || '',
        marketplace: iMarket !== -1 ? cols[iMarket] : '',
        units:       iUnits  !== -1 ? cols[iUnits]  : '0',
        kenp:        iKenp   !== -1 ? cols[iKenp]   : '0',
        royalty:     iRoyalty!== -1 ? cols[iRoyalty] : '0',
        returns:     iReturns!== -1 ? cols[iReturns] : '0',
      });
    }

    if (!rows.length) throw new Error('No data rows found in CSV');
    if (status) status.textContent = `⏳ Uploading ${rows.length} records…`;

    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'saveAmazonMetrics',
        bookId: b.book_id,
        author: b['Author Name'],
        title:  b['Book Title'],
        rows,
      }),
    });
    const data = await r.json();
    if (!data.success) throw new Error(data.error || 'Save failed');

    // Update local state so the section re-renders immediately
    if (!window._rawData.amazonMetrics) window._rawData.amazonMetrics = {};
    if (!window._rawData.amazonMetrics[b.book_id]) window._rawData.amazonMetrics[b.book_id] = [];
    rows.forEach(row => window._rawData.amazonMetrics[b.book_id].push({
      date: row.date, marketplace: row.marketplace,
      units: parseFloat(row.units)||0, kenp: parseFloat(row.kenp)||0,
      royalty: parseFloat(row.royalty)||0, returns: parseFloat(row.returns)||0,
    }));

    if (status) status.innerHTML = `<span style="color:var(--f600)">✅ ${data.imported} records imported successfully!</span>`;
    showToast(`✅ ${data.imported} KDP records imported`);
    // Re-render the Amazon section
    setTimeout(() => renderPage(), 500);

  } catch (e) {
    if (status) status.innerHTML = `<span style="color:var(--err)">⚠ ${e.message}</span>`;
    showToast('Import failed: ' + e.message, 'error');
  }
  input.value = ''; // reset so the same file can be re-selected
}

function getLastReadKey() {
  const b = CURRENT_BOOK;
  return b ? 'as_lastRead_' + b.book_id : null;
}
function markMessagesRead() {
  const key = getLastReadKey();
  if (key) { try { localStorage.setItem(key, Date.now().toString()); } catch(e){} }
  updateUnreadBadge(0);
}
const AUTO_READ_MS = 18 * 3600 * 1000; // bubbles auto-clear within the 12–24h window
function countUnread(messages) {
  const key = getLastReadKey();
  let lastRead = 0;
  try { lastRead = key ? parseInt(localStorage.getItem(key) || '0', 10) : 0; } catch(e){}
  const now = Date.now();
  // Unread = from the team, newer than this device's last-read, AND still within
  // the auto-read window. Opening the thread doesn't force-read (localStorage is
  // per-device, so a team preview never clears the author's badge); anything
  // older than ~18h reads itself, satisfying "marked read within 12–24h".
  return messages.filter(m => {
    if (m.from === 'author') return false;
    const ts = new Date(m.ts).getTime();
    return ts > lastRead && (now - ts) < AUTO_READ_MS;
  }).length;
}
function updateUnreadBadge(count) {
  const base = 'Your Campaign · Atomic Shelf';
  document.title = count > 0 ? `(${count}) ${base}` : base;
  const badge = document.getElementById('as-unread-badge');
  if (!badge) return;
  badge.textContent = count;
  badge.style.display = count > 0 ? 'inline-flex' : 'none';
}

  try {

// Turn [21,22,23] → "21–23", [3,5,6] → "3, 5–6" for compact gap summaries.
function summarizeWeekRanges(nums) {
  if (!nums || !nums.length) return '';
  const s = nums.slice().sort((a, b) => a - b);
  const parts = []; let start = s[0], prev = s[0];
  for (let i = 1; i <= s.length; i++) {
    if (i < s.length && s[i] === prev + 1) { prev = s[i]; continue; }
    parts.push(start === prev ? `${start}` : `${start}–${prev}`);
    if (i < s.length) { start = s[i]; prev = s[i]; }
  }
  return parts.join(', ');
}

function buildRoadmapSection(b) {
  const RM = b.roadmap || {};
  const rmDone = k => !!(RM[k] && RM[k].done);

  // ── 1. Milestone stages (driven by the admin-controlled roadmap state) ──
  const milestones = [
    { key: 'yt_editor', ttl: 'YouTube editor access',
      done: '✅ Editor access confirmed — we\'re connected to your channel.',
      pending: `Add <span class="roadmap-email">${EDITOR_INVITE_EMAIL}</span> as an editor so we can post your videos directly to your channel.` },
    { key: 'yt_live', ttl: 'YouTube posting live',
      done: '✅ YouTube is live — your videos are being posted to your channel.',
      pending: 'Once editor access is confirmed, we begin uploading your short- and long-form videos to YouTube (first batch usually 24–48 hours).' },
    { key: 'tiktok_live', ttl: 'TikTok set up & posting',
      done: '✅ TikTok is set up — our account is posting and building your presence.',
      pending: 'We establish your TikTok presence and post all your videos. Your own account can post the same content in parallel for maximum reach.' },
    { key: 'posting_started', ttl: 'Regular posting underway',
      done: '✅ Your content is going out on a weekly schedule.',
      pending: 'With accounts live, we post your photos and videos every week, building a steady content library.' },
    { key: 'followers_growth', ttl: 'Growing your TikTok followers',
      done: '✅ We\'re actively building your follower base.',
      pending: 'As your library grows, we steadily grow your TikTok following — more followers means more reach on every new post.' },
    { key: 'traffic_started', ttl: 'Traffic & reach campaigns',
      done: '✅ Reach campaigns are running to expand your audience.',
      pending: 'We amplify your reach — including boosting your top-performing videos via TikTok Promote (below) to find lookalike audiences and drive more views.' },
  ];
  // Animated journey timeline — connected nodes, a progress line that fills on
  // expand, done nodes glowing, the next node pulsing, staggered reveal.
  const mDoneFlags   = milestones.map(m => rmDone(m.key));
  const mFirstPending = mDoneFlags.indexOf(false);
  const mFillPct     = Math.round(mDoneFlags.filter(Boolean).length / milestones.length * 100);
  const milestoneSteps = `<div class="rm-timeline">
    <div class="rm-line"><div class="rm-line-fill" style="--fill:${mFillPct}%"></div></div>
    ${milestones.map((m, i) => {
      const done = mDoneFlags[i];
      const isNext = i === mFirstPending;
      return `<div class="rm-step ${done ? 'done' : ''}${isNext ? ' next' : ''}" style="--i:${i}">
        <div class="rm-node">${done ? '✓' : (i + 1)}</div>
        <div class="rm-step-content">
          <div class="rm-step-ttl">${m.ttl}${isNext ? ' <span class="rm-nowtag">UP NEXT</span>' : ''}</div>
          <div class="rm-step-desc">${done ? m.done : m.pending}</div>
        </div>
      </div>`;
    }).join('')}
  </div>`;

  // ── 2. Content still coming (gaps — leads-with-wins moved these here) ──
  const weeksByNum = {};
  (b.weeks || []).forEach(w => { weeksByNum[w.weekNum] = w; });
  const maxWeek = Math.max(b.currentWeek || 0, ...(b.weeks || []).map(w => w.weekNum || 0), 0);
  const pMiss = [], vMiss = []; let pReady = 0, vReady = 0;
  for (let n = 1; n <= maxWeek; n++) {
    const w = weeksByNum[n];
    const hp = !!(w && w.links && w.links.photos);
    const hv = !!(w && w.links && w.links.videos);
    if (hp) pReady++; else pMiss.push(n);
    if (hv) vReady++; else vMiss.push(n);
  }
  const gapBlock = maxWeek > 0 ? `<div class="roadmap-step">
    <div class="roadmap-step-num" style="background:var(--w500)">📦</div>
    <div class="roadmap-step-body">
      <div class="roadmap-step-ttl">Content still coming</div>
      <div class="roadmap-step-desc" style="line-height:1.9">
        <div>📸 Photos — <strong>${pReady} of ${maxWeek}</strong> weeks ready${pMiss.length ? ` · coming for week${pMiss.length > 1 ? 's' : ''} ${summarizeWeekRanges(pMiss)}` : ' · all caught up ✅'}</div>
        <div>🎬 Videos — <strong>${vReady} of ${maxWeek}</strong> weeks ready${vMiss.length ? ` · coming for week${vMiss.length > 1 ? 's' : ''} ${summarizeWeekRanges(vMiss)}` : ' · all caught up ✅'}</div>
      </div>
    </div>
  </div>` : '';

  // ── 3. Production progress this week (checklist rolled up by phase) ──
  const steps = (b.currentWeekData && b.currentWeekData.steps) || {};
  const BUCKETS = [
    { name: 'Pre-production', keys: ['Hook Written', 'Script Approved'] },
    { name: 'Production',     keys: ['Seed Images Created', 'B-Roll Sourced', 'First Draft Complete'] },
    { name: 'Review & polish', keys: ['Client Review Sent', 'Client Approved', 'Captions Added', 'Hashtags Added', 'Thumbnail Created'] },
    { name: 'Publishing',     keys: ['Posted TikTok', 'Posted YouTube', 'Analytics Logged', 'New Followers Added'] },
  ];
  const bucketLine = BUCKETS.map(bk => {
    const total = bk.keys.length;
    const doneN = bk.keys.filter(k => stepDone(steps, k)).length;
    const label = doneN === total ? '✓' : (doneN === 0 ? 'pending' : `${doneN}/${total}`);
    const col = doneN === total ? 'var(--f600)' : doneN === 0 ? 'var(--muted)' : 'var(--w700)';
    return `<span style="color:${col};font-weight:700;white-space:nowrap">${bk.name} ${label}</span>`;
  }).join('<span style="color:var(--border-lt);margin:0 4px">·</span>');
  const progressBlock = `<div class="roadmap-step">
    <div class="roadmap-step-num" style="background:var(--b500)">📋</div>
    <div class="roadmap-step-body">
      <div class="roadmap-step-ttl">Production progress <span style="font-weight:400;color:var(--muted);text-transform:none">(this week)</span></div>
      <div class="roadmap-step-desc" style="display:flex;flex-wrap:wrap;align-items:center;gap:2px">${bucketLine}</div>
    </div>
  </div>`;

  // ── 4. TikTok Promote — recommend boosting the actual top performer ──
  const { withViews } = _splitVideos_(b);
  const top = withViews && withViews[0];
  const topViews = top ? _videoViews_(top) : 0;
  let topTitle = top ? (top.title || top['Video title'] || top.videoTitle || '') : '';
  const hi = topTitle.indexOf('  #'); if (hi > 0) topTitle = topTitle.slice(0, hi).trim();
  if (topTitle.length > 56) topTitle = topTitle.slice(0, 56) + '…';
  const topLink = top ? (top.link || top['Video link'] || top.videoLink || '') : '';
  const boostRec = top ? `<div class="promote-note" style="margin-top:8px">
    <span class="promote-note-icon">🚀</span>
    <span class="promote-note-text"><strong>Recommended:</strong> boost your top performer${topViews ? ` — <strong>${esc(topTitle || 'your top video')}</strong> (${fmtN(topViews)} views)` : ''}. Promoting a video that's already resonating finds <strong>lookalike audiences</strong> and adds the most new views for your spend.${topLink ? ` <a href="${esc(topLink)}" target="_blank" rel="noopener" style="color:var(--blue);white-space:nowrap">Open video ↗</a>` : ''}</span>
  </div>` : '';

  const introText = 'Everything ahead in your campaign — where we are, what\'s coming, and how we grow your reach:';

  const body = `<div class="sec-pad">
    <div class="roadmap-intro">${introText}</div>
    ${milestoneSteps}
    ${gapBlock}
    ${progressBlock}

    <div class="roadmap-step promo">
      <div class="roadmap-step-num">🚀</div>
      <div class="roadmap-step-body">
        <div class="roadmap-step-ttl">Boost reach with TikTok Promote</div>
        <div class="roadmap-step-desc">Once your videos are live, TikTok's built-in <strong>Promote</strong> feature pushes a video to a much larger, lookalike audience — the fastest way to add views on top of organic growth.</div>
        <div class="promote-box">
          <strong>How TikTok Promote works:</strong> Inside the TikTok app, tap any posted video → More options (···) → Promote. Choose a goal, set a daily budget and duration, then tap Pay.
          ${boostRec}
          <div class="promote-note">
            <span class="promote-note-icon">💡</span>
            <span class="promote-note-text"><strong>Important:</strong> The cost of Promote is paid <strong>directly to TikTok</strong> by you — completely separate from your Atomic Shelf subscription.</span>
          </div>
        </div>
      </div>
    </div>

    <div class="roadmap-step shop">
      <div class="roadmap-step-num">🛒</div>
      <div class="roadmap-step-body">
        <div class="roadmap-step-ttl">Consider opening a TikTok Shop (optional)</div>
        <div class="roadmap-step-desc">TikTok Shop lets you sell directly inside TikTok. This is entirely run and managed by you, independent of Atomic Shelf.</div>
        <div class="shop-box">
          <strong>What TikTok Shop campaigns offer:</strong> TikTok runs themed promotional campaigns tiered by scale:
          <div class="shop-tiers">
            <div class="shop-tier"><span class="shop-tier-badge">SS / S</span><span>Major events like Black Friday — highest exposure, requires 20–30% discount</span></div>
            <div class="shop-tier"><span class="shop-tier-badge">A</span><span>Seasonal campaigns — moderate discount, solid visibility</span></div>
            <div class="shop-tier"><span class="shop-tier-badge">B</span><span>Category-specific campaigns — lower discount requirements, steady sales</span></div>
          </div>
          <div class="shop-rec"><strong>Our recommendation:</strong> Set up a TikTok Shop after 4–6 weeks of active content. Start with a B-tier campaign to test.</div>
        </div>
      </div>
    </div>
  </div>`;

  const doneCount = milestones.filter(m => rmDone(m.key)).length;
  const hasPending = doneCount < milestones.length || pMiss.length || vMiss.length;
  return section({
    id: 'sec-roadmap',
    icon: '🗺',
    title: 'Campaign Roadmap',
    pills: [{ text: `${doneCount}/${milestones.length} milestones`, cls: doneCount ? 'green' : '' }],
    accent: 'acc-blue',
    startOpen: false,
    body,
  });
}

function buildStarRow(category, label) {
  return `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-lt)">
    <span style="font-size:.82rem;font-weight:600;color:var(--b700);min-width:150px">${label}</span>
    <div style="display:flex;gap:4px" id="stars-${category}">
      ${[1,2,3,4,5].map(n =>
        `<button class="feedback-star" id="star-${category}-${n}" data-cat="${category}" data-val="${n}" onclick="setRating('${category}',${n})">★</button>`
      ).join('')}
    </div>
    <span id="rating-label-${category}" style="font-family:var(--font-m);font-size:.62rem;color:var(--muted);min-width:60px;text-align:right">Not rated</span>
  </div>`;
}

function setRating(category, val) {
  _feedbackRatings[category] = val;
  const labels = { 1:'Poor', 2:'Fair', 3:'Good', 4:'Great', 5:'Excellent' };
  [1,2,3,4,5].forEach(n => {
    const star = document.getElementById(`star-${category}-${n}`);
    if (star) star.style.color = n <= val ? 'var(--w500)' : 'var(--b200)';
  });
  const lbl = document.getElementById(`rating-label-${category}`);
  if (lbl) lbl.textContent = labels[val] || '';
  if (category !== 'overall') {
    const cats = ['communication','contentQuality','results','turnaround','general'];
    const rated = cats.filter(c => _feedbackRatings[c] > 0);
    if (rated.length > 0) {
      const avg = Math.round(rated.reduce((s,c) => s + _feedbackRatings[c], 0) / rated.length);
      setRating('overall', avg);
    }
  }
}

/* F3 — Author Feedback (weekly thumbs), lives in the "This Week" widget
   beneath the media tiles per the PRD. Separate from the star-based
   "Rate Your Experience" section below — thumbs are a fast, per-week
   reaction; stars are the author's overall campaign sentiment. */
function buildWeekThumbsWidget(b) {
  const weekNum  = b.currentWeek || 1;
  const existing = (b.weeklyRatings || []).find(e => e.weekNum === weekNum);
  if (existing) {
    return `<div class="thumb-done">${existing.rating === 'up' ? '👍' : '👎'} Feedback received ✓</div>
      ${existing.note ? `<div class="thumb-done-note">"${esc(existing.note)}"</div>` : ''}`;
  }
  return `<div class="platform-title" style="margin-bottom:8px">How was this week's content?</div>
    <div class="thumbs-row" id="thumbs-row">
      <button class="thumb-btn up"   id="thumb-btn-up"   onclick="selectWeekRating('up')">👍 This hit the mark</button>
      <button class="thumb-btn down" id="thumb-btn-down" onclick="selectWeekRating('down')">👎 Needs adjustment</button>
    </div>
    <div id="thumb-note-wrap" style="display:none">
      <textarea class="thumb-note" id="thumb-note" maxlength="280" placeholder="Anything specific? (optional)"></textarea>
      <button class="thumb-submit" id="thumb-submit-btn" onclick="submitWeekFeedback()">Submit</button>
    </div>`;
}

let _weekRatingSelection = null;
function selectWeekRating(rating) {
  _weekRatingSelection = rating;
  document.getElementById('thumb-btn-up')?.classList.toggle('selected', rating === 'up');
  document.getElementById('thumb-btn-down')?.classList.toggle('selected', rating === 'down');
  const wrap = document.getElementById('thumb-note-wrap');
  if (wrap) wrap.style.display = 'block';
}

async function submitWeekFeedback() {
  const b = CURRENT_BOOK;
  if (!b || !_weekRatingSelection) return;
  const note = (document.getElementById('thumb-note')?.value || '').trim().slice(0, 280);
  const btn = document.getElementById('thumb-submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  try {
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'saveAuthorFeedback',
        bookId: b.book_id || b['Book ID'], author: b['Author Name'], title: b['Book Title'],
        weekNum: b.currentWeek || 1, rating: _weekRatingSelection, note,
      }),
    });
    const data = await r.json();
    if (!data.success) throw new Error(data.error);
    b.weeklyRatings = b.weeklyRatings || [];
    const idx = b.weeklyRatings.findIndex(e => e.weekNum === (b.currentWeek || 1));
    if (idx !== -1) b.weeklyRatings[idx] = data.entry; else b.weeklyRatings.push(data.entry);
    _weekRatingSelection = null;
    const wrap = document.getElementById('week-thumbs-wrap');
    if (wrap) wrap.innerHTML = buildWeekThumbsWidget(b);
  } catch (e) {
    showToast('Could not send feedback. Please try again.', 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Submit'; }
  }
}

async function submitFeedback() {
  const b = CURRENT_BOOK; if (!b) return;
  const text = (document.getElementById('feedback-text')?.value || '').trim();
  const btn = document.getElementById('feedback-submit-btn');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'saveFeedback',
        bookId: b.book_id || b['Book ID'], author: b['Author Name'], title: b['Book Title'], email: b.email || '',
        overallRating: _feedbackRatings.overall,
        ratings: {
          communication: _feedbackRatings.communication,
          contentQuality: _feedbackRatings.contentQuality,
          results: _feedbackRatings.results,
          turnaround: _feedbackRatings.turnaround,
          general: _feedbackRatings.general,
        },
        message: text, status: 'open',
      }),
    });
    const data = await r.json();
    if (!data.success) throw new Error(data.error);
    document.getElementById('feedback-form-wrap').innerHTML =
      `<div class="feedback-done">✅ Thank you — your feedback has been received!</div>`;
  } catch(e) {
    showToast('Could not send feedback. Please try again.', 'error');
    btn.disabled = false; btn.textContent = 'Send Feedback';
  }
}

/* ═════════════════════════════════════════════════════════════════
