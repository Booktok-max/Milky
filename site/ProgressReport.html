<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Atomic Shelf · Your Campaign</title>
<link rel="icon" type="image/svg+xml" href="https://atomic-shelf.com/book-and-people-spring-svgrepo-com.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Jost:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --w100:#FBF7ED;--w200:#F5EDCF;--w300:#E8D89A;--w400:#D4B95A;--w500:#C9A84C;--w600:#B8860B;--w700:#8B6914;--w800:#5C4209;
  --b100:#F2EBE0;--b200:#E0CEBC;--b300:#C4A882;--b400:#9E7B52;--b500:#7A5C2E;--b600:#5C3D1E;--b700:#3D2B1A;--b800:#1E1208;
  --f100:#EBF5F0;--f200:#C4E0D2;--f400:#4CAF80;--f500:#2D7A52;--f600:#1E5C3A;
  --blue:#2471A3;--blue-bg:rgba(36,113,163,.1);--blue-bd:rgba(36,113,163,.28);
  --purple:#7D3C98;--purple-bg:rgba(125,60,152,.1);--purple-bd:rgba(125,60,152,.28);
  --orange:#CA6F1E;--orange-bg:rgba(202,111,30,.1);--orange-bd:rgba(202,111,30,.28);
  --red:#C0392B;--red-bg:rgba(192,57,43,.08);--red-bd:rgba(192,57,43,.25);
  --teal:#0D7377;--teal-bg:rgba(13,115,119,.1);--teal-bd:rgba(13,115,119,.28);
  --bg:var(--w100);--surface:#FFFCF5;--card:#FFFEFA;--border:var(--b200);--border-lt:#EDE5D4;
  --text:var(--b800);--muted:var(--b400);
  --r-sm:6px;--r:10px;--r-md:14px;--r-lg:20px;
  --sh:0 4px 20px rgba(30,18,8,.1);--sh-md:0 8px 36px rgba(30,18,8,.14);
  --font-d:'Playfair Display',Georgia,serif;--font-b:'Jost',system-ui,sans-serif;--font-m:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
a{color:var(--f500)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--b300);border-radius:3px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── Header ─────────────────────────────────────────────────────── */
.hdr{background:linear-gradient(160deg,#162A1C,#0D1F10 45%,#1C0E04);padding:20px 6vw;display:flex;align-items:center;gap:14px;box-shadow:0 4px 24px rgba(10,25,8,.4)}
.hdr-logo-link{display:flex;align-items:center;gap:14px;text-decoration:none}
.logo-emblem{width:36px;height:36px;border-radius:9px;background:linear-gradient(138deg,var(--w400),#D4A030);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-emblem img{width:22px;height:22px}
.logo-name{font-family:var(--font-d);font-size:1.25rem;font-weight:700;color:#F0E8D0;line-height:1.1}
.logo-name em{color:var(--w400);font-style:italic}
.logo-tag{font-family:var(--font-m);font-size:.52rem;color:rgba(168,216,196,.6);letter-spacing:.16em;text-transform:uppercase;margin-top:2px}

.wrap{max-width:1320px;margin:0 auto;padding:26px 3vw 80px}
.center-state{text-align:center;padding:90px 20px;color:var(--muted)}
.center-state .ico{font-size:2.4rem;opacity:.35;margin-bottom:12px}
.center-state .ttl{font-family:var(--font-d);font-size:1.45rem;color:var(--b500);margin-bottom:7px}
.center-state p{font-size:.88rem;color:var(--muted);max-width:400px;margin:0 auto}

/* ── Pills (unified) ────────────────────────────────────────────── */
.pill{font-family:var(--font-m);font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:3px 11px;border-radius:40px;border:1px solid var(--border);background:var(--surface);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pill.green{background:rgba(45,122,82,.12);color:var(--f600);border-color:rgba(45,122,82,.3)}
.pill.blue{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-bd)}
.pill.purple{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-bd)}
.pill.orange{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-bd)}
.pill.red{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.pill.gold{background:rgba(201,168,76,.15);color:var(--w700);border-color:rgba(201,168,76,.3)}
.pill.count{background:var(--red);color:#fff;border-color:var(--red);min-width:18px;justify-content:center}

/* ── Hero ───────────────────────────────────────────────────────── */
.hero{background:linear-gradient(148deg,#FFFCF5,var(--w200));border:2px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-md);margin-bottom:18px;position:relative}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--f600),var(--w400),var(--f500),var(--w600))}
.hero-in{padding:24px 26px 20px}
.greeting{font-family:var(--font-m);font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--f600);margin-bottom:5px}
.book-title{font-family:var(--font-d);font-size:1.9rem;font-weight:700;color:var(--b800);line-height:1.15}
.book-author{font-size:.93rem;color:var(--b500);font-weight:500;margin-top:3px}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px;margin:16px 0 0}
.stile{background:var(--surface);border:1px solid var(--border-lt);border-radius:var(--r);padding:12px;text-align:center}
.stile-v{font-family:var(--font-d);font-size:1.55rem;font-weight:700;color:var(--b800);line-height:1}
.stile-l{font-family:var(--font-m);font-size:.5rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:4px}

/* ── F6 — Multi-book landing ────────────────────────────────────── */
.portal-back-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);color:var(--b600);padding:7px 14px;border-radius:var(--r-sm);font-family:var(--font-m);font-size:.68rem;font-weight:700;cursor:pointer;margin-bottom:14px}
.portal-back-btn:hover{background:var(--w100)}
.multi-landing-hero{background:linear-gradient(148deg,#FFFCF5,var(--w200));border:2px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-md);padding:24px 26px;margin-bottom:20px;position:relative;overflow:hidden}
.multi-landing-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--f600),var(--w400),var(--f500),var(--w600))}
.multi-landing-sub{font-size:.93rem;color:var(--b500);font-weight:500;margin-top:4px}
.book-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.book-card{background:var(--card);border:2px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh);cursor:pointer;overflow:hidden;transition:transform .15s,box-shadow .15s}
.book-card:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.book-card-cover{height:90px;background:linear-gradient(135deg,var(--w300),var(--w500));display:flex;align-items:center;justify-content:center;font-size:2rem}
.book-card-body{padding:14px 16px}
.book-card-title{font-family:var(--font-d);font-size:1.05rem;font-weight:700;color:var(--b800);line-height:1.25;margin-bottom:8px}
.book-card-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.book-card-health{display:flex;align-items:center;gap:6px;font-family:var(--font-m);font-size:.66rem;color:var(--muted);font-weight:600}
.health-dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.health-dot.green{background:var(--f600)}
.health-dot.gold{background:var(--w600)}
.health-dot.red{background:var(--red)}

/* ── Unified collapsible section ────────────────────────────────── */
.sec{background:var(--card);border:2px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh);margin-bottom:18px;position:relative}
.sec::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--sec-accent,linear-gradient(90deg,var(--f600),var(--w500)));z-index:1}
.sec.acc-green{border-color:rgba(45,122,82,.25);--sec-accent:linear-gradient(90deg,var(--f600),var(--w500))}
.sec.acc-purple{border-color:var(--purple-bd);--sec-accent:linear-gradient(90deg,var(--purple),var(--blue))}
.sec.acc-red{border-color:rgba(192,57,43,.25);--sec-accent:linear-gradient(90deg,var(--red),var(--orange))}
.sec.acc-orange{border-color:var(--orange-bd);--sec-accent:linear-gradient(90deg,var(--orange),var(--w500))}
.sec.acc-blue{border-color:var(--blue-bd);--sec-accent:linear-gradient(90deg,var(--blue),var(--w500))}
.sec.acc-gold{border-color:rgba(201,168,76,.3);--sec-accent:linear-gradient(90deg,var(--w600),var(--w400))}
.sec-hdr{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--w200);border-bottom:1px solid transparent;cursor:pointer;user-select:none;transition:background .15s;flex-wrap:wrap}
.sec-hdr:hover{background:rgba(201,168,76,.14)}
.sec-hdr:focus-visible{outline:2px solid var(--f500);outline-offset:-2px}
.sec-hdr.open{border-bottom-color:var(--border)}
.sec-ico{font-size:1.05rem;flex-shrink:0}
.sec-ttl{font-family:var(--font-d);font-size:1.12rem;font-weight:600;color:var(--b800)}
.sec-pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.sec-arrow{font-family:var(--font-m);font-size:.72rem;color:var(--muted);transition:transform .22s ease;flex-shrink:0}
.sec-arrow.open{transform:rotate(180deg)}
.sec-body{max-height:0;overflow:hidden;transition:max-height .35s ease,opacity .25s ease;opacity:0}
.sec-body.open{max-height:6000px;opacity:1;overflow:visible}
.sec-pad{padding:18px 20px}
#sec-thisweek .sec-pad{padding-left:12px;padding-right:12px}

/* ── This Week ──────────────────────────────────────────────────── */
.cw-now-dot{width:8px;height:8px;border-radius:50%;background:var(--f500);box-shadow:0 0 0 3px rgba(45,122,82,.2);animation:pulse 2.2s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.6)}}
.cw-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.cw-tile{background:var(--surface);border:1px solid var(--border-lt);border-radius:var(--r);padding:13px 15px}
.cw-tile-label{font-family:var(--font-m);font-size:.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
.cw-tile-val{font-family:var(--font-d);font-size:1.05rem;font-weight:700;color:var(--b800);line-height:1.1}
.cw-tile.highlight{border-color:rgba(45,122,82,.3);background:rgba(45,122,82,.04)}
.cw-tile.highlight .cw-tile-val{color:var(--f600)}
.prog-wrap{display:flex;align-items:center;gap:11px;margin-bottom:15px}
.prog-bar-bg{flex:1;height:10px;background:var(--b100);border-radius:5px;overflow:hidden}
.prog-bar-fill{height:100%;background:linear-gradient(90deg,var(--f600),var(--w500));border-radius:5px;transition:width .5s ease}
.prog-pct{font-family:var(--font-m);font-weight:700;color:var(--w700);font-size:.82rem;white-space:nowrap}
.step-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.step-item{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:var(--r-sm);border:1px solid var(--border-lt);background:var(--w100)}
.step-item.done{background:var(--f100);border-color:rgba(45,122,82,.25)}
.step-dot{width:17px;height:17px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.62rem;color:#fff;font-weight:800}
.step-item.done .step-dot{background:var(--f500)}
.step-item:not(.done) .step-dot{background:var(--b300)}
.step-label{font-size:.8rem;font-weight:600;color:var(--text)}
.step-item:not(.done) .step-label{color:var(--muted)}

/* This week's media tiles (single home — duplicate card removed) */
.media-tiles{display:grid;grid-template-columns:1fr;gap:13px;margin-top:16px}
@media(min-width:760px){
  .media-tiles{grid-template-columns:1fr 1fr}
}
.media-fold{display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px dashed var(--border-lt);border-radius:var(--r);background:var(--bg-alt,#f7f5ef);color:var(--muted);font-size:.85rem;font-style:italic}
.media-fold-ico{font-size:1.05rem;opacity:.7}
/* Feature E — "Where Your Campaign Stands" status card */
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.status-col{background:var(--surface);border:1px solid var(--border-lt);border-radius:var(--r);padding:14px 16px}
.status-col.done{border-left:3px solid var(--f500)}
.status-col.next{border-left:3px solid var(--w600)}
.status-col-hdr{font-family:var(--font-m);font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:9px}
.status-item{font-size:.85rem;color:var(--b700);padding:5px 0 5px 20px;position:relative;line-height:1.4}
.status-col.done .status-item::before{content:'✓';position:absolute;left:0;color:var(--f500);font-weight:800}
.status-col.next .status-item::before{content:'→';position:absolute;left:0;color:var(--w600);font-weight:800}
.status-empty{font-size:.82rem;color:var(--muted);font-style:italic;padding:4px 0}
.status-pub{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(90deg,rgba(201,168,76,.14),rgba(201,168,76,.04));border:1px solid var(--w600);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:.82rem;color:var(--b700);line-height:1.5}
.status-pub-ico{font-size:1.1rem;flex-shrink:0}
@media(max-width:640px){.status-grid{grid-template-columns:1fr}}
/* Roadmap animated journey timeline */
.rm-timeline{position:relative;padding:4px 0 4px 2px}
.rm-line{position:absolute;left:17px;top:20px;bottom:22px;width:3px;background:var(--border-lt);border-radius:2px;overflow:hidden}
.rm-line-fill{--fill:0%;position:absolute;top:0;left:0;right:0;height:var(--fill);background:linear-gradient(180deg,var(--f500),var(--f600));border-radius:2px}
.sec-body.open .rm-line-fill{animation:rmGrow 1.1s cubic-bezier(.4,0,.2,1) .25s both}
@keyframes rmGrow{from{height:0}to{height:var(--fill)}}
.rm-step{position:relative;display:flex;gap:14px;padding:7px 0 15px}
.sec-body.open .rm-step{animation:rmStepIn .5s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i) * .07s)}
@keyframes rmStepIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.rm-node{position:relative;z-index:1;flex-shrink:0;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-m);font-size:.82rem;font-weight:800;background:var(--surface);border:2px solid var(--border-lt);color:var(--muted);transition:all .3s}
.rm-step.done .rm-node{background:var(--f500);border-color:var(--f500);color:#fff;box-shadow:0 0 0 4px rgba(45,122,82,.16)}
.rm-step.next .rm-node{border-color:var(--w600);color:var(--w700);background:var(--w100,#fdf7e8);animation:rmPulse 2.1s ease-in-out infinite}
@keyframes rmPulse{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,.5)}50%{box-shadow:0 0 0 9px rgba(201,168,76,0)}}
.rm-step-content{padding-top:3px;min-width:0}
.rm-step-ttl{font-weight:700;color:var(--b800);font-size:.92rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rm-step.done .rm-step-ttl{color:var(--f600)}
.rm-step:not(.done):not(.next) .rm-step-ttl{color:var(--muted)}
.rm-nowtag{font-family:var(--font-m);font-size:.52rem;font-weight:700;letter-spacing:.08em;color:var(--w700);background:var(--w100,#fdf7e8);border:1px solid var(--w600);border-radius:20px;padding:1px 7px}
.rm-step-desc{font-size:.82rem;color:var(--b600);margin-top:3px;line-height:1.5}
.rm-step:not(.done):not(.next) .rm-step-desc{color:var(--muted)}
/* Content Library — per-week video scripts */
.wc-intro{font-size:.85rem;color:var(--muted);line-height:1.55;margin-bottom:14px}
.wc-week{border:1px solid var(--border-lt);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.wc-week-hdr{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:var(--surface);font-family:var(--font-m);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--b700)}
.wc-week-hdr:hover{background:var(--bg-alt,#f7f5ef)}
.wc-week-count{margin-left:auto;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.wc-week-arrow,.wc-video-arrow{transition:transform .2s;color:var(--muted);font-size:.7rem}
.wc-week-body{padding:4px 12px 8px}
.wc-video{border-top:1px solid var(--border-lt)}
.wc-video:first-child{border-top:none}
.wc-video-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 4px;cursor:pointer}
.wc-video-name{font-size:.86rem;font-weight:600;color:var(--b800)}
.wc-video-body{padding:2px 4px 10px}
.wc-field{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-top:1px dashed var(--border-lt)}
.wc-field-lbl{font-family:var(--font-m);font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);min-width:74px;padding-top:3px}
.wc-field-val{flex:1;font-size:.82rem;color:var(--b700);line-height:1.5;white-space:pre-wrap;word-break:break-word}
.wc-copy{flex-shrink:0;background:var(--bg-alt,#f0eee8);border:1px solid var(--border-lt);border-radius:var(--r-sm);width:28px;height:28px;cursor:pointer;font-size:.8rem;line-height:1}
.wc-copy:hover{background:var(--purple-bg)}
.media-tile{border-radius:var(--r);overflow:hidden;border:1.5px solid var(--border-lt);background:var(--surface)}
/* Cover aspect matches Google Photos' 600×315 share image (40:21) so the
   whole composite shows with no crop/zoom. contain keeps it fully visible
   even if a rare album returns a different ratio. */
/* Full-width tile (matches the prior layout — no side margins), but the cover
   itself is height-capped so it can't grow into a half-page-tall image on a
   wide container. aspect-ratio still governs width < 1070px (~560px cap /
   40:21); max-height takes over above that. */
.media-tile-cover{width:100%;aspect-ratio:40/21;max-height:420px;background:linear-gradient(110deg,var(--bg-alt,#f0eee8) 8%,rgba(0,0,0,.04) 18%,var(--bg-alt,#f0eee8) 33%);background-size:200% 100%;animation:cover-shimmer 1.6s linear infinite;overflow:hidden}
.media-tile-cover img{width:100%;height:100%;object-fit:contain;display:block}
.week-media-card-cover{width:100%;aspect-ratio:40/21;max-height:420px;background:linear-gradient(110deg,var(--bg-alt,#f0eee8) 8%,rgba(0,0,0,.04) 18%,var(--bg-alt,#f0eee8) 33%);background-size:200% 100%;animation:cover-shimmer 1.6s linear infinite;overflow:hidden;border-radius:var(--r-sm) var(--r-sm) 0 0}
.week-media-card-cover img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes cover-shimmer{to{background-position:-200% 0}}
/* Once the real cover has loaded, stop the shimmer and give any letterbox a
   soft neutral mat instead of an animating gradient bleeding through. */
.media-tile-cover:has(img[src]:not([src=""])),
.week-media-card-cover:has(img[src]:not([src=""])){animation:none;background:#f3f1ea}
.cover-refresh-btn{position:absolute;top:6px;right:6px;width:26px;height:26px;border:none;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;opacity:0;transition:opacity .15s}
.media-tile-cover:hover .cover-refresh-btn,.week-media-card-cover:hover .cover-refresh-btn{opacity:1}
.cover-refresh-btn:disabled{cursor:wait}
.media-tile-hdr{padding:11px 14px;display:flex;align-items:center;gap:8px}
.media-tile-hdr.photos{background:rgba(125,60,152,.08)}
.media-tile-hdr.videos{background:rgba(36,113,163,.08)}
.media-tile-ico{font-size:1.15rem}
.media-tile-lbl{font-family:var(--font-m);font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.media-tile-hdr.photos .media-tile-lbl{color:var(--purple)}
.media-tile-hdr.videos .media-tile-lbl{color:var(--blue)}

const numV  = v => { const n = parseFloat(String(v||'').replace(/[^0-9.]/g,'')); return isNaN(n) ? 0 : n; };
const fmtN  = v => { const n = numV(v); return n >= 1000000 ? (n/1000000).toFixed(1)+'M' : n >= 1000 ? (n/1000).toFixed(1)+'K' : (n ? (Math.round(n*100)/100) : (n===0?'0':'—')); };

function frontendBookId(author, title) {

}
function normStatus(raw) {

function formatAgo(ts) {
  if (!ts) return null;
  const d = Math.floor((Date.now() - ts) / 1000);
  if (d < 60)    return 'just now';
  if (d < 3600)  return `${Math.floor(d/60)}m ago`;
  if (d < 86400) return `${Math.floor(d/3600)}h ago`;
  if (d < 86400*7) return `${Math.floor(d/86400)}d ago`;
  return new Date(ts).toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
}
function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso); if (isNaN(d)) return '—';
  return d.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
}
// v22 — live-updating "ago" chips (same pattern as the Command Centre): each
// chip stores its own ts; one global interval refreshes all of them so the
// "Updated Xm ago" pill ticks forward without a re-render.
function agoSpan(ts) { return ts ? `<span class="live-ago" data-ts="${ts}">${formatAgo(ts) || ''}</span>` : ''; }
function refreshAgoLabels() {
  document.querySelectorAll('.live-ago[data-ts]').forEach(el => {
    const ts = parseInt(el.getAttribute('data-ts'), 10);
    const t = ts ? formatAgo(ts) : null;
    if (t) el.textContent = t;
  });
}
if (!window._agoInterval) { window._agoInterval = setInterval(refreshAgoLabels, 30000); }
function isStale(ts) { return !ts || (Date.now() - ts) > 3*24*60*60*1000; }
function getCampaignWeekInfo(b) {
  const raw = b['Campaign Live Date']; if (!raw) return null;
  const ld = new Date(raw); if (isNaN(ld.getTime())) return null;
  const live = new Date(Date.UTC(ld.getFullYear(), ld.getMonth(), ld.getDate()));
  const today = new Date();
  const todayUTC = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
  const diff = Math.floor((todayUTC - live) / 86400000);
  if (diff < 0) return { started: false, daysUntil: Math.abs(diff), liveDate: live };
  return {
    started: true, campaignWeek: Math.floor(diff / 7) + 1,
    campaignMonth: Math.floor(diff / 28) + 1, dayOfWeek: diff % 7 + 1,
    dayOfCampaign: diff + 1, liveDate: live, totalDaysElapsed: diff,
  };
}
function getCurrentMonthYear() { const n = new Date(); return { month: n.getMonth(), year: n.getFullYear() }; }
function monthKeyOf(year, month) { return `${year}-${String(month+1).padStart(2,'0')}`; }
function getNextPaymentDate(b) {
  const raw = b['Campaign Live Date']; if (!raw) return null;
  const ld  = new Date(raw); if (isNaN(ld.getTime())) return null;
  const day = ld.getDate();
  const now = new Date();
  let year = now.getFullYear(), month = now.getMonth();
  if (now.getDate() >= day) { month++; if (month > 11) { month = 0; year++; } }
  let dueDay = day;
  const daysInTargetMonth = new Date(year, month + 1, 0).getDate();
  if (dueDay > daysInTargetMonth) dueDay = daysInTargetMonth;
  const due = new Date(year, month, dueDay);
  const daysUntil = Math.ceil((due - now) / 86400000);
  return { date: due, daysUntil };
}
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;

}
function _shortDate(iso) {

  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

function _deltaChip(current, previous) {
  if (!previous || previous === 0) return '';
  const pct = ((current - previous) / previous * 100).toFixed(1);
  const up = current >= previous;
  const col = up ? '#2D7A52' : '#C0392B';
  const bg  = up ? 'rgba(45,122,82,0.1)' : 'rgba(192,57,43,0.08)';
  const arrow = up ? '▲' : '▼';
  return `<span style="font-family:var(--font-m);font-size:.55rem;font-weight:700;
    padding:2px 7px;border-radius:40px;background:${bg};color:${col};
    white-space:nowrap">${arrow} ${Math.abs(pct)}%</span>`;
}

// Inline SVG sparkline — takes an array of numbers, returns a mini trend line
function _sparkline(data, color) {
  if (!data || !Array.isArray(data) || data.length < 2) return '';
  const vals = data.map(v => typeof v === 'number' ? v : parseFloat(v || 0)).filter(v => !isNaN(v));
  if (vals.length < 2 || vals.every(v => v === 0)) return '';
  const w = 64, h = 20, pad = 1;
  const mn = Math.min(...vals), mx = Math.max(...vals);
  const range = mx - mn || 1;
  const pts = vals.map((v, i) => {
    const x = pad + (i / (vals.length - 1)) * (w - 2*pad);
    const y = pad + (1 - (v - mn) / range) * (h - 2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;margin-top:4px">
    <polyline points="${pts}" fill="none" stroke="${color||'var(--f600)'}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function _engRate(views, likes, comments, shares) {
  if (!views || views === 0) return null;
  return ((likes + comments + shares) / views * 100).toFixed(2);
}

/* ── Album cover lazy-fetch queue ────────────────────────────────
   Client-side throttle so a page with many uncached historical weeks
   doesn't fire dozens of refreshAlbumCover requests at once. See
   PRD_album_cover_previews.md §2.5/§3. ───────────────────────────── */
const _albumCoverQueue = [];
let _albumCoverRunning = 0;
const ALBUM_COVER_MAX_CONCURRENT = 3;
const _albumCoverRequested = new Set();

function queueAlbumCoverFetch(url, imgId) {
  if (!url || _albumCoverRequested.has(url)) return;
  _albumCoverRequested.add(url);
  _albumCoverQueue.push({ url, imgId });
  _pumpAlbumCoverQueue();
}

/* Shared response handler — authors never see errors (tile just stays in
   its icon state), but the console says exactly why a cover didn't load,
   so "backend deployment is stale" vs "extraction found nothing" is
   diagnosable from DevTools without guessing. */
function _applyCoverResult(tag, url, imgId, data) {
  if (data && data.success && data.coverUrl) {
    const el = document.getElementById(imgId);
    if (el) { el.src = data.coverUrl; el.style.display = ''; }
    return;
  }
  if (data && data.error && /unknown action/i.test(data.error)) {
    console.warn(`[albumCover:${tag}] backend deployment is STALE — it has no refreshAlbumCover action yet (needs clasp push + deploy). url=${url}`);
  } else if (data && !data.success) {
    console.warn(`[albumCover:${tag}] backend error: ${data.error || '(no message)'} url=${url}`);
  } else {
    console.warn(`[albumCover:${tag}] no cover found (album private / sharing off / extraction failed). url=${url}`);
  }
}

function refreshAlbumCoverManual(url, imgId, btnEl) {
  if (!url) return;
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = '⏳'; }
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'refreshAlbumCover', url, force: true }),
  })
    .then(r => r.json())
    .then(data => _applyCoverResult('manual', url, imgId, data))
    .catch(e => console.warn(`[albumCover:manual] request failed: ${e.message} url=${url}`))
    .finally(() => { if (btnEl) { btnEl.disabled = false; btnEl.textContent = '🔄'; } });
}

function _pumpAlbumCoverQueue() {
  while (_albumCoverRunning < ALBUM_COVER_MAX_CONCURRENT && _albumCoverQueue.length) {
    const item = _albumCoverQueue.shift();
    _albumCoverRunning++;
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'refreshAlbumCover', url: item.url }),
    })
      .then(r => r.json())
      .then(data => _applyCoverResult('lazy', item.url, item.imgId, data))
      .catch(e => console.warn(`[albumCover:lazy] request failed: ${e.message} url=${item.url}`))
      .finally(() => { _albumCoverRunning--; _pumpAlbumCoverQueue(); });
  }
}

// When a token is supplied, hit the scoped readPortal endpoint (returns only
// this author's book(s) — a fraction of the whole-agency payload). With no
// token, or against a backend that predates readPortal, this transparently
// falls back to the full readAll read (see boot()).
function fetchFromBridge(token) {
  return new Promise((resolve, reject) => {
    const cb = 'asCb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const script = document.createElement('script');
    const scoped = token ? ('&action=readPortal&token=' + encodeURIComponent(token)) : '';
    script.src = APPS_SCRIPT_URL + '?callback=' + cb + scoped + '&t=' + Date.now();
    window[cb] = (data) => { delete window[cb]; document.head.removeChild(script); resolve(data); };
    script.onerror = () => { delete window[cb]; document.head.removeChild(script); reject(new Error('Apps Script request failed')); };
    document.head.appendChild(script);
  });
}

/* ═════════════════════════════════════════════════════════════════
   COLLAPSIBLE SECTION FRAMEWORK
   One builder for every card. `startOpen` is computed from data.
   Chart-bearing sections register an init fn that runs when the
   section is (re)opened — fixes blank charts drawn at 0×0 height.
   ═════════════════════════════════════════════════════════════════ */

const _sectionChartInits = {};   // bodyId → fn(book)
let _chartInstances = {};        // canvasId → Chart instance

function _destroyChart(id) {
  if (_chartInstances[id]) { _chartInstances[id].destroy(); delete _chartInstances[id]; }
}

function pillHTML(p) {
  if (!p || !p.text) return '';
  return `<span class="pill ${p.cls||''}" ${p.id ? `id="${p.id}"` : ''} ${p.hidden ? 'style="display:none"' : ''}>${p.text}</span>`;
}

function section({ id, icon, title, pills = [], accent = '', startOpen = true, body }) {
  const bodyId  = id + '-body';
  const arrowId = id + '-arrow';
  return `<div class="sec ${accent}" id="${id}">
    <div class="sec-hdr${startOpen ? ' open' : ''}" role="button" tabindex="0"
         aria-expanded="${startOpen ? 'true' : 'false'}" aria-controls="${bodyId}"
         onclick="toggleSection('${bodyId}','${arrowId}',this)"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSection('${bodyId}','${arrowId}',this)}">
      ${icon ? `<span class="sec-ico">${icon}</span>` : ''}
      <div class="sec-ttl">${title}</div>
      <div class="sec-pills">${pills.map(pillHTML).join('')}</div>
      <span class="sec-arrow${startOpen ? ' open' : ''}" id="${arrowId}">▼</span>
    </div>
    <div class="sec-body${startOpen ? ' open' : ''}" id="${bodyId}">${body}</div>
  </div>`;
}

function toggleSection(bodyId, arrowId, hdrEl) {
  const body  = document.getElementById(bodyId);
  const arrow = document.getElementById(arrowId);
  if (!body) return;
  const isOpen = body.classList.toggle('open');
  if (arrow) arrow.classList.toggle('open', isOpen);
  if (hdrEl) { hdrEl.classList.toggle('open', isOpen); hdrEl.setAttribute('aria-expanded', isOpen ? 'true' : 'false'); }
  // Redraw any charts inside once the expand transition gives the
  // canvases real dimensions.
  if (isOpen && CURRENT_BOOK && _sectionChartInits[bodyId]) {
    setTimeout(() => _sectionChartInits[bodyId](CURRENT_BOOK), 380);
  }
}

/* ═════════════════════════════════════════════════════════════════
   BOOT + RENDER
   ═════════════════════════════════════════════════════════════════ */

let MULTI_BOOK_POOL = null; // raw (un-adapted) book records sharing this author's master token, or null when not in multi-book mode

async function boot() {
  const { token, author, title } = getParams();
  const wrap = document.getElementById('appWrap');
  if (!token && !author) {
    wrap.innerHTML = `<div class="center-state"><div class="ico">🔗</div><div class="ttl">Missing portal link</div><p>This page needs your personal link from Atomic Shelf.</p></div>`;
    return;
  }
  try {
    // Fast path: token-scoped read. If it's rejected (backend predates
    // readPortal, or a token-hash mismatch) fall back to the full agency read
    // and match client-side — the path that's always worked.
    let data;
    try {
      data = await fetchFromBridge(token);
      if (token && (!data || data.success === false)) data = await fetchFromBridge();
    } catch (_) {
      data = await fetchFromBridge();
    }
    window._rawData = data;
    if (!data.success) throw new Error(data.error || 'Bridge returned an error');

    let matched = [];
    if (token) {
      // F6 — master token first: matches every book whose author's email
      // hashes to this token. Falls back to the legacy single-book token
      // (?token= stays the same URL param for backward compatibility —
      // the word "token" itself must never appear in author-facing copy).
      matched = (data.books || []).filter(rb => rb.email && masterTokenFor(rb.email) === token);
      if (!matched.length) {
        const single = (data.books || []).find(rb => tokenFor(rb.author, rb.title) === token);
        if (single) matched = [single];
      }
    } else {
      const a = author.toLowerCase(), t = (title||'').toLowerCase();
      const single = (data.books || []).find(rb =>
        (rb.author||'').toLowerCase().includes(a) && (!t || (rb.title||'').toLowerCase().includes(t))
      );
      if (single) matched = [single];
    }
    if (!matched.length) throw new Error('Campaign not found');

    if (matched.length > 1) {
      MULTI_BOOK_POOL = matched;
      renderMultiBookLanding(matched);
    } else {
      MULTI_BOOK_POOL = null;
      openPortalBook(matched[0]);
    }
  } catch(e) {
    wrap.innerHTML = `<div class="center-state"><div class="ico">⚠</div><div class="ttl">Couldn't load your campaign</div><p style="color:#C0392B">${esc(e.message)}</p></div>`;
  }
}

function openPortalBook(rawBook) {
  CURRENT_BOOK = adaptBook(rawBook);
  CURRENT_BOOK._activityLog = (window._rawData.activityLogs || {})[rawBook.id] || [];
  render();
  loadThread();
  loadCampaignNotes();
  if (_threadPollInterval) clearInterval(_threadPollInterval);
  _threadPollInterval = setInterval(loadThread, 30 * 1000);
}

/* ═════════════════════════════════════════════════════════════════
   F6 — MULTI-BOOK LANDING
   Shown when a master token (keyed to email) resolves to more than one
   book. Navigation into a book is in-page (openPortalBook swaps
   appWrap's content) — there is no per-book URL to link to here.
   ═════════════════════════════════════════════════════════════════ */
function renderMultiBookLanding(rawBooks) {
  const wrap = document.getElementById('appWrap');
  const adapted = rawBooks.map(rb => adaptBook(rb));
  const firstName = ((adapted[0]['Author Name']||'').trim().split(/\s+/)[0]) || 'there';

  const cards = adapted.map((b, i) => {
    const wk = getCampaignWeekInfo(b);
    const st = normStatus(b['Campaign Status']);
    const sCls = st === 'active' ? 'green' : st === 'trial' ? 'blue' : 'gold';
    const cw = b.currentWeekData;
    const steps = cw ? cw.steps : {};
    const activeSteps = getActiveSteps(b);
    const done = activeSteps.filter(s => stepDone(steps, s.key)).length;
    // Public-friendly health signal: checklist completion only — no contact
    // recency or payment status, which are admin-internal per F2/F10.
    const pct = activeSteps.length ? Math.round(done / activeSteps.length * 100) : 0;
    const healthCls = pct >= 80 ? 'green' : pct >= 50 ? 'gold' : 'red';

    return `<div class="book-card" onclick="selectPortalBookFromLanding(${i})">
      <div class="book-card-cover">📖</div>
      <div class="book-card-body">
        <div class="book-card-title">${esc(b['Book Title'])}</div>
        <div class="book-card-meta">
          <span class="pill ${sCls}">${esc(statusLabel(b['Campaign Status']))}</span>
          ${wk && wk.started ? `<span class="pill purple">Week ${wk.campaignWeek}</span>` : ''}
        </div>
        <div class="book-card-health"><span class="health-dot ${healthCls}"></span>${pct}% on track this week</div>
      </div>
    </div>`;
  }).join('');

  wrap.innerHTML = `
    <div class="multi-landing-hero">
      <div class="greeting">Hi ${esc(firstName)}.</div>
      <div class="book-title">Your Books</div>
      <div class="multi-landing-sub">You have ${adapted.length} books in your Atomic Shelf campaign.</div>
    </div>
    <div class="book-card-grid">${cards}</div>`;
}

function selectPortalBookFromLanding(i) {
  if (!MULTI_BOOK_POOL || !MULTI_BOOK_POOL[i]) return;
  openPortalBook(MULTI_BOOK_POOL[i]);
}

/* Card order — the story an author wants, top to bottom:
   who/where am I → what's happening this week → how is it performing
   → who's watching → the full record → what the team did → talk to us
   → money & controls → what's next (roadmap) → rate us. */
function render() {
  const b = CURRENT_BOOK;
  const wrap = document.getElementById('appWrap');
  if (!b) { wrap.innerHTML = `<div class="center-state"><div class="ico">📭</div><div class="ttl">No campaign found</div></div>`; return; }

  const backBtn = MULTI_BOOK_POOL
    ? `<button class="portal-back-btn" onclick="renderMultiBookLanding(MULTI_BOOK_POOL)">← Back to my books</button>`
    : '';

  wrap.innerHTML = backBtn + [
    buildHero(b),
    buildStatusCard(b),             // Feature E — done vs next + "to be published" backlog
    buildThisWeekSection(b),        // merged: week widget + checklist + this week's media
    buildTikTokSection(b),          // expanded when it has data
    buildYouTubeSection(b),         // expanded when it has data (incl. daily views chart)
    buildAmazonSection(b),          // expanded when it has data
    buildAudienceSection(b),        // expanded when it has data
    buildHistorySection(b),         // expanded when weeks exist
    buildContentScriptsSection(b),  // Content Library — per-week videos + scripts, inventory
    buildRoadmapSection(b),         // collapsed by default
    buildMessagesSection(b),        // chat — collapsed by default, unread pill
    buildPaymentSection(b),         // only appears ≤7 days out
    buildCampaignStatusSection(b),  // pause / resume
    buildNotesSection(b),           // collapsed by default
    buildFeedbackSection(b),        // ALWAYS collapsed (per design)
    buildActivitySection(b),        // Production Updates — very bottom, collapsed by default
  ].join('');

  // Draw charts for sections that start open, once the DOM has painted.
  requestAnimationFrame(() => {
    Object.keys(_sectionChartInits).forEach(bodyId => {
      const el = document.getElementById(bodyId);
      if (el && el.classList.contains('open')) _sectionChartInits[bodyId](b);
    });
  });
}
