function _videoRowHTML(v, i) {
  const views    = parseFloat(v.views || v['Total views'] || 0);
  const likes    = parseFloat(v.likes || v['Total likes'] || 0);
  const comments = parseFloat(v.comments || v['Total comments'] || 0);
  const shares   = parseFloat(v.shares || v['Total shares'] || 0);
  const er = views > 0 ? ((likes + comments + shares) / views * 100).toFixed(1) : '—';
  const link = v.link || v['Video link'] || v.videoLink || '';
  let title = v.title || v['Video title'] || v.videoTitle || '(untitled)';
  const hashIdx = title.indexOf('  #');
  if (hashIdx > 0) title = title.slice(0, hashIdx).trim();
  if (title.length > 72) title = title.slice(0, 72) + '…';
  const postDate = v.postDate || v['Post time'] || v.date || '';

  return `<tr style="border-bottom:1px solid var(--border-lt)">
    <td style="padding:10px 8px;font-family:var(--font-m);font-size:.62rem;font-weight:700;color:var(--muted);width:24px;text-align:center">${i + 1}</td>
    <td style="padding:10px 8px 10px 0;max-width:0;width:100%">
      ${link
        ? `<a href="${esc(link)}" target="_blank" rel="noopener" style="font-size:.8rem;font-weight:600;color:var(--b800);text-decoration:none;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(v.title || '')}">${esc(title)} <span style="font-size:.6rem;color:var(--blue)">↗</span></a>`
        : `<span style="font-size:.8rem;font-weight:600;color:var(--b800);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(title)}</span>`}
      ${postDate ? `<div style="font-family:var(--font-m);font-size:.54rem;color:var(--muted);margin-top:2px">${esc(postDate)}</div>` : ''}
    </td>
    <td style="padding:10px 12px 10px 8px;text-align:right;white-space:nowrap">
      <div style="font-family:var(--font-d);font-size:.95rem;font-weight:700;color:var(--b800)">${fmtN(views)}</div>
      <div style="font-family:var(--font-m);font-size:.48rem;color:var(--muted)">views</div>
    </td>
    <td style="padding:10px 12px 10px 0;text-align:right;white-space:nowrap">
      <div style="font-family:var(--font-d);font-size:.88rem;font-weight:600;color:var(--purple)">${fmtN(likes)}</div>
      <div style="font-family:var(--font-m);font-size:.48rem;color:var(--muted)">likes</div>
    </td>
    <td style="padding:10px 12px 10px 0;text-align:right;white-space:nowrap">
      <div style="font-family:var(--font-d);font-size:.88rem;font-weight:600;color:${parseFloat(er) >= 5 ? 'var(--f500)' : 'var(--orange)'}">${er}${er !== '—' ? '%' : ''}</div>
      <div style="font-family:var(--font-m);font-size:.48rem;color:var(--muted)">eng.</div>
    </td>
  </tr>`;
}

// v22b — only videos that have actually pulled views belong in "Top Videos";
// zero-view uploads get their own section so they read as a to-do (republish
// candidates), not as failures padding the leaderboard.
function _videoViews_(v) { return parseFloat(v.views || v['Total views'] || 0) || 0; }
function _splitVideos_(b) {
  const all = (b.contentHistory || []).slice();
  const withViews = all.filter(v => _videoViews_(v) > 0)
    .sort((a, z) => _videoViews_(z) - _videoViews_(a));
  const zeroViews = all.filter(v => _videoViews_(v) <= 0);
  return { withViews, zeroViews };
}

function buildTopVideosTable(b) {
  const { withViews, zeroViews } = _splitVideos_(b);

  if (withViews.length === 0 && zeroViews.length === 0) {
    return `<div>
      <div class="platform-title">Top Videos</div>
      <div style="font-size:.78rem;color:var(--muted);font-style:italic;text-align:center;padding:18px 0">
        No individual video data yet — your team logs this weekly.
      </div>
    </div>`;
  }

  const MAX_VISIBLE = 5;
  const showAll = withViews.length <= MAX_VISIBLE;
  const visible = withViews.slice(0, MAX_VISIBLE);

  const topTable = withViews.length ? `
    <div class="platform-title">Top Videos <span style="margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0">${withViews.length} with views</span></div>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;table-layout:fixed">
        <colgroup><col style="width:28px"><col style="width:auto"><col style="width:72px"><col style="width:64px"><col style="width:56px"></colgroup>
        <tbody id="top-videos-tbody">${visible.map((v, i) => _videoRowHTML(v, i)).join('')}</tbody>
      </table>
    </div>
    ${!showAll ? `<button onclick="toggleAllVideos()" id="tv-toggle-btn"
        style="margin-top:10px;background:none;border:1px dashed var(--border);border-radius:var(--r-sm);
               font-family:var(--font-m);font-size:.6rem;color:var(--muted);padding:6px 14px;cursor:pointer;width:100%;transition:all .15s"
        onmouseover="this.style.background='var(--w200)'" onmouseout="this.style.background='none'">
      Show all ${withViews.length} videos ▾</button>` : ''}` : `
    <div class="platform-title">Top Videos</div>
    <div style="font-size:.78rem;color:var(--muted);font-style:italic;text-align:center;padding:12px 0">
      No videos with views yet — the first numbers usually land within a few days of posting.
    </div>`;

  const zeroSection = zeroViews.length ? `
    <div style="margin-top:16px;border:1px solid var(--border-lt);border-radius:var(--r-sm);overflow:hidden">
      <button onclick="toggleZeroViews()" id="zv-toggle-btn" style="width:100%;display:flex;align-items:center;gap:8px;background:rgba(201,144,38,.05);border:none;padding:9px 14px;cursor:pointer;font-family:var(--font-m);font-size:.62rem;font-weight:700;color:var(--muted);text-align:left">
        ⏳ Awaiting first views (${zeroViews.length}) <span style="font-weight:400">— being monitored; may be republished for a second push</span>
        <span id="zv-caret" style="margin-left:auto">▾</span>
      </button>
      <div id="zero-views-wrap" style="display:none;padding:4px 14px 10px">
        ${zeroViews.map(v => {
          let title = v.title || v['Video title'] || v.videoTitle || '(untitled)';
          const hashIdx = title.indexOf('  #'); if (hashIdx > 0) title = title.slice(0, hashIdx).trim();
          if (title.length > 72) title = title.slice(0, 72) + '…';
          const link = v.link || v['Video link'] || v.videoLink || '';
          const postDate = v.postDate || v['Post time'] || v.date || '';
          return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-lt);font-size:.76rem;color:var(--b700)">
            ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener" style="color:var(--b700);text-decoration:none;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(title)} <span style="font-size:.58rem;color:var(--blue)">↗</span></a>`
                   : `<span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(title)}</span>`}
            ${postDate ? `<span style="font-family:var(--font-m);font-size:.54rem;color:var(--muted);white-space:nowrap">${esc(postDate)}</span>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>` : '';

  return `<div>${topTable}${zeroSection}</div>`;
}

function toggleZeroViews() {
  const wrap = document.getElementById('zero-views-wrap');
  const caret = document.getElementById('zv-caret');
  if (!wrap) return;
  const open = wrap.style.display !== 'none';
  wrap.style.display = open ? 'none' : 'block';
  if (caret) caret.textContent = open ? '▾' : '▴';
}

function toggleAllVideos() {
  const b = CURRENT_BOOK; if (!b) return;
  window._tvExpanded = !window._tvExpanded;
  const tbody = document.getElementById('top-videos-tbody');
  const btn = document.getElementById('tv-toggle-btn');
  const { withViews } = _splitVideos_(b);
  if (!tbody) return;
  const rows = window._tvExpanded ? withViews : withViews.slice(0, 5);
  tbody.innerHTML = rows.map((v, i) => _videoRowHTML(v, i)).join('');
  if (btn) btn.textContent = window._tvExpanded ? 'Show fewer ▴' : `Show all ${withViews.length} videos ▾`;
}

/* ═════════════════════════════════════════════════════════════════
   CHARTS
   AUDIT FIX: previously _buildWoWBarChart returned early on
   (weeks.length < 2) and _buildYouTubeViewsChart was declared
   *inside* it — so the WoW body after the guard was dead code and
   the YouTube chart function was never a top-level symbol. Both are

function _cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function initTikTokCharts(b) {
  if (!b) return;
  if (typeof Chart === 'undefined') { setTimeout(() => initTikTokCharts(b), 400); return; }
  ['chart-views','chart-audience','chart-engagement'].forEach(_destroyChart);

  const history = (b.metricsHistory || [])
    .filter(e => e['TikTok Views'] !== undefined || e.tikTokViews !== undefined)
    .sort((a, z) => new Date(a.date) - new Date(z.date));
  if (history.length === 0) return;

  _buildViewsLineChart(b, history);
  _buildAudienceBarChart(b, history);
  _buildEngagementDonut(b, history);
}

function _buildViewsLineChart(b, history) {
  const canvas = document.getElementById('chart-views'); if (!canvas) return;
  const active = history.filter((e, idx) =>
    (parseFloat(e['TikTok Views'] || e.tikTokViews || 0)) > 0 || idx >= history.length - 14
  ).slice(-30);
  const labels  = active.map(e => _shortDate(e.date));
  const views   = active.map(e => parseFloat(e['TikTok Views'] || e.tikTokViews || 0));
  const profile = active.map(e => parseFloat(e['TikTok Profile Visits'] || e.tikTokProfileVisits || 0));

  _chartInstances['chart-views'] = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets: [
      { label: 'Video Views', data: views, borderColor: '#7D3C98', backgroundColor: 'rgba(125,60,152,0.08)', borderWidth: 2, tension: 0.4, fill: true, pointRadius: 3, pointHoverRadius: 5, pointBackgroundColor: '#7D3C98' },
      { label: 'Profile Visits', data: profile, borderColor: '#2D7A52', backgroundColor: 'rgba(45,122,82,0.06)', borderWidth: 1.5, tension: 0.4, fill: false, pointRadius: 2, pointHoverRadius: 4, pointBackgroundColor: '#2D7A52', borderDash: [4, 3] },
    ]},
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', align: 'end', labels: { boxWidth: 10, padding: 14, usePointStyle: true } },
        tooltip: { backgroundColor: '#1E1208', titleColor: '#F5EDCF', bodyColor: '#C4A882', padding: 10, cornerRadius: 8 },
      },
      scales: {
        x: { grid: { display: false }, border: { display: false }, ticks: { maxTicksLimit: 8 } },
        y: { grid: { color: 'rgba(212,185,90,0.1)' }, border: { display: false }, beginAtZero: true, ticks: { maxTicksLimit: 5 } },
      },
    },
  });
}

function _buildAudienceBarChart(b, history) {
  const canvas = document.getElementById('chart-audience'); if (!canvas) return;
  const withAudience = history.filter(e =>
    parseFloat(e['TikTok New Followers'] || e.tikTokNewFollowers || 0) > 0 ||
    parseFloat(e['TikTok Follower Count'] || e.tikTokFollowerCount || 0) > 0
  ).slice(-20);

  if (withAudience.length === 0) {
    const wrap = document.getElementById('chart-audience-wrap');
    if (wrap) wrap.innerHTML = `<div class="chart-box-ttl">Audience growth</div><div style="display:flex;align-items:center;justify-content:center;height:140px;font-size:.78rem;color:var(--muted);font-style:italic">Audience breakdown data not yet available</div>`;
    return;
  }

  const labels = withAudience.map(e => _shortDate(e.date));
  const newF   = withAudience.map(e => parseFloat(e['TikTok New Followers'] || e.tikTokNewFollowers || 0));
  const totalF = withAudience.map(e => parseFloat(e['TikTok Follower Count'] || e.tikTokFollowerCount || 0));

  _chartInstances['chart-audience'] = new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets: [
      { label: 'New Followers', data: newF, backgroundColor: 'rgba(45,122,82,0.75)', borderRadius: 3, borderSkipped: false },
      { label: 'Total Followers', data: totalF, backgroundColor: 'rgba(201,168,76,0.45)', borderRadius: 3, borderSkipped: false },
    ]},
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', align: 'end', labels: { boxWidth: 10, padding: 12, usePointStyle: true } },
        tooltip: { backgroundColor: '#1E1208', titleColor: '#F5EDCF', bodyColor: '#C4A882', padding: 10, cornerRadius: 8 },
      },
      scales: {
        x: { grid: { display: false }, border: { display: false }, ticks: { maxTicksLimit: 6 } },
        y: { grid: { color: 'rgba(212,185,90,0.1)' }, border: { display: false }, beginAtZero: true, ticks: { maxTicksLimit: 4 } },
      },
    },
  });
}

function _buildEngagementDonut(b, history) {
  const canvas = document.getElementById('chart-engagement'); if (!canvas) return;
  let totalLikes = 0, totalComments = 0, totalShares = 0, totalSaves = 0;
  history.forEach(e => {
    totalLikes    += parseFloat(e['TikTok Likes']    || e.tikTokLikes    || 0);
    totalComments += parseFloat(e['TikTok Comments'] || e.tikTokComments || 0);
    totalShares   += parseFloat(e['TikTok Shares']   || e.tikTokShares   || 0);
    totalSaves    += parseFloat(e['TikTok Saves']    || e.tikTokSaves    || 0);
  });
  if (totalLikes + totalComments + totalShares + totalSaves === 0) {
    totalLikes    = parseFloat(b['TikTok Likes']    || 0);
    totalComments = parseFloat(b['TikTok Comments'] || 0);
    totalShares   = parseFloat(b['TikTok Shares']   || 0);
    totalSaves    = parseFloat(b['TikTok Saves']    || 0);
  }
  const total = totalLikes + totalComments + totalShares + totalSaves;
  if (total === 0) {
    const wrap = document.getElementById('chart-engagement-wrap');
    if (wrap) wrap.innerHTML = `<div class="chart-box-ttl">Engagement split</div><div style="display:flex;align-items:center;justify-content:center;height:140px;font-size:.78rem;color:var(--muted);font-style:italic">Engagement data not yet available</div>`;
    return;
  }

  _chartInstances['chart-engagement'] = new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels: ['Likes', 'Comments', 'Shares', 'Saves'],
      datasets: [{ data: [totalLikes, totalComments, totalShares, totalSaves],
        backgroundColor: ['rgba(125,60,152,0.8)','rgba(36,113,163,0.8)','rgba(201,168,76,0.8)','rgba(45,122,82,0.8)'],
        borderWidth: 0, hoverOffset: 6 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '68%',
      plugins: {
        legend: { position: 'right', labels: { boxWidth: 10, padding: 12, usePointStyle: true } },
        tooltip: {
          backgroundColor: '#1E1208', titleColor: '#F5EDCF', bodyColor: '#C4A882', padding: 10, cornerRadius: 8,
          callbacks: { label: ctx => {
            const pct = total > 0 ? ((ctx.parsed / total) * 100).toFixed(1) : '0';
            return ` ${ctx.label}: ${ctx.parsed.toLocaleString()} (${pct}%)`;
          } },
        },
      },
    },
  });
}

function _buildBenchmarkBars(b) {
  const views    = parseFloat(b['TikTok Views'] || 0);
  const likes    = parseFloat(b['TikTok Likes'] || 0);
  const comments = parseFloat(b['TikTok Comments'] || 0);
  const shares   = parseFloat(b['TikTok Shares'] || 0);
  const er = views > 0 ? ((likes + comments + shares) / views * 100) : 0;
  const benchmarks = [
    { label: 'Engagement Rate', value: er, target: 6.5, fmt: v => v.toFixed(1) + '%' },
    { label: 'Like Rate', value: views > 0 ? likes / views * 100 : 0, target: 5.0, fmt: v => v.toFixed(1) + '%' },
    { label: 'Share Rate', value: views > 0 ? shares / views * 100 : 0, target: 1.0, fmt: v => v.toFixed(2) + '%' },
  ];
  return benchmarks.map(bm => {
    const pct  = bm.target > 0 ? Math.min(bm.value / bm.target * 100, 150) : 0;
    const good = bm.value >= bm.target;
    const barW = Math.min(pct, 100);
    const overW = pct > 100 ? Math.min(pct - 100, 50) : 0;
    return `<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <span style="font-size:.72rem;font-weight:600;color:var(--b700)">${bm.label}</span>
        <span style="font-family:var(--font-m);font-size:.65rem;color:${good ? 'var(--f600)' : 'var(--orange)'}">
          ${bm.fmt(bm.value)}<span style="color:var(--muted);font-weight:400"> / ${bm.fmt(bm.target)} avg</span>
        </span>
      </div>
      <div style="height:6px;background:var(--b100);border-radius:3px;overflow:hidden;position:relative">
        <div style="height:100%;width:${barW}%;background:${good ? 'var(--f500)' : 'var(--orange)'};border-radius:3px;transition:width .5s ease"></div>
        ${overW > 0 ? `<div style="position:absolute;top:0;left:${barW}%;height:100%;width:${overW * 0.5}%;background:rgba(45,122,82,0.35);border-radius:0 3px 3px 0"></div>` : ''}
        <div style="position:absolute;top:-1px;left:66.6%;height:8px;width:2px;background:var(--b300);border-radius:1px"></div>
      </div>
    </div>`;
  }).join('');
}

function _wowChartOptions(yLabel, max) {
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: { backgroundColor: '#1E1208', titleColor: '#F5EDCF', bodyColor: '#C4A882', padding: 10, cornerRadius: 8 },
    },
    scales: {
      x: { grid: { display: false }, border: { display: false } },
      y: { max, grid: { color: 'rgba(212,185,90,0.1)' }, border: { display: false }, beginAtZero: true,

    },

}

/* ═════════════════════════════════════════════════════════════════
   F5 — WEEK-OVER-WEEK ANALYTICS CHART (Campaign History)
   Dual-axis chart: checklist completion % (bars, left axis) vs
   TikTok views (line, right axis) — plus a platform-comparison
   stacked bar and a month-level aggregate table below.
   ═════════════════════════════════════════════════════════════════ */

/* Buckets each week's metricsHistory entries by campaign week (Sun-Sat from
   live date) — shared by the dual-axis chart, the platform chart, and the
   month aggregate table so the three always agree with each other. */
function _weeklyMetricSeries_(b, weeks) {
  const history  = (b.metricsHistory || []).slice().sort((a, z) => new Date(a.date) - new Date(z.date));
  const liveDate = b['Campaign Live Date'] ? new Date(b['Campaign Live Date']) : null;
  return weeks.map(w => {
    if (!liveDate) return { tiktokViews: 0, ytViews: 0, bsr: null };
    const wStart = new Date(liveDate);
    wStart.setDate(wStart.getDate() + (w.weekNum - 1) * 7);
    const wEnd = new Date(wStart);
    wEnd.setDate(wEnd.getDate() + 6);
    const entries = history.filter(e => { const d = new Date(e.date); return d >= wStart && d <= wEnd; });
    const tiktokViews = entries.reduce((s, e) => s + parseFloat(e['TikTok Views'] || e.tikTokViews || 0), 0);
    const ytViews     = entries.reduce((s, e) => s + parseFloat(e['YT Views']     || e.ytViews     || 0), 0);
    const bsrVals = entries.map(e => parseFloat(e['Amazon BSR'] || e.amazonBsr || 0)).filter(v => v > 0);
    return { tiktokViews, ytViews, bsr: bsrVals.length ? bsrVals[bsrVals.length - 1] : null };
  });
}

function _buildWeekOverWeekChart(b) {
  const canvasId = 'chart-wow';
  const canvas = document.getElementById(canvasId); if (!canvas) return;
  if (typeof Chart === 'undefined') { setTimeout(() => _buildWeekOverWeekChart(b), 400); return; }

  const weeks = (b.weeks || []).slice().sort((a, z) => a.weekNum - z.weekNum);
  if (weeks.length < 2) { _destroyChart(canvasId); return; }

  const series    = _weeklyMetricSeries_(b, weeks);
  const labels    = weeks.map(w => `Week ${w.weekNum}`);
  const pctData   = weeks.map(w => w.pctDone || 0);
  const viewsData = series.map(s => s.tiktokViews);
  const maxViews  = Math.max(1, ...viewsData);

  _destroyChart(canvasId);
  _chartInstances[canvasId] = new Chart(canvas, {
    data: {
      labels,
      datasets: [
        {
          type: 'bar', label: 'Checklist Completion %', data: pctData, yAxisID: 'y', order: 2,
          backgroundColor: weeks.map(w => w.pctDone === 100 ? '#1B3A52' : '#FBF7ED'),
          borderColor: '#1B3A52', borderWidth: 1.5, borderRadius: 4, borderSkipped: false,
        },
        {
          type: 'line', label: 'TikTok Views', data: viewsData, yAxisID: 'y1', order: 1,
          borderColor: '#C9A84C', backgroundColor: 'transparent', borderWidth: 2.5,
          pointBackgroundColor: '#C9A84C', pointRadius: 3, tension: .3, fill: false,
        },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: true, position: 'bottom', labels: { boxWidth: 10, font: { size: 9 }, color: '#7A5C2E' } },
        tooltip: {
          backgroundColor: '#1E1208', titleColor: '#F5EDCF', bodyColor: '#C4A882', padding: 10, cornerRadius: 8,
          callbacks: {
            title: items => {
              const w = weeks[items[0].dataIndex];
              const range = (w.weekStart && w.weekEnd) ? ` (${formatDate(w.weekStart)} – ${formatDate(w.weekEnd)})` : '';
              return `Week ${w.weekNum}${range}`;
            },
          },
        },
      },
      scales: {
        x: { grid: { display: false }, border: { display: false } },
        y:  { type: 'linear', position: 'left',  min: 0, max: 100, grid: { color: 'rgba(212,185,90,.1)' }, border: { display: false },
              title: { display: true, text: 'Completion %', color: '#9E7B52', font: { size: 9 } }, ticks: { maxTicksLimit: 5 } },
        y1: { type: 'linear', position: 'right', min: 0, max: maxViews * 1.2, grid: { display: false }, border: { display: false },
              title: { display: true, text: 'TikTok Views', color: '#9E7B52', font: { size: 9 } }, ticks: { maxTicksLimit: 5 } },
      },
    },
  });
}

function _buildPlatformComparisonChart(b) {
  const canvasId = 'chart-platform-compare';
  const canvas = document.getElementById(canvasId); if (!canvas) return;
  if (typeof Chart === 'undefined') { setTimeout(() => _buildPlatformComparisonChart(b), 400); return; }

  const weeks = (b.weeks || []).slice().sort((a, z) => a.weekNum - z.weekNum);
  if (weeks.length < 2) { _destroyChart(canvasId); return; }

  const series = _weeklyMetricSeries_(b, weeks);
  if (!series.some(s => s.tiktokViews > 0 || s.ytViews > 0)) { _destroyChart(canvasId); return; }

  _destroyChart(canvasId);
  const labels = weeks.map(w => `Week ${w.weekNum}`);
  _chartInstances[canvasId] = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'TikTok',  data: series.map(s => s.tiktokViews), backgroundColor: 'rgba(125,60,152,0.75)', stack: 'views' },
        { label: 'YouTube', data: series.map(s => s.ytViews),     backgroundColor: 'rgba(192,57,43,0.7)',   stack: 'views' },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: true, position: 'bottom', labels: { boxWidth: 10, font: { size: 9 }, color: '#7A5C2E' } },
        tooltip: { backgroundColor: '#1E1208', titleColor: '#F5EDCF', bodyColor: '#C4A882', padding: 10, cornerRadius: 8 },
      },
      scales: {
        x: { stacked: true, grid: { display: false }, border: { display: false } },
        y: { stacked: true, grid: { color: 'rgba(212,185,90,.1)' }, border: { display: false }, ticks: { maxTicksLimit: 5 } },
      },
    },
  });
}

/* Month-level aggregates — grouped by actual 4-week campaign month
   (ceil(weekNum/4)) per the PRD's locked "campaign month" definition,
   not the calendar month used elsewhere in this section's weeks-grid. */
function buildMonthAggregateTable(b) {
  const weeks = (b.weeks || []).filter(w => w.weekNum).slice().sort((a, z) => a.weekNum - z.weekNum);
  if (weeks.length < 2) return '';
  const series = _weeklyMetricSeries_(b, weeks);

  const byMonth = {};
  weeks.forEach((w, i) => {
    const cm = Math.ceil(w.weekNum / 4);
    if (!byMonth[cm]) byMonth[cm] = { count: 0, pctSum: 0, views: 0, bsrs: [] };
    const agg = byMonth[cm];
    agg.count++;
    agg.pctSum += (w.pctDone || 0);
    agg.views  += series[i].tiktokViews + series[i].ytViews;
    if (series[i].bsr) agg.bsrs.push(series[i].bsr);
  });

  const rows = Object.keys(byMonth).map(Number).sort((a, z) => a - z).map(cm => {
    const agg = byMonth[cm];
    const avgCompletion = Math.round(agg.pctSum / agg.count);
    const avgBsr = agg.bsrs.length ? Math.round(agg.bsrs.reduce((s, v) => s + v, 0) / agg.bsrs.length) : null;
    return `<tr><td>Month ${cm}</td><td>${avgCompletion}%</td><td>${fmtN(agg.views)}</td><td>${avgBsr ? '#' + avgBsr.toLocaleString() : '—'}</td></tr>`;
  }).join('');

  return `<table class="month-agg-table">
    <thead><tr><th>Month</th><th>Avg completion</th><th>Total views</th><th>Avg BSR</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

/* YouTube daily engaged-views line — now a real top-level function */
function _buildYouTubeViewsChart(b) {
  const canvasId = 'chart-yt-views';
  const canvas = document.getElementById(canvasId); if (!canvas) return;
  if (typeof Chart === 'undefined') { setTimeout(() => _buildYouTubeViewsChart(b), 400); return; }

  const rows = b.videoDailyMetrics || [];
  if (!rows.length) { _destroyChart(canvasId); return; }

  const byDate = {};
  rows.forEach(r => { if (!r.date) return; byDate[r.date] = (byDate[r.date] || 0) + (parseFloat(r.engagedViews) || 0); });
  const dates = Object.keys(byDate).sort();
  if (!dates.length) { _destroyChart(canvasId); return; }

  _destroyChart(canvasId);
  const labels = dates.map(d => _shortDate(d));
  const values = dates.map(d => byDate[d]);

  _chartInstances[canvasId] = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets: [{
      label: 'YouTube Views', data: values,
      borderColor: '#C0392B', backgroundColor: 'rgba(192,57,43,0.08)',
      borderWidth: 2, tension: 0.4, fill: true, pointRadius: 3, pointHoverRadius: 5, pointBackgroundColor: '#C0392B',
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: '#1E1208', titleColor: '#F5EDCF', bodyColor: '#C4A882', padding: 10, cornerRadius: 8 },
      },
      scales: {
        x: { grid: { display: false }, border: { display: false }, ticks: { maxTicksLimit: 8 } },
        y: { grid: { color: 'rgba(212,185,90,0.1)' }, border: { display: false }, beginAtZero: true, ticks: { maxTicksLimit: 5 } },
      },
    },
  });
}

/* ── Chart.js global defaults ─────────────────────────────────── */
document.addEventListener('DOMContentLoaded', function() {
  if (typeof Chart !== 'undefined') {
    Chart.defaults.font.family = "'DM Mono', monospace";
    Chart.defaults.font.size   = 10;
    Chart.defaults.color       = '#9E7B52';
  }
});

boot();

</script>
