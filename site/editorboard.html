<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atomic Shelf · Editor Portal</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23E0913C'/%3E%3Cstop offset='1' stop-color='%23A6431F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%232B1D10'/%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='url(%23g)' stroke-width='2.5'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' font-weight='700' text-anchor='middle' fill='url(%23g)'%3EAS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF6EA;--cream2:#F6EBD2;--cream3:#EEDCA8;
  --saffron:#E0913C;--saffron-d:#C6721E;--saffron-dk:#95500F;
  --rust:#C15A3C;--rust-d:#A03F26;
  --clove:#8B4A9C;--clove-bg:rgba(139,74,156,.09);--clove-bd:rgba(139,74,156,.28);
  --moss:#3C8A5E;--moss-d:#296B45;--moss-lt:#EAF5EE;
  --bark:#A17A4C;--bark-d:#7A5A2E;--bark-dk:#5C3D1E;
  --espresso:#3A2413;--ink:#241505;
  --red:#C0392B;--red-bg:rgba(192,57,43,.1);--red-bd:rgba(192,57,43,.28);

  /* Coins palette — amber-gold */
  --coin:#F5C842;--coin-d:#D4A012;--coin-dk:#9A7000;
  --coin-bg:rgba(245,200,66,.12);--coin-bd:rgba(245,200,66,.38);
  --coin-glow:0 0 18px rgba(245,200,66,.28),0 0 4px rgba(245,200,66,.18);

  --bg:var(--cream);--surf:#FFFCF4;--card:#FFFDF8;--bd:#E4CCA4;--bd-lt:#F0E2C0;
  --text:var(--ink);--muted:var(--bark-d);

  --r:10px;--r-sm:7px;--r-lg:16px;--r-xl:24px;
  --sh:0 1px 2px rgba(58,36,19,.04),0 4px 14px rgba(58,36,19,.06);
  --sh-md:0 4px 12px rgba(58,36,19,.08),0 12px 32px rgba(58,36,19,.12);
  --sh-lg:0 8px 24px rgba(58,36,19,.14),0 24px 64px rgba(58,36,19,.18);

    --fB:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --fD:'Fraunces','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --fM:'JetBrains Mono','Courier New',monospace;

  --nav-h:66px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{font-size:18px;scroll-behavior:smooth} /* Bumped from 17px to 18px for better readability */
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(224,145,60,.14), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(60,138,94,.09), transparent 55%),
    radial-gradient(ellipse 600px 600px at 50% 100%, rgba(139,74,156,.04), transparent 60%),
    var(--bg);
  color:var(--text);font-family:var(--fB);min-height:100vh;
  font-weight:500; /* Jakarta Sans looks best slightly heavier */
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  letter-spacing:-.012em; /* Tighter, sleeker tracking */
}

/* Premium Typography Hierarchy */
h1, h2, h3, h4 { font-family:var(--fD); font-weight:600; letter-spacing:-.02em; line-height:1.2; }
.hero-title { font-family:var(--fD); font-size:2.2rem; font-weight:600; letter-spacing:-.02em; line-height:1.15; }
.chart-card-title { font-family:var(--fD); font-size:1.25rem; font-weight:600; letter-spacing:-.01em; }
.stat-label { font-family:var(--fM); font-size:.6rem; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:8px }
.stat-value { font-family:var(--fD); font-size:2.5rem; font-weight:600; line-height:1; color:var(--ink); letter-spacing:-.02em; }

/* Custom Scrollbar for a premium feel */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--cream2)}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--bark)}

#shell{display:flex;flex-direction:column;min-height:100vh}

/* ═══ TOPBAR ═══ */
#topbar{
  position:sticky;top:0;z-index:100;
  height:var(--nav-h);
  background:linear-gradient(120deg,#2B1B0C 0%,#241505 60%,#1A1005 100%);
  border-bottom:1px solid rgba(224,145,60,.22);
  display:flex;align-items:center;gap:0;padding:0 22px;
  box-shadow:0 4px 24px rgba(36,21,5,.28),0 1px 0 rgba(224,145,60,.08) inset;
  backdrop-filter:blur(12px);
}
#topbar .brand{
  display:flex;align-items:center;gap:11px;
  font-family:var(--fD);font-size:1.18rem;font-weight:600;color:#FBF6EA;
  margin-right:30px;flex-shrink:0;letter-spacing:-.01em;
}
#topbar .brand svg{width:30px;height:30px;filter:drop-shadow(0 2px 6px rgba(224,145,60,.35))}
#topbar .brand .slash{color:rgba(224,145,60,.45);margin:0 5px;font-weight:300}
#topbar .brand .editor-chip{
  font-family:var(--fM);font-size:.66rem;font-weight:600;letter-spacing:.04em;
  color:var(--saffron);background:rgba(224,145,60,.12);
  border:1px solid rgba(224,145,60,.28);
  padding:4px 10px;border-radius:20px;
}

#nav-tabs{display:flex;align-items:stretch;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
#nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{
  display:flex;align-items:center;gap:8px; /* Increased gap for SVG */
  font-family:var(--fM);font-size:.7rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;
  color:rgba(251,246,234,.55);
  padding:0 15px;height:var(--nav-h);
  border:none;background:none;cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.nav-tab svg{opacity:.7;transition:opacity .2s}
.nav-tab:hover{color:rgba(251,246,234,.92)}
.nav-tab:hover svg{opacity:1}
.nav-tab.active{color:#FBF6EA;border-bottom-color:var(--saffron)}
.nav-tab.active svg{opacity:1;color:var(--saffron)}
.nav-tab.active::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 60%,rgba(224,145,60,.08));
  pointer-events:none;
}
.nav-tab .badge{
  background:var(--moss-d);color:#fff;font-size:.56rem;font-weight:700;
  min-width:17px;height:17px;border-radius:9px;
  display:inline-flex;align-items:center;justify-content:center;padding:0 4px;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}

.switch-btn{
  font-family:var(--fM);font-size:.6rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:rgba(251,246,234,.55);background:rgba(251,246,234,.04);
  border:1px solid rgba(251,246,234,.12);border-radius:var(--r-sm);
  padding:7px 12px;cursor:pointer;white-space:nowrap;
  transition:all .2s;
}
.switch-btn:hover{color:#FBF6EA;border-color:rgba(251,246,234,.32);background:rgba(251,246,234,.08)}

#main{padding:28px 22px 80px;max-width:920px;margin:0 auto;width:100%;flex:1}
.tab-panel{display:none;animation:fadeUp .4s cubic-bezier(.4,0,.2,1)}
.tab-panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ═══ HERO ═══ */
.hero{
  background:linear-gradient(148deg,var(--card) 0%,var(--cream2) 100%);
  border:1px solid var(--bd);border-radius:var(--r-xl);
  box-shadow:var(--sh-md);padding:28px 30px;margin-bottom:24px;
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--moss-d),var(--saffron),var(--rust));
}
.hero::after{
  content:'';position:absolute;top:-50%;right:-20%;width:60%;height:200%;
  background:radial-gradient(circle,rgba(224,145,60,.08),transparent 60%);
  pointer-events:none;
}
.hero-greeting{
  font-family:var(--fM);font-size:.62rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--moss-d);margin-bottom:6px;
}
.hero-title{
  font-family:var(--fD);font-size:2rem;font-weight:600;color:var(--ink);
  letter-spacing:-.02em;line-height:1.15;
}
.earnings-strip{display:flex;gap:11px;flex-wrap:wrap;margin-top:18px;align-items:center;position:relative;z-index:1}
.e-tile{
  background:var(--surf);border:1px solid var(--bd-lt);border-radius:var(--r);
  padding:12px 18px;display:inline-flex;align-items:baseline;gap:9px;
  transition:all .2s;
}
.e-tile:hover{border-color:var(--bd);box-shadow:var(--sh);transform:translateY(-1px)}
.e-tile .v{font-family:var(--fD);font-size:1.55rem;font-weight:600;color:var(--moss-d);letter-spacing:-.02em}
.e-tile .l{font-family:var(--fM);font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}

/* ═══ SPARKS TILE ═══ */
.coins-tile{
  background:linear-gradient(135deg,#2B1B0C 0%,#1A1005 100%);
  border:1px solid var(--coin-bd);border-radius:var(--r-lg);
  padding:18px 24px;display:inline-flex;align-items:center;gap:16px;
  box-shadow:var(--coin-glow),var(--sh-md);position:relative;overflow:hidden;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.coins-tile:hover{transform:translateY(-2px)}
.coins-tile::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 50%,rgba(245,200,66,.14),transparent),
    radial-gradient(ellipse 60% 100% at 80% 0%,rgba(224,145,60,.08),transparent);
  pointer-events:none;
}
.coins-tile .coin-icon{
  font-size:2.2rem;line-height:1;flex-shrink:0;
  text-shadow:0 0 20px rgba(245,200,66,.6),0 0 40px rgba(245,200,66,.3);
  position:relative;z-index:1;
}
.coins-tile .coin-count{
  font-family:var(--fD);font-size:2.2rem;font-weight:600;color:var(--coin);line-height:1;
  text-shadow:0 0 14px rgba(245,200,66,.5);
  letter-spacing:-.02em;
}
.coins-tile .coin-label{
  font-family:var(--fM);font-size:.58rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.1em;color:rgba(245,200,66,.7);margin-top:3px;
}
.coins-tile .coin-kes{font-family:var(--fM);font-size:.62rem;color:rgba(251,246,234,.42);margin-top:5px}

/* ═══ REDEEM CARD ═══ */
.redeem-card{
  background:linear-gradient(140deg,rgba(245,200,66,.09),rgba(224,145,60,.06));
  border:1px solid var(--coin-bd);border-radius:var(--r-xl);
  padding:22px 24px;margin-bottom:24px;
  box-shadow:var(--sh);
}
.redeem-hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.redeem-hdr-title{font-family:var(--fD);font-size:1.15rem;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.redeem-hdr-sub{font-family:var(--fM);font-size:.62rem;color:var(--muted);margin-left:auto;white-space:nowrap;font-weight:500}
.redeem-rate{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--fM);font-size:.72rem;font-weight:600;
  background:var(--surf);border:1px solid var(--bd-lt);border-radius:var(--r-sm);
  padding:8px 14px;margin-bottom:16px;color:var(--bark-dk);
}
.redeem-rate .coin-ico{color:var(--coin);font-size:.9rem}
.redeem-tiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.redeem-tier{
  background:var(--surf);border:1px solid var(--bd-lt);border-radius:var(--r);
  padding:14px 16px;cursor:pointer;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.redeem-tier:hover{
  border-color:var(--coin-bd);box-shadow:var(--coin-glow);
  transform:translateY(-2px);
}
.redeem-tier .rt-coins{font-family:var(--fD);font-size:1.25rem;font-weight:600;color:var(--coin-dk);letter-spacing:-.01em}
.redeem-tier .rt-kes{font-family:var(--fM);font-size:.66rem;font-weight:600;color:var(--moss-d);margin-top:5px}
.redeem-tier .rt-tag{font-family:var(--fM);font-size:.56rem;color:var(--muted);margin-top:3px;font-weight:500}
.redeem-tier.can-redeem{border-color:var(--coin-bd)}
.redeem-tier.cannot-redeem{opacity:.4;cursor:not-allowed;filter:grayscale(.3)}
.redeem-tier.popular::after{
  content:'Popular';position:absolute;top:-1px;right:10px;
  font-family:var(--fM);font-size:.5rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(135deg,var(--saffron-d),var(--saffron-dk));color:#fff;
  padding:3px 8px;border-radius:0 0 6px 6px;
}

/* ═══ LEVEL STRIP ═══ */
.level-strip{
  display:flex;align-items:center;gap:14px;margin-top:18px;
  background:linear-gradient(90deg,rgba(245,200,66,.1),rgba(60,138,94,.07));
  border:1px solid var(--coin-bd);border-radius:var(--r);
  padding:14px 18px;
  position:relative;overflow:hidden;
}
.level-strip::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 100% 60% at 0% 50%,rgba(245,200,66,.06),transparent);
  pointer-events:none;
}
.level-badge{
  width:46px;height:46px;border-radius:50%;
  background:conic-gradient(var(--coin) var(--lvl-pct,0%), var(--bd-lt) var(--lvl-pct,0%) 100%);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:var(--coin-glow);
  transition:transform .3s;
}
.level-strip:hover .level-badge{transform:rotate(10deg)}
.level-badge-inner{
  width:34px;height:34px;border-radius:50%;background:var(--card);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fD);font-weight:600;font-size:.82rem;color:var(--coin-dk);
}
.level-meta{flex:1;min-width:0;position:relative;z-index:1}
.level-title{font-family:var(--fD);font-weight:600;font-size:1rem;color:var(--ink);letter-spacing:-.01em}
.level-sub{font-family:var(--fM);font-size:.62rem;color:var(--muted);margin-top:3px;font-weight:500}
.level-lifetime{font-family:var(--fM);font-size:.62rem;color:var(--moss-d);margin-top:4px;font-weight:500}
.level-pts{font-family:var(--fD);font-weight:600;font-size:1.2rem;color:var(--coin-dk);white-space:nowrap;letter-spacing:-.01em}
.points-progress{margin-top:10px}
.points-track{height:8px;background:var(--bd-lt);border-radius:6px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(58,36,19,.1)}
.points-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--coin-d),var(--saffron-d));transition:width .6s cubic-bezier(.4,0,.2,1)}

.coin-rates{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.coin-rate-chip{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--fM);font-size:.64rem;font-weight:600;
  background:var(--coin-bg);border:1px solid var(--coin-bd);
  color:var(--coin-dk);border-radius:var(--r-sm);padding:6px 11px;
  transition:all .2s;
}
.coin-rate-chip:hover{box-shadow:var(--coin-glow);transform:translateY(-1px)}
.coin-rate-chip .ico{font-size:.85rem}

.sec-hdr{
  font-family:var(--fM);font-size:.64rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.12em;color:var(--muted);margin:28px 0 14px;
  display:flex;align-items:center;gap:10px;
}
.sec-hdr::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bd-lt),transparent)}

/* ═══ TASK CARDS ═══ */
.task-card{
  background:var(--card);border:1px solid var(--bd-lt);border-radius:var(--r-lg);
  box-shadow:var(--sh);padding:18px 20px;margin-bottom:11px;
  transition:all .25s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.task-card:hover{box-shadow:var(--sh-md);border-color:var(--bd);transform:translateY(-1px)}
.task-book{font-family:var(--fD);font-size:1.12rem;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.task-book-link{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--bd);text-underline-offset:3px;transition:text-decoration-color .2s}
.task-book-link:hover{text-decoration-color:var(--saffron)}
.task-step{font-family:var(--fM);font-size:.7rem;color:var(--bark-dk);margin-top:5px;font-weight:500}
.task-meta{font-family:var(--fM);font-size:.62rem;color:var(--muted);margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.task-links{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.task-link{
  font-family:var(--fM);font-size:.66rem;font-weight:600;color:var(--clove);
  text-decoration:none;background:var(--clove-bg);border:1px solid var(--clove-bd);
  padding:5px 11px;border-radius:20px;
  transition:all .2s;
}
.task-link:hover{background:rgba(139,74,156,.16);transform:translateY(-1px)}
.task-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.tbtn{
  font-family:var(--fM);font-size:.66rem;font-weight:600;
  border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surf);
  color:var(--bark-dk);padding:8px 15px;cursor:pointer;
  transition:all .15s cubic-bezier(.4,0,.2,1);
  letter-spacing:.01em;
}
.tbtn:hover{background:var(--cream);border-color:var(--saffron);transform:translateY(-1px);box-shadow:var(--sh)}
.tbtn:active{transform:translateY(0)}
.tbtn.primary{background:linear-gradient(135deg,var(--moss-d),var(--moss));color:#fff;border-color:var(--moss-d);box-shadow:0 2px 8px rgba(41,107,69,.25)}
.tbtn.primary:hover{background:linear-gradient(135deg,var(--moss),#4DA070);box-shadow:0 4px 12px rgba(41,107,69,.35)}
.tbtn.gold{background:linear-gradient(135deg,var(--saffron-d),var(--rust-d));color:#fff;border-color:var(--saffron-dk);box-shadow:0 2px 8px rgba(198,114,30,.25)}
.tbtn.gold:hover{filter:brightness(1.08);box-shadow:0 4px 12px rgba(198,114,30,.35)}
.tbtn.coin{background:linear-gradient(135deg,var(--coin-d),var(--saffron-d));color:#fff;border-color:var(--coin-dk);box-shadow:0 2px 8px rgba(212,160,18,.3)}
.tbtn.coin:hover{filter:brightness(1.1);box-shadow:var(--coin-glow),0 4px 12px rgba(212,160,18,.3)}

.pill{
  display:inline-flex;align-items:center;font-family:var(--fM);font-size:.58rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:20px;
  border:1px solid var(--bd);background:var(--surf);color:var(--muted);
}
.pill.locked{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.pill.soft{background:rgba(224,145,60,.15);color:var(--saffron-dk);border-color:rgba(224,145,60,.32)}
.pill.open{background:var(--moss-lt);color:var(--moss-d);border-color:rgba(60,138,94,.32)}
.pill.coin-pill{background:var(--coin-bg);color:var(--coin-dk);border-color:var(--coin-bd)}

.time-form{display:flex;gap:8px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--bd-lt);flex-wrap:wrap}
.time-form input,.time-form select{font-family:var(--fB);font-size:.8rem;border:1px solid var(--bd);border-radius:var(--r-sm);padding:7px 10px;background:var(--surf);color:var(--text);transition:border-color .2s}
.time-form input:focus,.time-form select:focus{outline:none;border-color:var(--saffron);box-shadow:0 0 0 3px rgba(224,145,60,.12)}
.time-form input[type=number]{width:84px}

.book-context-panel{
  background:var(--card);border:1px solid var(--saffron);border-radius:var(--r-xl);
  box-shadow:var(--sh-md);padding:20px 22px;margin-bottom:22px;
  position:relative;overflow:hidden;
}
.book-context-panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--saffron-dk),var(--saffron),var(--rust));
}

@keyframes barGrow{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.animated-bar{animation:barGrow .5s cubic-bezier(.4,0,.2,1) both}
@keyframes drawLine{from{stroke-dashoffset:var(--len,1000)}to{stroke-dashoffset:0}}
.animated-line{stroke-dasharray:var(--len,1000);animation:drawLine 1.1s cubic-bezier(.4,0,.2,1) both}
@keyframes coinFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.coin-icon,.coin-ico{filter:drop-shadow(0 2px 4px rgba(180,130,30,.55)) drop-shadow(0 0 14px rgba(245,200,66,.45)) drop-shadow(0 -1px 0 rgba(120,80,10,.4))}
@keyframes pulseGlow{0%,100%{filter:drop-shadow(0 0 8px rgba(245,200,66,.4))}50%{filter:drop-shadow(0 0 16px rgba(245,200,66,.6))}}

.live-ago{color:var(--muted)}

  display:flex;align-items:center;gap:6px;padding:6px 9px;

.cal-video-slot:hover{border-color:var(--saffron);transform:translateX(2px);box-shadow:var(--sh)}

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx-wOmsuWKH672EKFiQtvZ1wXrgsgqJu-E-kngb9fx0p9K8BLn0ubkUXXGlrcaPCJeF/exec';

/* Bump this whenever the portal HTML changes. Shown in the topbar so anyone
   can confirm at a glance which version is actually being served — the

try{

const COINS_PER_KES         = 100;   
const COINS_PER_CLAIM       = 500;

const POMODORO_WORK_SEC  = 25*60;

const REDEEM_TIERS = [

];

const LEVELS = [

  {name:'Caption Crafter',min:150000},{name:'Cut Specialist',min:200000},{name:'Publishing Partner',min:250000},
  {name:'Audience Builder',min:300000},{name:'Review Navigator',min:350000},{name:'Campaign Keeper',min:400000},
  {name:'Momentum Maker',min:450000},{name:'Shelf Professional',min:500000},{name:'Growth Editor',min:550000},
  {name:'Launch Strategist',min:600000},{name:'Community Builder',min:650000},{name:'Reader Advocate',min:700000},
  {name:'Campaign Lead',min:750000},{name:'Shelf Champion',min:800000},{name:'Portfolio Builder',min:850000},
  {name:'Review Architect',min:900000},{name:'Publishing Vanguard',min:950000},{name:'Shelf Legend',min:1000000},
];

const STEP_LABELS = {
  'Hook Written':'Hook Written','Script Approved':'Script Approved','Seed Images Created':'Seed Images Created',
  'B-Roll Sourced':'B-Roll Sourced','First Draft Complete':'First Draft Complete','Client Review Sent':'Client Review Sent',
  'Client Approved':'Client Approved','Captions Added':'Captions Added','Hashtags Added':'Hashtags & Hooks Set',
  'Thumbnail Created':'Thumbnail Created','Posted TikTok':'Posted to TikTok','Posted YouTube':'Posted to YouTube',
  'Analytics Logged':'Analytics Logged','New Followers Added':'New Followers Added',

};

  'First Draft Complete','Client Review Sent','Client Approved','Captions Added','Hashtags Added',
  'Thumbnail Created','Posted TikTok','Posted YouTube','Analytics Logged','New Followers Added'];
const BUCKET_ORDER = ['Pre-Production','Production','Publishing','Following/Engagement','Analytics','Other'];

const TIME_WINDOWS_ = [
  {label:'3h',ms:3*3600000},{label:'12h',ms:12*3600000},{label:'24h',ms:24*3600000},
  {label:'3d',ms:72*3600000},{label:'1wk',ms:7*86400000},{label:'30d',ms:30*86400000},
];
const TOTAL_CAMPAIGN_WEEKS = 20;
const DOW_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g, '&#39;');
const jsArg = s => esc(JSON.stringify(String(s == null ? '' : s)));
function safeUrl_(value){
  const url=String(value||'').trim();
  return /^https?:\/\//i.test(url)?esc(url):'';
}
function fmtKes(n){ return 'KES '+ Math.round(n||0).toLocaleString(); }
function fmtCoins(n){ return (Math.round(n)||0).toLocaleString()+' 🪙'; }
function monthKeyFromDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function getParams(){ const p=new URLSearchParams(window.location.search); return{editor:(p.get('editor')||'').trim()}; }
function localDayStart_(ts){const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();}
function localWeekStart_(ts){const d=new Date(ts);d.setHours(0,0,0,0);const dow=d.getDay();d.setDate(d.getDate()-dow);return d.getTime();}
function localMonthStart_(ts){const d=new Date(ts);d.setHours(0,0,0,0);d.setDate(1);return d.getTime();}

let RAW_DATA=null, EDITOR_NAME='', SESSION_TOKEN='', _pollInterval=null;
let LAST_PORTAL_REFRESH_AT=0, PORTAL_REFRESH_IN_FLIGHT=false;
let ACTIVE_TAB='home';
let BOOK_CONTEXT_ID=null;
let OPEN_AUTHOR_FILTER='';
let OPEN_BOOK_FILTER='';
let OPEN_WEEK_FILTER='';
let SELECTED_TASKS=new Set(), TASK_INDEX={};
let SELECTED_COMPLETE=new Set(), MY_TASK_INDEX={};
let TODAY_CHART_DATA={}, BOOK_PROGRESS_DATA={};

let CAL_CURRENT_CAMPAIGN_WEEK = 1; // target week shown in the grid
let CAL_SOURCE_WEEK = 1;           // WeeklyContent week the slots draw videos from
let CAL_FILL_DAYS = 3;             // days-ahead count used by the Fill buttons (1-7)
let CAL_WINDOW_START_DATE = '';    // rolling, future-only scheduler window
let CAL_WIZ_OPEN = false;          // Album Scheduler wizard visibility
let CAL_WIZ_VIDEOS = 0;            // video count entered in the Album Scheduler
let CAL_CONTENT_VOS = [];
let CAL_CONTENT_TIKTOK = [];
let CAL_CONTENT_PANEL_OPEN = false;
let CAL_CONTENT_YOUTUBE = [];
let CAL_AUTOSAVE_TIMER = null;
let CAL_AUTOSAVE_PENDING = new Set();
let CAL_AUTOSAVE_ACTIVE = null;
let CAL_SCHEDULE_STATUS = 'Auto-save is on';
let WORKFLOW_WEEK = 'current';
let WORKFLOW_HIDE_DONE = false;

function getWeeklyContentForBook_(bookId, weekNum) {
  if(!RAW_DATA || !RAW_DATA.weeklyContent || !RAW_DATA.weeklyContent[bookId]) return [];
  return RAW_DATA.weeklyContent[bookId][String(weekNum)] || [];
}

function syncCalContentFromBackend_() {
  if(!CAL_SELECTED_BOOK) return;
  const wc = getWeeklyContentForBook_(CAL_SELECTED_BOOK, CAL_SOURCE_WEEK);
  if(wc.length > 0) {
    CAL_CONTENT_VOS = wc.map(v => v.voiceover || '');
    CAL_CONTENT_TIKTOK = wc.map(v => v.description || '');
    CAL_CONTENT_YOUTUBE = wc.map(v => v.description || '');
  } else {
    // Clear local arrays if switching to a week that has no saved content yet
    CAL_CONTENT_VOS = [];
    CAL_CONTENT_TIKTOK = [];
    CAL_CONTENT_YOUTUBE = [];
  }
}
function fetchFromBridge(){
  return new Promise((resolve,reject)=>{
    const cb='epCb_'+Date.now();
    const script=document.createElement('script');
    const auth=SESSION_TOKEN?'&token='+encodeURIComponent(SESSION_TOKEN)+'&editor='+encodeURIComponent(EDITOR_NAME):'';
    script.src=APPS_SCRIPT_URL+'?callback='+cb+'&t='+Date.now()+auth;
    let done=false;
    window[cb]=(data)=>{
      if(done)return;done=true;
      delete window[cb];
      if(script.parentNode)script.parentNode.removeChild(script);
      resolve(data);
    };
    script.onerror=()=>{
      if(done)return;done=true;
      delete window[cb];
      if(script.parentNode)script.parentNode.removeChild(script);
      reject(new Error('Apps Script request failed'));
    };
    document.head.appendChild(script);
  });
}
async function postAction(body, opts){
  const payload = JSON.stringify({...body, token: body.action==='login'?undefined:SESSION_TOKEN, editor: body.editor||EDITOR_NAME});

  try{
    const r = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: payload, redirect: 'follow' });
    const text = await r.text();
    let data;
    try{ data = JSON.parse(text); }
    catch(_){ throw new Error('non-JSON'); }
    /* Auto-logout on auth errors assumes the session is stale. That's wrong for
       NEW actions hitting an OLDER deployment: the backend's editor allowlist
       doesn't know the action, so it answers 'auth' — and logging out makes the
       new button look "not implemented". Callers behind the feature flag pass
       {noAuthLogout:true} and handle the response themselves. */
    if(data && data.error==='auth' && !(opts && opts.noAuthLogout)) logoutEditor();
    return data;
  }catch(err){
    console.warn('POST failed:', err.message || err);
    throw new Error(err && err.message === 'non-JSON'
      ? 'The server returned an invalid response.'
      : 'Could not reach the server. Serve this portal through Apps Script HTMLService or a same-origin proxy if cross-origin requests are blocked.');
  }
}

const EDITOR_LOGIN_KEY='atomicShelfEditorLogin';
function getSavedLogin_(){try{const r=localStorage.getItem(EDITOR_LOGIN_KEY);if(!r)return null;const p=JSON.parse(r);return p&&p.editorName&&p.token?p:null;}catch(_){return null;}}
function saveLogin_(n,token){try{localStorage.setItem(EDITOR_LOGIN_KEY,JSON.stringify({editorName:n,token,ts:Date.now()}));}catch(_){}}
function logoutEditor(){try{localStorage.removeItem(EDITOR_LOGIN_KEY);}catch(_){}SESSION_TOKEN='';location.reload();}

function bookById_(bid){return(RAW_DATA.books||[]).find(b=>b.id===bid)||null;}
function activeBooks_(){return(RAW_DATA.books||[]).filter(b=>!b.isArchived);}

  return activeBooks_().filter(b=>String((b.account||{}).editorName||'').trim().toLowerCase()===editorKey);
}
function isPaidBook_(b){
  if(!b)return false;
  if(parseFloat(b.retainer)>0)return true;
  return /paid|active/i.test(String(b.paymentStatus||'')) && !/unpaid|not paid|pending/i.test(String(b.paymentStatus||''));
}
function taskPriority_(t){
  const b=bookById_(t.bookId);
  const paid=isPaidBook_(b)?1:0;
  const curWeek=b?(b.currentWeek||1):1;
  const behind=Math.max(0,curWeek-(t.weekNum||curWeek));
  const active=b&&/active/i.test(String(b.campaignStatus||''))?1:0;
  return{paid,urgency:behind*2+active,behind};
}
function myTasks_(){
  return(RAW_DATA.taskBoard||[]).filter(t=>(t.claimedBy||'').toLowerCase()===EDITOR_NAME.toLowerCase()&&(t.status==='locked'||t.status==='soft_claimed'));
}
function openTasks_(){
  return(RAW_DATA.taskBoard||[])
    .filter(t=>t.status==='open'||(t.status==='soft_claimed'&&(t.claimedBy||'').toLowerCase()!==EDITOR_NAME.toLowerCase()))
    .sort((a,z)=>{
      const pa=taskPriority_(a),pz=taskPriority_(z);
      if(pz.paid!==pa.paid)return pz.paid-pa.paid;
      if(pz.urgency!==pa.urgency)return pz.urgency-pa.urgency;
      return(a.weekNum||0)-(z.weekNum||0);
    });
}

function isToday_(ts){if(!ts)return false;const d=new Date(ts),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();}
function minutesInLogs_(logs){return logs.reduce((s,e)=>{if(e.type!=='time_log')return s;const m=/^(\d+)m logged/.exec(e.label||'');return s+(m?parseInt(m[1],10):0);},0);}
/* Registered minutes come from the TimeTracking sheet (RAW_DATA.timeSessions) —
   the same rows payroll reads — not from activity-log label parsing. Conflict
   rule mirrors the backend payroll: per book+day, pomodoro minutes are
   authoritative and manual entries for that bucket are ignored. Returns null
   when the backend hasn't been redeployed with timeSessions yet, so callers
   can fall back to the legacy activity-log estimate. */
function myRegisteredMinutes_(tsFilter){
  const sessions=RAW_DATA.timeSessions;
  if(!sessions)return null;
  const isPomo_=s=>String(s.type||'').trim().toLowerCase()==='pomodoro'||String(s.notes||'').trim().toLowerCase().indexOf('pomodoro')===0;
  const buckets={};
  sessions.forEach(s=>{
    if((s.editor||'').toLowerCase()!==EDITOR_NAME.toLowerCase())return;
    const t=s.ts?new Date(s.ts).getTime():0;
    if(tsFilter&&!tsFilter(t,s))return;
    const d=new Date(t);
    const dayKey=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    const k=(s.bookId||'_')+'|'+dayKey;
    if(!buckets[k])buckets[k]={pomo:0,manual:0};
    if(isPomo_(s))buckets[k].pomo+=(parseFloat(s.durationMin)||0);
    else buckets[k].manual+=(parseFloat(s.durationMin)||0);
  });
  let total=0;
  Object.keys(buckets).forEach(k=>{const b=buckets[k];total+=b.pomo>0?b.pomo:b.manual;});
  return Math.round(total);
}
function myMinutesOr_(tsFilter,legacyMinutes){
  const m=myRegisteredMinutes_(tsFilter);
  return m===null?legacyMinutes:m;
}

}

function localDateStr_(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function getTodaySunday_(){
  const d = new Date();
  d.setHours(0,0,0,0);
  const dow = d.getDay();
  d.setDate(d.getDate() - dow);
  return d.getTime();
}
function isPastDate_(dateStr){
  const today = new Date();
  today.setHours(0,0,0,0);
  const d = new Date(dateStr + 'T00:00:00');
  return d.getTime() < today.getTime();
}
function isDateToday_(dateStr){
  const today = new Date();
  today.setHours(0,0,0,0);
  const d = new Date(dateStr + 'T00:00:00');
  return d.getTime() === today.getTime();
}

/* CampaignWeeks grows on demand in the backend, so the editor must not cap
   its album/source picker at the original 20-week campaign template. Keep the
   familiar contiguous list, but extend it through the highest actual week in
   the book's weeks, imported content, inventory, or saved appointments. */
function calendarSourceWeekNumbers_(bookId){
  const nums = new Set([TOTAL_CAMPAIGN_WEEKS, getBookCurrentWeek_(bookId)]);
  const book = bookById_(bookId) || {};
  (book.weeks || []).forEach(w => nums.add(parseInt(w.weekNum, 10) || 0));
  const av = getBookAvail_(bookId);
  Object.keys((av && av.perWeek) || {}).forEach(w => nums.add(parseInt(w, 10) || 0));
  Object.keys(getWeeklyContentForBook_(bookId, 0) && {}).forEach(() => {}); // preserve safe map access in older payloads
  const contentWeeks = RAW_DATA && RAW_DATA.weeklyContent && RAW_DATA.weeklyContent[bookId];
  Object.keys(contentWeeks || {}).forEach(w => nums.add(parseInt(w, 10) || 0));
  Object.keys((RAW_DATA && RAW_DATA.videoSchedules) || {}).forEach(dateStr => {
    const row = RAW_DATA.videoSchedules[dateStr] && RAW_DATA.videoSchedules[dateStr][bookId];
    if(row) nums.add(parseInt(row.sw, 10) || 0);
  });
  if(bookId === CAL_SELECTED_BOOK) nums.add(parseInt(CAL_SOURCE_WEEK, 10) || 0);
  const highest = Math.max(TOTAL_CAMPAIGN_WEEKS, ...[...nums].filter(n => n >= 1 && n <= 520));
  return Array.from({length:highest}, (_, i) => i + 1);
}
function calendarWeekCount_(bookId){ return calendarSourceWeekNumbers_(bookId).length; }

/* FIX: Calendar week start logic now strictly matches the backend Command Centre's exact dates.
   Calculates the week start date based on the exact Campaign Live Date, not forcing Monday alignment.
*/

function getCampaignWeekStart_(bookId, campaignWeek) {
  const b = bookById_(bookId);
  if (!b || !b.campaignLiveDate) {
    const bookWeek = b ? (b.currentWeek || 1) : 1;
    const todaySun = getTodaySunday_();
    return todaySun + (campaignWeek - bookWeek) * 7 * 86400000;
  }
  const liveDate = new Date(b.campaignLiveDate);
  if (isNaN(liveDate.getTime())) return Date.now();
  const d = new Date(liveDate);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + (campaignWeek - 1) * 7);
  return d.getTime();
}

async function onSourceWeekChange(week){
  week = parseInt(week, 10);
  if(!calendarSourceWeekNumbers_(CAL_SELECTED_BOOK).includes(week)) return;
  if(CAL_WEEK_DIRTY && CAL_SELECTED_BOOK && !(await saveCurrentWeek_())){
    renderCalendarPanel_();
    return;
  }
  CAL_SOURCE_WEEK = week;
  syncCalContentFromBackend_(); // <-- Load text from backend database when week changes
  renderCalendarPanel_();
}

/* 6 daily slots: tt1-3 = TikTok (V1-V3), yt1-3 = YouTube Shorts (V4-V6).
   RAW_DATA.videoSchedules holds the backend shape { v1..v6, sw, publishedTikTok,
   publishedYouTube } per
   date+book; this maps it to slot keys for the UI. */
const SLOT_KEYS = ['tt1','tt2','tt3','yt1','yt2','yt3'];
const SLOT_PLATFORM = { tt1:'tiktok', tt2:'tiktok', tt3:'tiktok', yt1:'youtube', yt2:'youtube', yt3:'youtube' };
const SLOT_LABELS = { tt1:'TikTok 1', tt2:'TikTok 2', tt3:'TikTok 3', yt1:'YT Short 1', yt2:'YT Short 2', yt3:'YT Short 3' };
function emptyDaySlots_(){ return { tt1:false, tt2:false, tt3:false, yt1:false, yt2:false, yt3:false, sw:0, publishedTikTok:0, publishedYouTube:0 }; }

let _videoSchedulesCache = null;
let _videoSchedulesRawRef = null;
function dateFromLocalDateStr_(dateStr){ return new Date(String(dateStr).slice(0,10) + 'T00:00:00'); }
function todayDateStr_(){ return localDateStr_(new Date()); }
function addDaysToDateStr_(dateStr, days){ const d=dateFromLocalDateStr_(dateStr); d.setDate(d.getDate()+days); return localDateStr_(d); }
function bookHasOpenScheduleSlot_(bookId, dateStr){
  const slots = getBookDaySlots(dateStr, bookId);
  return SLOT_KEYS.some(key => !slots[key]);
}
/* Find the first upcoming date that still has space for this book. This keeps
   the scheduling grid from reopening an expired campaign week. */
function nextOpenScheduleDate_(bookId, fromDateStr){
  let dateStr = fromDateStr && fromDateStr >= todayDateStr_() ? fromDateStr : todayDateStr_();
  for(let i=0; i<366; i++){
    if(bookHasOpenScheduleSlot_(bookId, dateStr)) return dateStr;
    dateStr = addDaysToDateStr_(dateStr, 1);
  }
  return todayDateStr_();
}
function calendarWindowStartDate_(){
  if(!CAL_SELECTED_BOOK){
    if(!CAL_WINDOW_START_DATE || CAL_WINDOW_START_DATE < todayDateStr_()) CAL_WINDOW_START_DATE = todayDateStr_();
    return CAL_WINDOW_START_DATE;
  }
  if(!CAL_WINDOW_START_DATE || CAL_WINDOW_START_DATE < todayDateStr_()){
    CAL_WINDOW_START_DATE = todayDateStr_();
  }
  return CAL_WINDOW_START_DATE;
}
async function shiftCampaignWeek(delta){
  if(CAL_WEEK_DIRTY && CAL_SELECTED_BOOK){
    showToast('⏳ Saving before navigating...');
    const saved = await saveCurrentWeek_();
    if(!saved){ showToast('⚠ Stay on this week until the changes are saved'); return; }
  }
  const currentStart = calendarWindowStartDate_();
  CAL_WINDOW_START_DATE = addDaysToDateStr_(currentStart, delta * 7);
  if(CAL_WINDOW_START_DATE < todayDateStr_()) CAL_WINDOW_START_DATE = todayDateStr_();
  CAL_CURRENT_CAMPAIGN_WEEK = Math.max(1, Math.min(20, CAL_CURRENT_CAMPAIGN_WEEK + delta));
  CAL_WEEK_TOUCHED = true;
  CAL_WEEK_DIRTY = false;
  renderCalendarPanel_();
}

async function jumpToCurrentWeek(){

function latestScheduledDate_(bookId){

  return Object.keys(schedules).filter(dateStr => {

async function jumpToLatestSchedule_(){
  if(CAL_WEEK_DIRTY && CAL_SELECTED_BOOK && !(await saveCurrentWeek_())) return;
  const latest = CAL_SELECTED_BOOK ? latestScheduledDate_(CAL_SELECTED_BOOK) : '';
  CAL_WINDOW_START_DATE = latest || todayDateStr_();

  CAL_WEEK_DIRTY = false;

function getVideoSchedulesFromRaw_(){
  const map = RAW_DATA && RAW_DATA.videoSchedules ? RAW_DATA.videoSchedules : null;
  // If the raw data hasn't changed, return the cached parsed version to prevent lag
  if(_videoSchedulesRawRef === map && _videoSchedulesCache) return _videoSchedulesCache;
  _videoSchedulesRawRef = map;
  
  const out = {};
  if(map) {
    Object.keys(map).forEach(dateStr => {
      out[dateStr] = {};
      const dayMap = map[dateStr] || {};
      Object.keys(dayMap).forEach(bookId => {
        const s = dayMap[bookId];
        if(s && typeof s === 'object'){
          out[dateStr][bookId] = {
            tt1: !!s.v1, tt2: !!s.v2, tt3: !!s.v3,
            yt1: !!s.v4, yt2: !!s.v5, yt3: !!s.v6,
            sw: parseInt(s.sw, 10) || 0,
            publishedTikTok: parseInt(s.publishedTikTok, 10) || 0,
            publishedYouTube: parseInt(s.publishedYouTube, 10) || 0,
            editor: String(s.editor || ''),
            updatedAt: s.updatedAt || ''
          };
        }
      });
    });
  }
  _videoSchedulesCache = out;
  return out;
}
function getDayData(dateStr){
  const backend = getVideoSchedulesFromRaw_();
  return backend[dateStr] || {};
}

/* ══ INTELLIGENT CALENDAR — pool awareness (PRD_intelligent_calendar.md) ══
   RAW_DATA.videoAvailability comes from the backend read payload:
   { bookId: { poolTotal, consumedDone, reservedScheduled, available,
               availableTikTok, availableYouTube, perWeek } }
   The same video cross-posts to TikTok AND YouTube, so each platform draws
   slots from the same pool independently. Books with no imported inventory
   (poolTotal === 0) are exempt — legacy behaviour, with an empty-state notice. */
/* Availability is tracked per platform AND per source week — spending Week 19
   leftovers never touches Week 21's own inventory. Books with no imported
   inventory (poolTotal === 0) are exempt — legacy behaviour. */
function getBookAvail_(bookId){
  return (RAW_DATA && RAW_DATA.videoAvailability ? RAW_DATA.videoAvailability[bookId] : null) || null;
}
function hasInventory_(bookId){
  const a = getBookAvail_(bookId);
  return !!(a && a.poolTotal > 0);
}
function sourceWeekAvail_(bookId, weekNum){
  const a = getBookAvail_(bookId);
  if(!a || !a.perWeek) return null;
  return a.perWeek[String(weekNum)] || null;
}
function platformAvail_(bookId, platform, weekNum){
  const a = getBookAvail_(bookId);
  if(!a || a.poolTotal === 0) return Infinity;
  const pw = sourceWeekAvail_(bookId, weekNum);
  if(!pw) return 0;
  return platform === 'tiktok' ? (pw.availableTikTok || 0) : (pw.availableYouTube || 0);
}
function adjustLocalAvail_(bookId, platform, weekNum, delta){
  const a = getBookAvail_(bookId);
  if(!a || a.poolTotal === 0) return;
  const key = platform === 'tiktok' ? 'availableTikTok' : 'availableYouTube';
  const pw = sourceWeekAvail_(bookId, weekNum);
  if(pw){
    pw[key] = Math.max(0, (pw[key] || 0) + delta);
    pw.available = Math.min(pw.availableTikTok || 0, pw.availableYouTube || 0);
  }
  a[key] = Math.max(0, (a[key] || 0) + delta);
  a.available = Math.min(a.availableTikTok || 0, a.availableYouTube || 0);
}
function getBookDaySlots(dateStr, bookId){
  const dayData = getDayData(dateStr);
  return dayData[bookId] || emptyDaySlots_();
}
function setVideoSlot(dateStr, bookId, slotKey, value){
  if(isPastDate_(dateStr)){ showToast('⚠ Cannot edit past dates'); return false; }
  const platform = SLOT_PLATFORM[slotKey];
  if(!RAW_DATA.videoSchedules) RAW_DATA.videoSchedules = {};
  const raw = RAW_DATA.videoSchedules;
  const existingRow = raw[dateStr] && raw[dateStr][bookId];
  // Keep an existing date tied to its original inventory week. Topping up a
  // partially scheduled day must not silently move its older slots to the
  // currently selected source week.
  const sw = (existingRow && parseInt(existingRow.sw, 10)) || CAL_SOURCE_WEEK;
  if(value && hasInventory_(bookId) && platformAvail_(bookId, platform, sw) <= 0){
    showToast('⚠ Week ' + sw + ' has no ' + (platform === 'tiktok' ? 'TikTok' : 'YouTube') + ' videos left');
    return false;
  }
  if(!raw[dateStr]) raw[dateStr] = {};
  if(!raw[dateStr][bookId]) raw[dateStr][bookId] = { v1:false, v2:false, v3:false, v4:false, v5:false, v6:false, sw:sw };
  const row = raw[dateStr][bookId];
  const vKey = 'v' + (SLOT_KEYS.indexOf(slotKey) + 1);
  if(!!row[vKey] === value) return true;
  row[vKey] = value;
  if(sw) row.sw = sw;
  const hasAny = SLOT_KEYS.some((k, i) => !!row['v' + (i + 1)]);
  if(!hasAny){
    delete raw[dateStr][bookId];
    if(Object.keys(raw[dateStr]).length === 0) delete raw[dateStr];
  }
  // The display cache keys by the raw object reference, while a slot edit
  // intentionally mutates that object in place. Invalidate it so the clicked
  // appointment is immediately reflected in both Calendar and Schedule.
  _videoSchedulesRawRef = null;
  _videoSchedulesCache = null;
  adjustLocalAvail_(bookId, platform, sw, value ? -1 : 1);
  CAL_WEEK_DIRTY = true; // queued for an automatic, batched server save
  return true;
}
function toggleVideoSlot(dateStr, bookId, slotKey){
  if(isPastDate_(dateStr)){ showToast('⚠ Cannot edit past dates'); return; }
  const current = getBookDaySlots(dateStr, bookId);
  const ok = setVideoSlot(dateStr, bookId, slotKey, !current[slotKey]);
  if(ok){
    queueCalendarSave_(dateStr);
    renderCalendarPanel_();
  }
}
/* Persist the whole viewed week in ONE POST. The old per-day sync fired 7
   concurrent requests that raced each other's availability reads and row
   writes on the server — that's why weeks didn't persist. All 7 day rows
   (including their per-day source weeks) commit or fail together. */
/* One day-row snapshot from the local schedule state (source week defaults to
   the picker selection). Shared by the week save and the Album Scheduler. */
function videoDayRow_(dateStr, bookId){
  bookId = bookId || CAL_SELECTED_BOOK;
  const raw = RAW_DATA.videoSchedules || {};
  const row = raw[dateStr] ? raw[dateStr][bookId] : null;
  return {
    dateStr: dateStr,
    v1: !!(row && row.v1), v2: !!(row && row.v2), v3: !!(row && row.v3),
    v4: !!(row && row.v4), v5: !!(row && row.v5), v6: !!(row && row.v6),
    sourceWeek: row && row.sw ? row.sw : CAL_SOURCE_WEEK
  };
}
function applyScheduleSaveAck_(bookId, days, savedAt){
  const raw = RAW_DATA && RAW_DATA.videoSchedules;
  if(!raw) return;
  days.forEach(day => {
    const row = raw[day.dateStr] && raw[day.dateStr][bookId];
    if(row){
      row.editor = EDITOR_NAME;
      row.updatedAt = savedAt || new Date().toISOString();
    }
  });
  _videoSchedulesRawRef = null;
  _videoSchedulesCache = null;
}
function renderCalendarSaveStatus_(){
  const el = document.getElementById('calendar-save-status');
  const saving = !!CAL_AUTOSAVE_ACTIVE || !!CAL_AUTOSAVE_PENDING.size;
  if(el){
    el.textContent = saving ? 'Saving changes…' : CAL_SCHEDULE_STATUS;
    el.style.color = saving ? 'var(--saffron-dk)' : (CAL_WEEK_DIRTY ? 'var(--rust-d)' : 'var(--moss-d)');
  }
  const sync = document.getElementById('calendar-sync-button');
  if(sync) sync.textContent = CAL_WEEK_DIRTY ? '↻ Retry / Sync Week ●' : '↻ Sync Week';
}
function queueCalendarSave_(dateStr){
  if(!dateStr || !CAL_SELECTED_BOOK) return;
  CAL_AUTOSAVE_PENDING.add(dateStr);
  CAL_WEEK_DIRTY = true;
  CAL_SCHEDULE_STATUS = 'Changes waiting to save';
  if(CAL_AUTOSAVE_TIMER) clearTimeout(CAL_AUTOSAVE_TIMER);
  CAL_AUTOSAVE_TIMER = setTimeout(() => { flushCalendarAutosave_(); }, 300);
}
async function flushCalendarAutosave_(){
  if(CAL_AUTOSAVE_TIMER){ clearTimeout(CAL_AUTOSAVE_TIMER); CAL_AUTOSAVE_TIMER = null; }
  if(CAL_AUTOSAVE_ACTIVE) return CAL_AUTOSAVE_ACTIVE;
  if(!CAL_AUTOSAVE_PENDING.size || !CAL_SELECTED_BOOK){ renderCalendarSaveStatus_(); return true; }

  const bookId = CAL_SELECTED_BOOK;
  const dates = [...CAL_AUTOSAVE_PENDING];
  CAL_AUTOSAVE_PENDING.clear();
  const days = dates.map(dateStr => videoDayRow_(dateStr, bookId));
  CAL_SCHEDULE_STATUS = 'Saving changes…';
  renderCalendarSaveStatus_();

  CAL_AUTOSAVE_ACTIVE = (async () => {
    try {
      let r = await postAction({ action:'saveVideoScheduleWeek', editor:EDITOR_NAME, bookId, days });
      // Older deployments do not have the batch endpoint. Retain the safe,
      // sequential fallback so auto-save still persists every appointment.
      if(r && r.error && String(r.error).indexOf('Unknown action') === 0){
        for(const day of days){
          const legacy = await postAction({
            action:'saveVideoSchedule', editor:EDITOR_NAME, bookId, dateStr:day.dateStr,
            v1:day.v1, v2:day.v2, v3:day.v3, v4:day.v4, v5:day.v5, v6:day.v6,
            sourceWeek:day.sourceWeek
          });
          if(!(legacy && (legacy.success || legacy.deleted || legacy.__opaque))){ r = legacy || { success:false, error:'legacy save failed' }; break; }
          r = { success:true, legacy:true };
        }
      }
      if(r && (r.success || r.__opaque) && !r.error){
        if(r.success) applyScheduleSaveAck_(bookId, days, r.savedAt);
        CAL_SCHEDULE_STATUS = r.__opaque ? 'Save sent — verifying…' : '✓ All changes saved to Schedule';
        CAL_WEEK_DIRTY = CAL_AUTOSAVE_PENDING.size > 0;
        if(r.__opaque){
          setTimeout(() => { if(!CAL_AUTOSAVE_PENDING.size) refreshAndRender(true); }, 1800);
        }
        return true;
      }
      dates.forEach(dateStr => CAL_AUTOSAVE_PENDING.add(dateStr));
      CAL_WEEK_DIRTY = true;
      CAL_SCHEDULE_STATUS = 'Save failed — retry required';
      showToast('⚠ Could not save the calendar change: ' + ((r && r.error) || 'unknown error'));
      return false;
    } catch(e) {
      console.error('Calendar auto-save failed:', e);
      dates.forEach(dateStr => CAL_AUTOSAVE_PENDING.add(dateStr));
      CAL_WEEK_DIRTY = true;
      CAL_SCHEDULE_STATUS = 'Save failed — retry required';
      showToast('⚠ Could not save the calendar change — check your connection');
      return false;
    } finally {
      CAL_AUTOSAVE_ACTIVE = null;
      renderCalendarSaveStatus_();
      if(CAL_AUTOSAVE_PENDING.size && CAL_SCHEDULE_STATUS.indexOf('failed') === -1){
        flushCalendarAutosave_();
      }
    }
  })();
  return CAL_AUTOSAVE_ACTIVE;
}
async function flushAllCalendarAutosaves_(){
  while(CAL_AUTOSAVE_ACTIVE || CAL_AUTOSAVE_PENDING.size){
    const saved = await flushCalendarAutosave_();

  }
  return true;

/* Shared persist engine: sends a set of day rows as ONE bulk POST (validated
   as a unit under a script lock on the server), with the sequential per-day
   fallback for backends that predate the bulk action and friendly
   pool-exhaustion errors. Used by Save Week AND the Album Scheduler — whose
   suggested dates can span campaign-week boundaries, which the backend's
   arbitrary date list accepts fine. */
async function postSaveVideoDays_(days, okMsg, pendingMsg, legacyMsg){
  try{
    const r = await postAction({
      action: 'saveVideoScheduleWeek',
      editor: EDITOR_NAME,
      bookId: CAL_SELECTED_BOOK,
      days: days
    });
    if(r && r.success){
      CAL_WEEK_DIRTY = false;
      await refreshAndRender(true);
      showToast(okMsg(r));
      return true;
    }
    if(r && r.__opaque){
      CAL_WEEK_DIRTY = false;
      showToast(pendingMsg);
      // no-cors hides the save response, so verify the server state now
      // instead of letting the next background poll discard an unsaved week.
      await new Promise(res => setTimeout(res, 2000));
      await refreshAndRender(true);
      return true;
    }
    // Backend predates the bulk action — persist day-by-day instead. Saves are
    // AWAITED one at a time (never fired together), so the old backend's
    // per-day writer can't race itself and drop days.
    if(r && r.error && String(r.error).indexOf('Unknown action') === 0){
      console.warn('Backend lacks saveVideoScheduleWeek — falling back to sequential per-day saves. Redeploy Code.txt to pick up the bulk action.');
      showToast('⏳ Legacy backend — saving day by day…');
      let savedDays = 0, failedDay = '';
      for(const day of days){
        try{
          const dr = await postAction({
            action: 'saveVideoSchedule',
            editor: EDITOR_NAME,
            dateStr: day.dateStr,
            bookId: CAL_SELECTED_BOOK,
            v1: day.v1, v2: day.v2, v3: day.v3,
            v4: day.v4, v5: day.v5, v6: day.v6,
            sourceWeek: day.sourceWeek
          });
          if(dr && (dr.success || dr.deleted || dr.__opaque)) savedDays++;
          else { failedDay = day.dateStr + ': ' + ((dr && dr.error) || 'unknown'); break; }
        }catch(_){ failedDay = day.dateStr + ': network'; break; }
      }
      if(!failedDay){
        CAL_WEEK_DIRTY = false;
        await refreshAndRender(true);
        showToast(legacyMsg(savedDays));
        return true;
      }
      showToast('⚠ Save stopped at ' + failedDay + ' — try again');
      return false;
    }
    const friendly = r && r.error === 'pool_exhausted_tiktok'
      ? 'Week ' + (r.sourceWeek || '?') + ' TikTok pool exhausted (' + (r.availableTikTok || 0) + ' left' + (r.dateStr ? ' at ' + r.dateStr : '') + ')'
      : r && r.error === 'pool_exhausted_youtube'
        ? 'Week ' + (r.sourceWeek || '?') + ' YouTube pool exhausted (' + (r.availableYouTube || 0) + ' left' + (r.dateStr ? ' at ' + r.dateStr : '') + ')'
        : ((r && r.error) || 'unknown');
    showToast('⚠ Save failed: ' + friendly);
    return false;
  }catch(e){
    console.error('postSaveVideoDays_ error:', e);
    showToast('⚠ Save failed — check connection and try again');
    return false;
  }
}
async function saveCurrentWeek_(){
  if(!CAL_SELECTED_BOOK){ showToast('⚠ Select a book first'); return false; }
  // A manual sync must never race the automatic per-appointment save. Drain
  // the queued change first, then only send the full visible week if something
  // still needs recovery (for example, after a temporary connection failure).
  if(CAL_AUTOSAVE_ACTIVE || CAL_AUTOSAVE_PENDING.size){

async function updatePublishedCount(dateStr, bookId, platform, countStr) {
  const count = parseInt(countStr, 10);

  const scheduled = platform === 'tiktok' ? [slots.tt1, slots.tt2, slots.tt3].filter(Boolean).length : [slots.yt1, slots.yt2, slots.yt3].filter(Boolean).length;
  
  if (count > scheduled) {

    renderCalendarPanel_();
    return;
  }
  
  // Update local state immediately for instant UI feedback, but keep the old
  // value so a rejected write never leaves the calendar showing a fictitious
  // appointment status.
  if (!RAW_DATA.videoSchedules[dateStr]) RAW_DATA.videoSchedules[dateStr] = {};
  if (!RAW_DATA.videoSchedules[dateStr][bookId]) RAW_DATA.videoSchedules[dateStr][bookId] = { v1:false,v2:false,v3:false,v4:false,v5:false,v6:false, sw:CAL_SOURCE_WEEK };
  const row = RAW_DATA.videoSchedules[dateStr][bookId];
  const previous = platform === 'tiktok' ? (row.publishedTikTok || 0) : (row.publishedYouTube || 0);
  
  if (platform === 'tiktok') {
    row.publishedTikTok = count;
  } else {
    row.publishedYouTube = count;
  }
  _videoSchedulesRawRef = null;
  _videoSchedulesCache = null;
  
  showToast(count > 0 ? `⏳ Marking ${count} ${platform === 'tiktok' ? 'TikTok' : 'YouTube'} published...` : `⏳ Clearing ${platform === 'tiktok' ? 'TikTok' : 'YouTube'} published count...`);
  
  try {
    const r = await postAction({action:'markVideoSchedulePublished', editor:EDITOR_NAME, dateStr, bookId, platform, count});
    if (r && (r.success || r.__opaque)) {
      showToast(count > 0 ? `✅ ${count}/${scheduled} ${platform === 'tiktok' ? 'TikTok' : 'YouTube'} published` : `↩️ Published count cleared`);
      renderCalendarPanel_(); // Re-render to apply the green styles
    } else {
      if(platform === 'tiktok') row.publishedTikTok = previous;
      else row.publishedYouTube = previous;
      _videoSchedulesRawRef = null;
      _videoSchedulesCache = null;
      showToast('⚠ ' + (r?.error || 'Could not save published count'));
      renderCalendarPanel_();
    }
  } catch(e) {
    console.error('updatePublishedCount error:', e);
    if(platform === 'tiktok') row.publishedTikTok = previous;
    else row.publishedYouTube = previous;
    _videoSchedulesRawRef = null;
    _videoSchedulesCache = null;
    showToast('⚠ Network error — status unchanged');
    renderCalendarPanel_();
  }
}
async function autoScheduleWeek_() {
  if(!CAL_SELECTED_BOOK){ showToast('⚠ Select a book first'); return; }
  const av = getBookAvail_(CAL_SELECTED_BOOK);
  
  // If no inventory exists, default to a 5-day fill of both platforms
  if(!av || av.poolTotal === 0) {
    showToast('📭 No video inventory imported. Filling 5 days with 6 slots/day...');
    CAL_FILL_DAYS = 5;
    const fillSelect = document.querySelector('select[onchange="onFillDaysChange(this.value)"]');
    if(fillSelect) fillSelect.value = 5;
    document.querySelectorAll('[data-fill-btn]').forEach(b => {
      const base = b.getAttribute('data-fill-label');
      if(base) b.textContent = base + ' ×5d';
    });
    await fillDaysAhead_('both');
    return;
  }
  
  const available = av.available;
  if (available <= 0) {
    showToast('⚠ Week ' + CAL_SOURCE_WEEK + ' pool is dry. Select another week.');
    return;
  }
  
  // Calculate days needed (3 videos cross-post to 3 TT + 3 YT = 6 slots/day)
  const daysNeeded = Math.ceil(available / 3);
  const daysToFill = Math.min(7, daysNeeded);
  
  // Update the dropdown and button labels to reflect the auto-calculated days
  CAL_FILL_DAYS = daysToFill;
  const fillSelect = document.querySelector('select[onchange="onFillDaysChange(this.value)"]');
  if(fillSelect) fillSelect.value = daysToFill;
  document.querySelectorAll('[data-fill-btn]').forEach(b => {
    const base = b.getAttribute('data-fill-label');
    if(base) b.textContent = base + ' ×' + daysToFill + 'd';
  });

  showToast('⏳ Auto-scheduling ' + available + ' videos across ' + daysToFill + ' days...');
  await fillDaysAhead_('both'); // 'both' fills 3 TT + 3 YT per day
}

/* ══ PHASE 2: Content Parser & Clipboard ══ */
function parseContentBatch_(rawText) {
  if(!rawText) return [];
  // PDF extraction often introduces soft hyphens, hard spaces and page
  // footers. Normalising them here also improves ordinary pasted text.
  let cleanText = String(rawText).replace(/\r\n?/g, '\n').replace(/\u00ad/g, '').replace(/\u00a0/g, ' ')
    .replace(/(\w)-\n\s*(\w)/g, '$1$2')
    .replace(/^\s*(?:page\s+)?\d+\s*(?:of\s+\d+)?\s*$/gim, '')
    .replace(/^(Week\s*\d+.*|YouTube\s+(?:Titles|Descriptions?).*|TikTok\s+(?:Titles|Descriptions?).*|VOICEOVERS?|SCRIPTS?|BATCH\s*\d+.*)$/gim, '')
    .trim();
  
  // Numbered PDF sections can be written as “Script 1:”, “Video 1 —”, or
  // simply “1.”. All variants become one video entry.
  let parts = cleanText.split(/^\s*(?:(?:video|script|voiceover|description|caption)\s*)?\d{1,3}\s*(?:[\.\):\-–—]|\s)\s*|^\s*[-*•]\s*/gim);
  
  // If the text was unstructured (like a PDF with no numbers/bullets), the split fails and returns 1 giant block.
  // In that case, fall back to splitting by double newlines (paragraph breaks).
  if(parts.length <= 1) {
    parts = cleanText.split(/\n\s*\n/);
  }
  
  return parts.map(p => {
    // Extra safety: strip any lingering numbers or bullets if they got caught in the text
    return p.replace(/^(?:\d+[\.\)]?|[-*•])\s*/, '').trim();
  }).filter(p => p.length > 0);
}

/* Latest week that actually has spendable inventory for the book — the
   default source week, so the picker opens on real stock instead of Week 1.
   Availability already encodes platform-done weeks, no extra filter needed. */
function latestStockedWeek_(bookId){
  const a = getBookAvail_(bookId);
  if(!a || !a.perWeek) return 0;
  const weeks = Object.keys(a.perWeek).map(Number)
    .filter(w => {
      const pw = a.perWeek[w];
      return ((pw.availableTikTok || 0) > 0 || (pw.availableYouTube || 0) > 0);
    })
    .sort((a2, b2) => b2 - a2);
  return weeks.length ? weeks[0] : 0;
}

/* Fill the NEXT N non-past days of the viewed week (N = CAL_FILL_DAYS, picked
   beside the buttons), scoped to a platform: 'tiktok' = the 3 daily TikTok
   slots, 'youtube' = the 3 YT Short slots, 'both' = all 6. Slots draw from the
   selected SOURCE week's pool and stop per platform when it runs dry. Placement
   is local; ONE bulk POST persists the week afterwards. */
/* Fill the NEXT N non-past days starting from TODAY, scoped to a platform:
   'tiktok' = the 3 daily TikTok slots, 'youtube' = the 3 YT Short slots, 
   'both' = all 6. Slots draw from the selected SOURCE week's pool and stop 
   per platform when it runs dry. Placement is local; ONE bulk POST persists 
   the week afterwards. This now spills over into future campaign weeks! */
async function fillDaysAhead_(platform){
  if(!CAL_SELECTED_BOOK){ showToast('⚠ Select a book first'); return; }
  const daysAhead = CAL_FILL_DAYS || 3;
  const keys = platform === 'tiktok'  ? ['tt1','tt2','tt3']
             : platform === 'youtube' ? ['yt1','yt2','yt3']
             : SLOT_KEYS;
  let placed = 0, filledDays = 0, scanned = 0;
  const changedDates = [];
  let dateStr = todayDateStr_();

  // Treat the schedule as a rolling silo: skip already-full days, top up
  // partially filled days, then continue into future dates until the requested
  // number of useful dates has been filled.
  while(filledDays < daysAhead && scanned < 366) {
    const slots = getBookDaySlots(dateStr, CAL_SELECTED_BOOK);
    const openKeys = keys.filter(slotKey => !slots[slotKey]);
    let placedToday = 0;
    openKeys.forEach(slotKey => {
      if(setVideoSlot(dateStr, CAL_SELECTED_BOOK, slotKey, true)) {
        placed++;
        placedToday++;
      }
    });
    if(placedToday){
      changedDates.push(dateStr);
      filledDays++;
    }
    const canStillFill = !hasInventory_(CAL_SELECTED_BOOK) || keys.some(slotKey =>
      platformAvail_(CAL_SELECTED_BOOK, SLOT_PLATFORM[slotKey], CAL_SOURCE_WEEK) > 0
    );
    if(!canStillFill) break;
    dateStr = addDaysToDateStr_(dateStr, 1);
    scanned++;
  }

  if(!placed){
    showToast('⚠ Week ' + CAL_SOURCE_WEEK + ' pool is dry for that platform — nothing left to place');
    return;
  }
  const platLabel = platform === 'tiktok' ? 'TikTok' : platform === 'youtube' ? 'YouTube' : 'TikTok + YouTube';
  showToast('📅 ' + platLabel + ' filled for the next ' + filledDays + ' day' + (filledDays > 1 ? 's' : ''));
  const saved = await postSaveVideoDays_(
    changedDates.map(date => videoDayRow_(date)),
    r => '✅ ' + platLabel + ' saved across ' + changedDates.length + ' date' + (changedDates.length > 1 ? 's' : '') + ' — ' + (r.slots || 0) + ' slots persisted',
    '⏳ Schedule sent — verifying…',
    savedDays => '✅ Schedule saved (' + savedDays + ' dates, legacy mode)'
  );
  if(saved){
    CAL_WINDOW_START_DATE = changedDates[0] || CAL_WINDOW_START_DATE;
    renderCalendarPanel_();
  }
}

let PDFJS_LOAD_PROMISE = null;
function loadPdfJs_(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(PDFJS_LOAD_PROMISE) return PDFJS_LOAD_PROMISE;
  PDFJS_LOAD_PROMISE = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    script.async = true;
    script.onload = () => {
      if(!window.pdfjsLib){ PDFJS_LOAD_PROMISE = null; return reject(new Error('PDF reader did not load')); }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve(window.pdfjsLib);
    };
    script.onerror = () => { PDFJS_LOAD_PROMISE = null; reject(new Error('Could not load the PDF reader')); };
    document.head.appendChild(script);
  });
  return PDFJS_LOAD_PROMISE;
}
function splitImportedContentSections_(text){
  const out = { vo:[], tt:[], yt:[] };
  let active = 'vo';
  String(text || '').split('\n').forEach(line => {
    const label = line.trim().toLowerCase().replace(/^#+\s*/, '');
    // Do not mistake “Script 1:” or “TikTok 1:” for a section heading.
    if(/^(?:all\s+)?(?:voice\s*overs?|scripts?|voiceover scripts?)\b/.test(label) && !/^(?:script|voiceover)\s+\d+\b/.test(label)){ active = 'vo'; return; }
    if(/^(?:all\s+)?(?:tiktok|tik\s*tok)(?:\s+(?:descriptions?|captions?|titles?))?\b/.test(label) && !/^(?:tiktok|tik\s*tok)\s+\d+\b/.test(label)){ active = 'tt'; return; }
    if(/^(?:all\s+)?(?:youtube|yt)(?:\s+(?:descriptions?|captions?|titles?))?\b/.test(label) && !/^(?:youtube|yt)\s+\d+\b/.test(label)){ active = 'yt'; return; }
    out[active].push(line);
  });
  return {
    vo: parseContentBatch_(out.vo.join('\n')),
    tt: parseContentBatch_(out.tt.join('\n')),
    yt: parseContentBatch_(out.yt.join('\n'))
  };
}
async function extractPdfText_(file){
  if(!file || file.type !== 'application/pdf') throw new Error('Choose a PDF file');
  if(file.size > 25 * 1024 * 1024) throw new Error('That PDF is larger than 25 MB');
  const pdfjs = await loadPdfJs_();
  const pdf = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for(let pageNo = 1; pageNo <= pdf.numPages; pageNo++){
    const page = await pdf.getPage(pageNo);
    const items = (await page.getTextContent()).items;
    const lines = [];
    let lastY = null, line = '';
    items.forEach(item => {
      const text = String(item.str || '').trim();
      if(!text) return;
      const y = item.transform ? Math.round(item.transform[5]) : null;
      if(lastY !== null && y !== null && Math.abs(y - lastY) > 3){
        if(line) lines.push(line.trim());
        line = text;
      }else line += (line ? ' ' : '') + text;
      lastY = y;
    });
    if(line) lines.push(line.trim());
    pages.push(lines.join('\n'));
  }
  return pages.join('\n\n');
}
async function importContentPdf_(input){
  const file = input && input.files && input.files[0];
  if(!file) return;
  const status = document.getElementById('content-import-status');
  if(status) status.textContent = 'Reading ' + file.name + '…';
  try{
    const text = await extractPdfText_(file);
    if(!text.trim()) throw new Error('No selectable text was found. Use a text-based PDF or run OCR first.');
    const content = splitImportedContentSections_(text);
    // If the source has one undivided content section, keep it useful by
    // using the parsed text as the voiceover and leaving the optional copy
    // fields ready for a second import.
    if(!content.vo.length && (content.tt.length || content.yt.length)) content.vo = content.tt.length ? [...content.tt] : [...content.yt];
    if(!content.vo.length) throw new Error('Could not identify any numbered content in this PDF');
    const fields = { vo:'content-vo', tt:'content-tt', yt:'content-yt' };
    const existing = Object.values(fields).some(id => (document.getElementById(id)?.value || '').trim());
    if(existing && !window.confirm('Replace the text currently in the content fields with this PDF import?')) return;
    Object.keys(fields).forEach(key => {
      const el = document.getElementById(fields[key]);
      if(el) el.value = content[key].join('\n\n');
    });
    if(status) status.textContent = '✓ Imported ' + content.vo.length + ' voiceovers, ' + content.tt.length + ' TikTok entries, and ' + content.yt.length + ' YouTube entries from ' + file.name;
    showToast('✓ PDF imported — review the entries, then save content');
  }catch(e){
    console.error('PDF import failed:', e);
    if(status) status.textContent = '⚠ ' + (e.message || 'Could not read this PDF');
    showToast('⚠ PDF import failed: ' + (e.message || 'Could not read this file'));
  }finally{
    if(input) input.value = '';
  }
}

  const slots = getBookDaySlots(dateStr, bookId);

function wizardSuggestedDates_(){
  const count = CAL_WIZ_VIDEOS;
  if(!(count >= 1)) return [];
  const plan = [];
  let remaining = count;
  let dateStr = todayDateStr_();
  for(let scanned = 0; remaining > 0 && scanned < 366; scanned++){
    const freeSlots = availableCrossPostSlots_(dateStr, CAL_SELECTED_BOOK);
    if(freeSlots.length){
      const slotIndexes = freeSlots.slice(0, Math.min(remaining, freeSlots.length));
      plan.push({ dateStr, slotIndexes });
      remaining -= slotIndexes.length;
    }
    dateStr = addDaysToDateStr_(dateStr, 1);
  }
  return plan;

   get all 6 slots; the final day gets only its remainder of videos), then
   persist ALL dates in one bulk POST. Pool limits are still enforced per
   platform by setVideoSlot. */
async function scheduleAlbumDates_(){
  if(!CAL_SELECTED_BOOK){ showToast('⚠ Select a book first'); return; }
  const plan = wizardSuggestedDates_();
  if(!plan.length){ showToast('⚠ Enter the number of videos in the album first'); return; }
  let placed = 0;
  plan.forEach(item => {
    item.slotIndexes.forEach(n => {
      if(setVideoSlot(item.dateStr, CAL_SELECTED_BOOK, 'tt' + n, true)) placed++;
      if(setVideoSlot(item.dateStr, CAL_SELECTED_BOOK, 'yt' + n, true)) placed++;
    });
  });
  renderCalendarPanel_();
  if(!placed){ showToast('⚠ Nothing placed — the Week ' + CAL_SOURCE_WEEK + ' pool is dry or dates are read-only'); return; }
  showToast('🎬 Scheduling ' + plan.length + ' date' + (plan.length > 1 ? 's' : '') + ' from the Week ' + CAL_SOURCE_WEEK + ' album…');
  const days = plan.map(item => videoDayRow_(item.dateStr));
  const saved = await postSaveVideoDays_(
    days,
    r => '✅ ' + plan.length + ' date' + (plan.length > 1 ? 's' : '') + ' scheduled — ' + (r.slots || 0) + ' slots persisted',

  );

    CAL_WINDOW_START_DATE = plan[0] ? plan[0].dateStr : CAL_WINDOW_START_DATE;
    renderCalendarPanel_();
  }
}

    const n = parseInt(w, 10);

    weeks.push({ weekNum: n, postedTikTok: !!tt, postedYouTube: !!yt });

  (book.weeks || []).forEach(w => addWeek(w.weekNum, w.steps && w.steps['Posted TikTok'], w.steps && w.steps['Posted YouTube']));
  if(av && av.perWeek) Object.keys(av.perWeek).forEach(k => addWeek(k, av.perWeek[k].postedTikTok, av.perWeek[k].postedYouTube));

    '<div style="padding:8px 10px;font-family:var(--fD);font-size:.7rem;font-weight:600;color:var(--ink);border-bottom:1px solid var(--bd);background:var(--card);">📣 Posting Status — TikTok &amp; YouTube mark-done, independent per week</div>' +

function generateHistoricalTasks_(){
  if(!RAW_DATA || !RAW_DATA.books) return;
  const board = RAW_DATA.taskBoard || [];
  const existing = new Set(board.map(t => `${t.bookId}__${t.weekNum}__${t.stepKey}`));
  const completed = new Set();

  const logs = RAW_DATA.activityLogs || {};
  Object.keys(logs).forEach(bid => {
    (logs[bid] || []).forEach(e => {
      if(e.type === 'task_complete' && e.weekNum != null && e.stepKey){
        completed.add(`${bid}__${e.weekNum}__${e.stepKey}`);
      }
    });
  });

  const synthetic = [];
  activeBooks_().forEach(b => {
    const curWeek = Math.max(1, b.currentWeek || 1);
    const bookLinks = b.links || {};
    for(let w = 1; w <= curWeek; w++){
      CHECKLIST_STEP_ORDER.forEach(stepKey => {
        const sig = `${b.id}__${w}__${stepKey}`;
        if(existing.has(sig) || completed.has(sig)) return;
        if(w === curWeek && b.currentWeekSteps && b.currentWeekSteps[stepKey]) return;
        synthetic.push({
          bookId: b.id,
          bookTitle: b.title || 'Untitled',
          author: b.author || '',
          weekNum: w,
          stepKey: stepKey,
          bucket: STEP_TO_BUCKET[stepKey] || 'Other',
          status: 'open',
          claimedBy: '',
          links: bookLinks
        });
      });
    }
  });

  if(synthetic.length){
    RAW_DATA.taskBoard = board.concat(synthetic);
  }
}

let FOCUS_RUNNING=false;
let FOCUS_INTERVAL=null;
let FOCUS_SESSIONS_TODAY=0;
let FOCUS_WIDGET_OPEN=false;
let FOCUS_HIDDEN_AT=null;     

function focusStateKey_(){return`atomicShelfFocusSessions_${(EDITOR_NAME||'').toLowerCase()}`;}
function loadFocusSessionsToday_(){

function initFocusTimer_(){
  FOCUS_SESSIONS_TODAY=loadFocusSessionsToday_();
  renderFocusWidget();
  if(!window._visHandler){
    window._visHandler=true;
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){
        if(FOCUS_RUNNING) FOCUS_HIDDEN_AT=Date.now();
      }else{
        if(FOCUS_RUNNING && FOCUS_HIDDEN_AT){
          const elapsedSec=Math.floor((Date.now()-FOCUS_HIDDEN_AT)/1000);
          FOCUS_HIDDEN_AT=null;
          if(elapsedSec>0){
            FOCUS_REMAINING=Math.max(0,FOCUS_REMAINING-elapsedSec);
            renderFocusWidget();
            if(FOCUS_REMAINING<=0) onFocusPhaseComplete_();
          }
        }
      }
    });
  }
}
function setFocusTask(k){
  FOCUS_TASK_KEY=k;
  FOCUS_WIDGET_OPEN=true;
  renderAll();
}
function clearFocusTask(){
  FOCUS_TASK_KEY=null;
  pauseFocusTimer();
  FOCUS_PHASE='work';
  FOCUS_REMAINING=POMODORO_WORK_SEC;
  renderFocusWidget();
}
function toggleFocusWidget(){FOCUS_WIDGET_OPEN=!FOCUS_WIDGET_OPEN;renderFocusWidget();}
function fmtClock_(sec){const m=Math.floor(sec/60),s=sec%60;return`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function currentFocusTask_(){
  if(!FOCUS_TASK_KEY)return null;
  const mine=myTasks_();
  return mine.find(t=>taskKey_(t)===FOCUS_TASK_KEY)||null;
}
function startFocusTimer(){
  if(FOCUS_RUNNING)return;
  FOCUS_RUNNING=true;
  FOCUS_HIDDEN_AT=null;
  FOCUS_INTERVAL=setInterval(()=>{
    FOCUS_REMAINING--;
    if(FOCUS_REMAINING<=0){
      onFocusPhaseComplete_();
    }else{
      renderFocusWidget();
    }
  },1000);
  renderFocusWidget();
}
function pauseFocusTimer(){
  FOCUS_RUNNING=false;
  if(FOCUS_INTERVAL)clearInterval(FOCUS_INTERVAL);
  FOCUS_INTERVAL=null;
  renderFocusWidget();
}
function resetFocusTimer(){
  pauseFocusTimer();
  FOCUS_PHASE='work';
  FOCUS_REMAINING=POMODORO_WORK_SEC;
  renderFocusWidget();
}

async function saveFocusSession(){
  if(FOCUS_PHASE !== 'work') return;
  const elapsedSec = POMODORO_WORK_SEC - FOCUS_REMAINING;
  if(elapsedSec < 60){ showToast('⚠ Work at least 1 minute before saving'); return; }

  pauseFocusTimer();
  const minutes = +(elapsedSec / 60).toFixed(2);
  const task = currentFocusTask_();

  showToast('⏳ Saving session…');
  try{
    const r = await postAction({
      action:'saveTimeSession',
      author: task ? task.author : '',
      title: task ? task.bookTitle : 'Pomodoro Session',
      editor: EDITOR_NAME,
      durationMinutes: minutes,
      sessionType: 'Pomodoro',
      notes: 'Pomodoro focus session'
    });
    if(r && r.__opaque){
      showToast('⏳ Sent — verifying…');
      await new Promise(res=>setTimeout(res,2000));
      await refreshAndRender(true); 
      showToast('🍅 Session saved — refresh to confirm');
      resetFocusTimer();
      return;
    }
    if(r && r.success){
      const coins = r.coinsAwarded == null ? Math.floor(minutes / 10) * COINS_PER_10MIN : r.coinsAwarded;

function computeStreakWithGrace_(days){
  let cursor=localDayStart_(Date.now());
  let streak=0;
  if(days.has(cursor))streak++;
  cursor-=86400000;
  let graceLeft=1;
  while(true){
    if(days.has(cursor)){streak++;cursor-=86400000;}
    else if(graceLeft>0){graceLeft--;cursor-=86400000;}
    else break;
  }
  return{streak,graceUsed:graceLeft===0};
}
function myWallet_(){
  const wallets=(RAW_DATA&&RAW_DATA.shelfCoinWallets)||{};
  return wallets[(EDITOR_NAME||'').trim().toLowerCase()]||null;
}
function myWithdrawals_(){return((RAW_DATA&&RAW_DATA.shelfCoinWithdrawals)||[]).filter(w=>(w.editor||'').toLowerCase()===(EDITOR_NAME||'').toLowerCase());}
function computeCoins_(allActs){
  const claims    = allActs.filter(e=>e.type==='task_claim'&&/^Task locked:/i.test(e.label||'')).length;
  const completes = allActs.filter(e=>e.type==='task_complete').length;
  const minutes   = myMinutesOr_(null, minutesInLogs_(allActs));

  const days=new Set(allActs.filter(e=>e.ts).map(e=>localDayStart_(e.ts)));
  const{streak,graceUsed}=computeStreakWithGrace_(days);

  const coinsFromClaims    = claims * COINS_PER_CLAIM;
  const coinsFromTime      = Math.floor(minutes / 10) * COINS_PER_10MIN;
  const coinsFromStreak    = streak * COINS_PER_STREAK_DAY;
  const coinsFromBonus     = getBonusCoinsTotal_();
  const historicalCoins    = coinsFromClaims + coinsFromTime + coinsFromStreak + coinsFromBonus;
  const wallet = myWallet_();
  const availableCoins     = wallet ? wallet.availableCoins : historicalCoins;
  const totalCoins         = wallet ? wallet.totalCoins : historicalCoins;
  const kesEquivalent      = availableCoins / COINS_PER_KES;

  let level = LEVELS[0], next = null;
  for (let i = 0; i < LEVELS.length; i++) {
    if (totalCoins >= LEVELS[i].min) {
      level = LEVELS[i];
      next  = LEVELS[i + 1] || null;
    }
  }
  const pctToNext = next ? Math.min(100, Math.round(((totalCoins - level.min) / (next.min - level.min)) * 100)) : 100;

  return {
    totalCoins, historicalCoins, kesEquivalent,
    availableCoins,
    workInProgressCoins: wallet ? wallet.workInProgressCoins : 0,
    frozenCoins: wallet ? wallet.frozenCoins : 0,
    coinsFromClaims, coinsFromTime,
    coinsFromStreak, coinsFromBonus,
    streak, graceUsed, level, next, pctToNext,
    minutes, completes: claims + completes, claims
  };
}

/* Claim every OPEN task under one author in one click. Posts are sequential
   and awaited — they cannot race each other on the server. Handles the
   opaque (no-cors) fallback the same way the manual batch claim does. */
async function claimAllForAuthor(gi){
  const author=AUTHOR_CLAIM_GROUPS_[gi];
  if(author==null){showToast('⚠ Group not found — refresh and retry');return;}
  const tasks=openTasks_().filter(t=>(t.author||'Unknown')===author && t.status==='open');
  if(!tasks.length){showToast('⚠ No open tasks left for '+author);return;}
  showToast('⏳ Claiming '+tasks.length+' task'+(tasks.length>1?'s':'')+' for '+author+'…');
  let ok=0,fail=0,opaque=0;
  for(const t of tasks){
    try{
      const r=await postAction({action:'claimTask',bookId:t.bookId,author:t.author,title:t.bookTitle,weekNum:t.weekNum,stepKey:t.stepKey,editor:EDITOR_NAME,mode:'hard'});
      if(r&&r.__opaque)opaque++;
      else if(r&&r.success)ok++;
      else fail++;
    }catch(e){fail++;}
  }
  if(opaque>0&&ok===0&&fail===0){
    showToast('⏳ Batch sent — verifying…');
    await new Promise(res=>setTimeout(res,2000));
    await refreshAndRender(true);
    showToast('🔒 Claims sent for '+author+' — refresh to confirm');
    return;
  }
  showToast(fail
    ?'🔒 Claimed '+ok+', '+fail+' failed for '+author
    :'🔒 Claimed '+ok+' for '+author+' — +'+(ok*COINS_PER_CLAIM).toLocaleString()+' 🪙');
  await refreshAndRender(true);
}

function buildSessionTypesHTML_(allActs){const counts={},minutes={};allActs.forEach(e=>{if(e.type!=='time_log')return;const m=/^(\d+)m logged · (.+)$/.exec(e.label||'');if(!m)return;const mins=parseInt(m[1],10),type=m[2]||'General';counts[type]=(counts[type]||0)+1;minutes[type]=(minutes[type]||0)+mins;});const types=Object.keys(minutes);if(!types.length)return'';const entries=types.sort((a,z)=>minutes[z]-minutes[a]).map(t=>({label:t,value:minutes[t]}));return`<div class="chart-card"><div class="chart-card-hdr"><span class="chart-card-title">🕐 Time by Session Type</span><span class="chart-card-sub">minutes</span></div>${pieChartSVG_(entries)}</div>`;}

function buildBookProgressHTML_(){const bids=myBookIds_();const books=bids.map(bid=>bookById_(bid)).filter(Boolean);if(!books.length)return'';BOOK_PROGRESS_DATA={};const cards=books.map(b=>{const steps=b.currentWeekSteps||{};const total=CHECKLIST_STEP_ORDER.length;const doneKeys=CHECKLIST_STEP_ORDER.filter(k=>steps[k]);const pct=total?Math.round(doneKeys.length/total*100):0;BOOK_PROGRESS_DATA[b.id]={title:b.title,pct,doneKeys};return{b,pct,doneKeys};}).sort((x,z)=>x.pct-z.pct).map(({b,pct})=>{const steps=b.currentWeekSteps||{};const doneCount=CHECKLIST_STEP_ORDER.filter(k=>steps[k]).length;return`<div class="book-donut-card" onmousemove="showBookTooltip(event,${jsArg(b.id)})" onmouseleave="hideChartTooltip()"><div class="book-donut" style="background:conic-gradient(var(--moss-d) 0% ${pct}%, var(--bd-lt) ${pct}% 100%)"><div class="book-donut-inner">${pct}%</div></div><div class="book-donut-meta"><div class="book-donut-title">${esc(b.title)}</div><div class="book-donut-sub">${doneCount}/${CHECKLIST_STEP_ORDER.length} steps · Wk ${b.currentWeek||1}</div></div></div>`;}).join('');return`<div class="chart-card"><div class="chart-card-hdr"><span class="chart-card-title">📖 Books This Week</span><span class="chart-card-sub">${books.length} covered</span></div><div class="book-donut-grid">${cards}</div></div>`;}
