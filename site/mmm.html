<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atomic Shelf · Editor Portal</title>
<link rel="icon" type="image/svg+xml" href="https://atomic-shelf.com/book-and-people-spring-svgrepo-com.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF6EA;--cream2:#F6EBD2;--cream3:#EEDCA8;
  --saffron:#E0913C;--saffron-d:#C6721E;--saffron-dk:#95500F;
  --rust:#C15A3C;--rust-d:#A03F26;
  --clove:#8B4A9C;--clove-bg:rgba(139,74,156,.09);--clove-bd:rgba(139,74,156,.28);
  --moss:#3C8A5E;--moss-d:#296B45;--moss-lt:#EAF5EE;
  --bark:#A17A4C;--bark-d:#7A5A2E;--bark-dk:#5C3D1E;
  --espresso:#3A2413;--ink:#241505;
  --red:#C0392B;--red-bg:rgba(192,57,43,.1);--red-bd:rgba(192,57,43,.28);

  /* Coins palette — amber-gold */
  --coin:#F5C842;--coin-d:#D4A012;--coin-dk:#9A7000;
  --coin-bg:rgba(245,200,66,.12);--coin-bd:rgba(245,200,66,.38);
  --coin-glow:0 0 18px rgba(245,200,66,.28),0 0 4px rgba(245,200,66,.18);

  --bg:var(--cream);--surf:#FFFCF4;--card:#FFFDF8;--bd:#E4CCA4;--bd-lt:#F0E2C0;
  --text:var(--ink);--muted:var(--bark-d);

  --r:10px;--r-sm:7px;--r-lg:16px;--r-xl:24px;
  --sh:0 1px 2px rgba(58,36,19,.04),0 4px 14px rgba(58,36,19,.06);
  --sh-md:0 4px 12px rgba(58,36,19,.08),0 12px 32px rgba(58,36,19,.12);
  --sh-lg:0 8px 24px rgba(58,36,19,.14),0 24px 64px rgba(58,36,19,.18);

  --fB:'Inter',Georgia,'Times New Roman',serif;
  --fD:'Fraunces','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --fM:'JetBrains Mono','Courier New',monospace;

  --nav-h:64px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px;scroll-behavior:smooth}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(224,145,60,.14), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(60,138,94,.09), transparent 55%),
    radial-gradient(ellipse 600px 600px at 50% 100%, rgba(139,74,156,.04), transparent 60%),
    var(--bg);
  color:var(--text);font-family:var(--fB);min-height:100vh;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  letter-spacing:-.005em;
}

#shell{display:flex;flex-direction:column;min-height:100vh}

/* ═══ TOPBAR ═══ */
#topbar{
  position:sticky;top:0;z-index:100;
  height:var(--nav-h);
  background:linear-gradient(120deg,#2B1B0C 0%,#241505 60%,#1A1005 100%);
  border-bottom:1px solid rgba(224,145,60,.22);
  display:flex;align-items:center;gap:0;padding:0 22px;
  box-shadow:0 4px 24px rgba(36,21,5,.28),0 1px 0 rgba(224,145,60,.08) inset;
  backdrop-filter:blur(12px);
}
#topbar .brand{
  display:flex;align-items:center;gap:11px;
  font-family:var(--fD);font-size:1.18rem;font-weight:600;color:#FBF6EA;
  margin-right:30px;flex-shrink:0;letter-spacing:-.01em;
}
#topbar .brand svg{width:30px;height:30px;filter:drop-shadow(0 2px 6px rgba(224,145,60,.35))}
#topbar .brand .slash{color:rgba(224,145,60,.45);margin:0 5px;font-weight:300}
#topbar .brand .editor-chip{
  font-family:var(--fM);font-size:.66rem;font-weight:600;letter-spacing:.04em;
  color:var(--saffron);background:rgba(224,145,60,.12);
  border:1px solid rgba(224,145,60,.28);
  padding:4px 10px;border-radius:20px;
}

#topbar .coins-chip{
  display:flex;align-items:center;gap:6px;
  font-family:var(--fM);font-size:.66rem;font-weight:600;letter-spacing:.02em;
  color:var(--coin);background:var(--coin-bg);
  border:1px solid var(--coin-bd);
  padding:5px 11px;border-radius:20px;
  transition:all .25s cubic-bezier(.4,0,.2,1);
  cursor:default;
}
#topbar .coins-chip:hover{
  box-shadow:var(--coin-glow);
  transform:translateY(-1px);
}
#topbar .coins-chip .coin-ico{
  font-size:.8rem;
  text-shadow:0 0 8px rgba(245,200,66,.6);
}

#nav-tabs{display:flex;align-items:stretch;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
#nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{
  display:flex;align-items:center;gap:7px;
  font-family:var(--fM);font-size:.7rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;
  color:rgba(251,246,234,.55);
  padding:0 15px;height:var(--nav-h);
  border:none;background:none;cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.nav-tab:hover{color:rgba(251,246,234,.92)}
.nav-tab.active{color:#FBF6EA;border-bottom-color:var(--saffron)}
.nav-tab.active::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 60%,rgba(224,145,60,.08));
  pointer-events:none;
}
.nav-tab .badge{
  background:var(--moss-d);color:#fff;font-size:.56rem;font-weight:700;
  min-width:17px;height:17px;border-radius:9px;
  display:inline-flex;align-items:center;justify-content:center;padding:0 4px;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.nav-tab .badge.gold{background:linear-gradient(135deg,var(--saffron-d),var(--saffron-dk))}
#topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0;padding-left:14px}
.switch-btn{
  font-family:var(--fM);font-size:.6rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:rgba(251,246,234,.55);background:rgba(251,246,234,.04);
  border:1px solid rgba(251,246,234,.12);border-radius:var(--r-sm);
  padding:7px 12px;cursor:pointer;white-space:nowrap;
  transition:all .2s;
}
.switch-btn:hover{color:#FBF6EA;border-color:rgba(251,246,234,.32);background:rgba(251,246,234,.08)}

#main{padding:28px 22px 80px;max-width:920px;margin:0 auto;width:100%;flex:1}
.tab-panel{display:none;animation:fadeUp .4s cubic-bezier(.4,0,.2,1)}
.tab-panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ═══ HERO ═══ */
.hero{
  background:linear-gradient(148deg,var(--card) 0%,var(--cream2) 100%);
  border:1px solid var(--bd);border-radius:var(--r-xl);
  box-shadow:var(--sh-md);padding:28px 30px;margin-bottom:24px;
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--moss-d),var(--saffron),var(--rust));
}
.hero::after{
  content:'';position:absolute;top:-50%;right:-20%;width:60%;height:200%;
  background:radial-gradient(circle,rgba(224,145,60,.08),transparent 60%);
  pointer-events:none;
}
.hero-greeting{
  font-family:var(--fM);font-size:.62rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--moss-d);margin-bottom:6px;
}
.hero-title{
  font-family:var(--fD);font-size:2rem;font-weight:600;color:var(--ink);
  letter-spacing:-.02em;line-height:1.15;
}
.earnings-strip{display:flex;gap:11px;flex-wrap:wrap;margin-top:18px;align-items:center;position:relative;z-index:1}
.e-tile{
  background:var(--surf);border:1px solid var(--bd-lt);border-radius:var(--r);
  padding:12px 18px;display:inline-flex;align-items:baseline;gap:9px;
  transition:all .2s;
}
.e-tile:hover{border-color:var(--bd);box-shadow:var(--sh);transform:translateY(-1px)}
.e-tile .v{font-family:var(--fD);font-size:1.55rem;font-weight:600;color:var(--moss-d);letter-spacing:-.02em}
.e-tile .l{font-family:var(--fM);font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}

/* ═══ SPARKS TILE ═══ */
.coins-tile{
  background:linear-gradient(135deg,#2B1B0C 0%,#1A1005 100%);
  border:1px solid var(--coin-bd);border-radius:var(--r-lg);
  padding:18px 24px;display:inline-flex;align-items:center;gap:16px;
  box-shadow:var(--coin-glow),var(--sh-md);position:relative;overflow:hidden;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.coins-tile:hover{transform:translateY(-2px)}
.coins-tile::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 50%,rgba(245,200,66,.14),transparent),
    radial-gradient(ellipse 60% 100% at 80% 0%,rgba(224,145,60,.08),transparent);
  pointer-events:none;
}
.coins-tile .coin-icon{
  font-size:2.2rem;line-height:1;flex-shrink:0;
  text-shadow:0 0 20px rgba(245,200,66,.6),0 0 40px rgba(245,200,66,.3);
  position:relative;z-index:1;
}
.coins-tile .coin-count{
  font-family:var(--fD);font-size:2.2rem;font-weight:600;color:var(--coin);line-height:1;
  text-shadow:0 0 14px rgba(245,200,66,.5);
  letter-spacing:-.02em;
}
.coins-tile .coin-label{
  font-family:var(--fM);font-size:.58rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.1em;color:rgba(245,200,66,.7);margin-top:3px;
}
.coins-tile .coin-kes{font-family:var(--fM);font-size:.62rem;color:rgba(251,246,234,.42);margin-top:5px}

/* ═══ REDEEM CARD ═══ */
.redeem-card{
  background:linear-gradient(140deg,rgba(245,200,66,.09),rgba(224,145,60,.06));
  border:1px solid var(--coin-bd);border-radius:var(--r-xl);
  padding:22px 24px;margin-bottom:24px;
  box-shadow:var(--sh);
}
.redeem-hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.redeem-hdr-title{font-family:var(--fD);font-size:1.15rem;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.redeem-hdr-sub{font-family:var(--fM);font-size:.62rem;color:var(--muted);margin-left:auto;white-space:nowrap;font-weight:500}
.redeem-rate{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--fM);font-size:.72rem;font-weight:600;
  background:var(--surf);border:1px solid var(--bd-lt);border-radius:var(--r-sm);
  padding:8px 14px;margin-bottom:16px;color:var(--bark-dk);
}
.redeem-rate .coin-ico{color:var(--coin);font-size:.9rem}
.redeem-tiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.redeem-tier{
  background:var(--surf);border:1px solid var(--bd-lt);border-radius:var(--r);
  padding:14px 16px;cursor:pointer;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.redeem-tier:hover{
  border-color:var(--coin-bd);box-shadow:var(--coin-glow);
  transform:translateY(-2px);
}
.redeem-tier .rt-coins{font-family:var(--fD);font-size:1.25rem;font-weight:600;color:var(--coin-dk);letter-spacing:-.01em}
.redeem-tier .rt-kes{font-family:var(--fM);font-size:.66rem;font-weight:600;color:var(--moss-d);margin-top:5px}
.redeem-tier .rt-tag{font-family:var(--fM);font-size:.56rem;color:var(--muted);margin-top:3px;font-weight:500}
.redeem-tier.can-redeem{border-color:var(--coin-bd)}
.redeem-tier.cannot-redeem{opacity:.4;cursor:not-allowed;filter:grayscale(.3)}
.redeem-tier.popular::after{
  content:'Popular';position:absolute;top:-1px;right:10px;
  font-family:var(--fM);font-size:.5rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(135deg,var(--saffron-d),var(--saffron-dk));color:#fff;
  padding:3px 8px;border-radius:0 0 6px 6px;
}

/* ═══ LEVEL STRIP ═══ */
.level-strip{
  display:flex;align-items:center;gap:14px;margin-top:18px;
  background:linear-gradient(90deg,rgba(245,200,66,.1),rgba(60,138,94,.07));
  border:1px solid var(--coin-bd);border-radius:var(--r);
  padding:14px 18px;
  position:relative;overflow:hidden;
}
.level-strip::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 100% 60% at 0% 50%,rgba(245,200,66,.06),transparent);
  pointer-events:none;
}
.level-badge{
  width:46px;height:46px;border-radius:50%;
  background:conic-gradient(var(--coin) var(--lvl-pct,0%), var(--bd-lt) var(--lvl-pct,0%) 100%);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:var(--coin-glow);
  transition:transform .3s;
}
.level-strip:hover .level-badge{transform:rotate(10deg)}
.level-badge-inner{
  width:34px;height:34px;border-radius:50%;background:var(--card);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fD);font-weight:600;font-size:.82rem;color:var(--coin-dk);
}
.level-meta{flex:1;min-width:0;position:relative;z-index:1}
.level-title{font-family:var(--fD);font-weight:600;font-size:1rem;color:var(--ink);letter-spacing:-.01em}
.level-sub{font-family:var(--fM);font-size:.62rem;color:var(--muted);margin-top:3px;font-weight:500}
.level-lifetime{font-family:var(--fM);font-size:.62rem;color:var(--moss-d);margin-top:4px;font-weight:500}
.level-pts{font-family:var(--fD);font-weight:600;font-size:1.2rem;color:var(--coin-dk);white-space:nowrap;letter-spacing:-.01em}
.points-progress{margin-top:10px}
.points-track{height:8px;background:var(--bd-lt);border-radius:6px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(58,36,19,.1)}
.points-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--coin-d),var(--saffron-d));transition:width .6s cubic-bezier(.4,0,.2,1)}

.coin-rates{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.coin-rate-chip{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--fM);font-size:.64rem;font-weight:600;
  background:var(--coin-bg);border:1px solid var(--coin-bd);
  color:var(--coin-dk);border-radius:var(--r-sm);padding:6px 11px;
  transition:all .2s;
}
.coin-rate-chip:hover{box-shadow:var(--coin-glow);transform:translateY(-1px)}
.coin-rate-chip .ico{font-size:.85rem}

.sec-hdr{
  font-family:var(--fM);font-size:.64rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.12em;color:var(--muted);margin:28px 0 14px;
  display:flex;align-items:center;gap:10px;
}
.sec-hdr::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bd-lt),transparent)}

/* ═══ TASK CARDS ═══ */
.task-card{
  background:var(--card);border:1px solid var(--bd-lt);border-radius:var(--r-lg);
  box-shadow:var(--sh);padding:18px 20px;margin-bottom:11px;
  transition:all .25s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.task-card:hover{box-shadow:var(--sh-md);border-color:var(--bd);transform:translateY(-1px)}
.task-book{font-family:var(--fD);font-size:1.12rem;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.task-book-link{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--bd);text-underline-offset:3px;transition:text-decoration-color .2s}
.task-book-link:hover{text-decoration-color:var(--saffron)}
.task-step{font-family:var(--fM);font-size:.7rem;color:var(--bark-dk);margin-top:5px;font-weight:500}
.task-meta{font-family:var(--fM);font-size:.62rem;color:var(--muted);margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.task-links{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.task-link{
  font-family:var(--fM);font-size:.66rem;font-weight:600;color:var(--clove);
  text-decoration:none;background:var(--clove-bg);border:1px solid var(--clove-bd);
  padding:5px 11px;border-radius:20px;
  transition:all .2s;
}
.task-link:hover{background:rgba(139,74,156,.16);transform:translateY(-1px)}
.task-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.tbtn{
  font-family:var(--fM);font-size:.66rem;font-weight:600;
  border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surf);
  color:var(--bark-dk);padding:8px 15px;cursor:pointer;
  transition:all .15s cubic-bezier(.4,0,.2,1);
  letter-spacing:.01em;
}
.tbtn:hover{background:var(--cream);border-color:var(--saffron);transform:translateY(-1px);box-shadow:var(--sh)}
.tbtn:active{transform:translateY(0)}
.tbtn.primary{background:linear-gradient(135deg,var(--moss-d),var(--moss));color:#fff;border-color:var(--moss-d);box-shadow:0 2px 8px rgba(41,107,69,.25)}
.tbtn.primary:hover{background:linear-gradient(135deg,var(--moss),#4DA070);box-shadow:0 4px 12px rgba(41,107,69,.35)}
.tbtn.gold{background:linear-gradient(135deg,var(--saffron-d),var(--rust-d));color:#fff;border-color:var(--saffron-dk);box-shadow:0 2px 8px rgba(198,114,30,.25)}
.tbtn.gold:hover{filter:brightness(1.08);box-shadow:0 4px 12px rgba(198,114,30,.35)}
.tbtn.coin{background:linear-gradient(135deg,var(--coin-d),var(--saffron-d));color:#fff;border-color:var(--coin-dk);box-shadow:0 2px 8px rgba(212,160,18,.3)}
.tbtn.coin:hover{filter:brightness(1.1);box-shadow:var(--coin-glow),0 4px 12px rgba(212,160,18,.3)}

.pill{
  display:inline-flex;align-items:center;font-family:var(--fM);font-size:.58rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:20px;
  border:1px solid var(--bd);background:var(--surf);color:var(--muted);
}
.pill.locked{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.pill.soft{background:rgba(224,145,60,.15);color:var(--saffron-dk);border-color:rgba(224,145,60,.32)}
.pill.open{background:var(--moss-lt);color:var(--moss-d);border-color:rgba(60,138,94,.32)}
.pill.coin-pill{background:var(--coin-bg);color:var(--coin-dk);border-color:var(--coin-bd)}

.time-form{display:flex;gap:8px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--bd-lt);flex-wrap:wrap}
.time-form input,.time-form select{font-family:var(--fB);font-size:.8rem;border:1px solid var(--bd);border-radius:var(--r-sm);padding:7px 10px;background:var(--surf);color:var(--text);transition:border-color .2s}
.time-form input:focus,.time-form select:focus{outline:none;border-color:var(--saffron);box-shadow:0 0 0 3px rgba(224,145,60,.12)}
.time-form input[type=number]{width:84px}

.book-context-panel{
  background:var(--card);border:1px solid var(--saffron);border-radius:var(--r-xl);
  box-shadow:var(--sh-md);padding:20px 22px;margin-bottom:22px;
  position:relative;overflow:hidden;
}
.book-context-panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--saffron-dk),var(--saffron),var(--rust));
}
.book-context-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.book-context-title{font-family:var(--fD);font-size:1.3rem;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.book-context-sub{font-size:.86rem;color:var(--bark-d);margin-top:3px}
.book-context-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.ctx-links{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.ctx-checklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:7px}
.ctx-step{
  display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--bark-dk);
  padding:7px 10px;border-radius:var(--r-sm);background:var(--surf);
  border:1px solid var(--bd-lt);transition:all .2s;
}
.ctx-step.done{color:var(--moss-d);background:rgba(60,138,94,.07);border-color:rgba(60,138,94,.28)}
.ctx-step-dot{
  width:15px;height:15px;border-radius:50%;border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;font-size:.6rem;flex-shrink:0;
  transition:all .2s;
}

.suggest-card{

}
.suggest-hdr{display:flex;align-items:center;gap:9px;font-family:var(--fD);font-size:1.08rem;font-weight:600;color:var(--ink);margin-bottom:13px;letter-spacing:-.01em}

@keyframes barGrow{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.animated-bar{animation:barGrow .5s cubic-bezier(.4,0,.2,1) both}
@keyframes drawLine{from{stroke-dashoffset:var(--len,1000)}to{stroke-dashoffset:0}}
.animated-line{stroke-dasharray:var(--len,1000);animation:drawLine 1.1s cubic-bezier(.4,0,.2,1) both}
@keyframes coinFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.coin-icon{animation:coinFloat 2.4s ease-in-out infinite}

.coin-icon,.coin-ico{filter:drop-shadow(0 2px 4px rgba(180,130,30,.55)) drop-shadow(0 0 14px rgba(245,200,66,.45)) drop-shadow(0 -1px 0 rgba(120,80,10,.4))}

.live-ago{color:var(--muted)}

.task-card.focus-active{

function fetchFromBridge(){
  return new Promise((resolve,reject)=>{
    const cb='epCb_'+Date.now();
    const script=document.createElement('script');
    const auth=SESSION_TOKEN?'&token='+encodeURIComponent(SESSION_TOKEN)+'&editor='+encodeURIComponent(EDITOR_NAME):'';
    script.src=APPS_SCRIPT_URL+'?callback='+cb+'&t='+Date.now()+auth;
    let done=false;
    window[cb]=(data)=>{
      if(done)return;done=true;
      delete window[cb];
      if(script.parentNode)script.parentNode.removeChild(script);
      resolve(data);
    };
    script.onerror=()=>{
      if(done)return;done=true;
      delete window[cb];
      if(script.parentNode)script.parentNode.removeChild(script);
      reject(new Error('Apps Script request failed'));
    };
    document.head.appendChild(script);
  });
}
async function postAction(body, opts){
  const payload = JSON.stringify({...body, token: body.action==='login'?undefined:SESSION_TOKEN, editor: body.editor||EDITOR_NAME});

  try{
    const r = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: payload, redirect: 'follow' });
    const text = await r.text();
    let data;
    try{ data = JSON.parse(text); }
    catch(_){ throw new Error('non-JSON'); }
    /* Auto-logout on auth errors assumes the session is stale. That's wrong for
       NEW actions hitting an OLDER deployment: the backend's editor allowlist
       doesn't know the action, so it answers 'auth' — and logging out makes the
       new button look "not implemented". Callers behind the feature flag pass
       {noAuthLogout:true} and handle the response themselves. */
    if(data && data.error==='auth' && !(opts && opts.noAuthLogout)) logoutEditor();
    return data;
  }catch(err1){
    console.warn('fetch POST failed:', err1.message || err1);
    try{
      await fetch(APPS_SCRIPT_URL, { method: 'POST', body: payload, mode: 'no-cors', redirect: 'follow' });
      console.log('no-cors POST dispatched — polling will verify');
      return { __opaque: true };
    }catch(err2){
      console.warn('no-cors POST also failed:', err2);
      throw new Error('Could not reach server. The Apps Script backend may need CORS headers on doPost.');
    }
  }
}

const EDITOR_LOGIN_KEY='atomicShelfEditorLogin';
function getSavedLogin_(){try{const r=localStorage.getItem(EDITOR_LOGIN_KEY);if(!r)return null;const p=JSON.parse(r);return p&&p.editorName&&p.token?p:null;}catch(_){return null;}}
function saveLogin_(n,token){try{localStorage.setItem(EDITOR_LOGIN_KEY,JSON.stringify({editorName:n,token,ts:Date.now()}));}catch(_){}}
function logoutEditor(){try{localStorage.removeItem(EDITOR_LOGIN_KEY);}catch(_){}SESSION_TOKEN='';location.reload();}

function bookById_(bid){return(RAW_DATA.books||[]).find(b=>b.id===bid)||null;}
function activeBooks_(){return(RAW_DATA.books||[]).filter(b=>!b.isArchived);}
function isPaidBook_(b){
  if(!b)return false;
  if(parseFloat(b.retainer)>0)return true;
  return /paid|active/i.test(String(b.paymentStatus||'')) && !/unpaid|not paid|pending/i.test(String(b.paymentStatus||''));
}
function taskPriority_(t){
  const b=bookById_(t.bookId);
  const paid=isPaidBook_(b)?1:0;
  const curWeek=b?(b.currentWeek||1):1;
  const behind=Math.max(0,curWeek-(t.weekNum||curWeek));
  const active=b&&/active/i.test(String(b.campaignStatus||''))?1:0;
  return{paid,urgency:behind*2+active,behind};
}
function myTasks_(){
  return(RAW_DATA.taskBoard||[]).filter(t=>(t.claimedBy||'').toLowerCase()===EDITOR_NAME.toLowerCase()&&(t.status==='locked'||t.status==='soft_claimed'));
}
function openTasks_(){
  return(RAW_DATA.taskBoard||[])
    .filter(t=>t.status==='open'||(t.status==='soft_claimed'&&(t.claimedBy||'').toLowerCase()!==EDITOR_NAME.toLowerCase()))
    .sort((a,z)=>{
      const pa=taskPriority_(a),pz=taskPriority_(z);
      if(pz.paid!==pa.paid)return pz.paid-pa.paid;
      if(pz.urgency!==pa.urgency)return pz.urgency-pa.urgency;
      return(a.weekNum||0)-(z.weekNum||0);
    });
}

function myEarningsThisMonth_(){
  const period = monthKeyFromDate(new Date());
  return(RAW_DATA.payrollAdjustments||[])
    .filter(a => {
      if((a.editor||'').toLowerCase() !== EDITOR_NAME.toLowerCase()) return false;
      if(!a.recordedAt) return false;
      return monthKeyFromDate(new Date(a.recordedAt)) === period;
    })
    .reduce((s,a)=>s+(a.type==='deduction'?-a.amountKes:a.amountKes),0);
}

function myPendingBalance_(){
  const adjTotal = (RAW_DATA.payrollAdjustments||[])
    .filter(a => (a.editor||'').toLowerCase() === EDITOR_NAME.toLowerCase())
    .reduce((s,a) => s + (a.type==='deduction'?-a.amountKes:a.amountKes), 0);

  const paidOut = (RAW_DATA.payoutRequests||[])
    .filter(r => (r.editor||'').toLowerCase() === EDITOR_NAME.toLowerCase() && r.status === 'paid')
    .reduce((s,r) => s + (r.amountKes||0), 0);

  return adjTotal - paidOut;
}
function myOpenPayoutRequest_(){
  return(RAW_DATA.payoutRequests||[]).find(r=>(r.editor||'').toLowerCase()===EDITOR_NAME.toLowerCase()&&(r.status==='pending'||r.status==='in_review'))||null;
}
function myActivityAll_(){
  const all=[];
  const map=RAW_DATA.activityLogs||{};
  Object.keys(map).forEach(bid=>(map[bid]||[]).forEach(e=>{
    if((e.editor||'').toLowerCase()===EDITOR_NAME.toLowerCase())all.push(e);
  }));
  all.sort((a,z)=>(z.ts||0)-(a.ts||0));
  return all;
}
function isToday_(ts){if(!ts)return false;const d=new Date(ts),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();}
function minutesInLogs_(logs){return logs.reduce((s,e)=>{if(e.type!=='time_log')return s;const m=/^(\d+)m logged/.exec(e.label||'');return s+(m?parseInt(m[1],10):0);},0);}
/* Registered minutes come from the TimeTracking sheet (RAW_DATA.timeSessions) —
   the same rows payroll reads — not from activity-log label parsing. Conflict
   rule mirrors the backend payroll: per book+day, pomodoro minutes are
   authoritative and manual entries for that bucket are ignored. Returns null
   when the backend hasn't been redeployed with timeSessions yet, so callers
   can fall back to the legacy activity-log estimate. */
function myRegisteredMinutes_(tsFilter){
  const sessions=RAW_DATA.timeSessions;
  if(!sessions)return null;
  const isPomo_=s=>String(s.type||'').trim().toLowerCase()==='pomodoro'||String(s.notes||'').trim().toLowerCase().indexOf('pomodoro')===0;
  const buckets={};
  sessions.forEach(s=>{
    if((s.editor||'').toLowerCase()!==EDITOR_NAME.toLowerCase())return;
    const t=s.ts?new Date(s.ts).getTime():0;
    if(tsFilter&&!tsFilter(t,s))return;
    const d=new Date(t);
    const dayKey=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    const k=(s.bookId||'_')+'|'+dayKey;
    if(!buckets[k])buckets[k]={pomo:0,manual:0};
    if(isPomo_(s))buckets[k].pomo+=(parseFloat(s.durationMin)||0);
    else buckets[k].manual+=(parseFloat(s.durationMin)||0);
  });
  let total=0;
  Object.keys(buckets).forEach(k=>{const b=buckets[k];total+=b.pomo>0?b.pomo:b.manual;});
  return Math.round(total);
}
function myMinutesOr_(tsFilter,legacyMinutes){
  const m=myRegisteredMinutes_(tsFilter);
  return m===null?legacyMinutes:m;
}
function myBookIds_(){
  const set=new Set();
  const map=RAW_DATA.activityLogs||{};
  Object.keys(map).forEach(bid=>{
    const entries=map[bid]||[];
    if(entries.some(e=>(e.editor||'').toLowerCase()===EDITOR_NAME.toLowerCase()))set.add(bid);
  });
  return[...set];
}

function localDateStr_(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function getTodaySunday_(){
  const d = new Date();
  d.setHours(0,0,0,0);
  const dow = d.getDay();
  d.setDate(d.getDate() - dow);
  return d.getTime();
}
function isPastDate_(dateStr){
  const today = new Date();
  today.setHours(0,0,0,0);
  const d = new Date(dateStr + 'T00:00:00');
  return d.getTime() < today.getTime();
}
function isDateToday_(dateStr){
  const today = new Date();
  today.setHours(0,0,0,0);
  const d = new Date(dateStr + 'T00:00:00');
  return d.getTime() === today.getTime();
}
function getBookCurrentWeek_(bookId){
  const b = bookById_(bookId);
  return b ? (b.currentWeek || 1) : 1;
}

/* FIX: Calendar week start logic now strictly matches the backend Command Centre's exact dates.
   Calculates the week start date based on the exact Campaign Live Date, not forcing Monday alignment.
*/
function getCampaignWeekStart_(bookId, campaignWeek) {
  const b = bookById_(bookId);
  if (!b || !b.campaignLiveDate) {
    const bookWeek = b ? (b.currentWeek || 1) : 1;
    const todaySun = getTodaySunday_();
    return todaySun + (campaignWeek - bookWeek) * 7 * 86400000;
  }
  const liveDate = new Date(b.campaignLiveDate);
  if (isNaN(liveDate.getTime())) return Date.now();
  const d = new Date(liveDate);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + (campaignWeek - 1) * 7);
  return d.getTime();
}

function onSourceWeekChange(week){
  week = parseInt(week, 10);
  if(!week || week < 1 || week > 20) return;
  CAL_SOURCE_WEEK = week;
  renderCalendarPanel_();
}
async function shiftCampaignWeek(delta){
  if(CAL_WEEK_DIRTY && CAL_SELECTED_BOOK){
    await saveCurrentWeek_(); // unsaved edits belong to the outgoing week
  }
  CAL_CURRENT_CAMPAIGN_WEEK = Math.max(1, Math.min(20, CAL_CURRENT_CAMPAIGN_WEEK + delta));
  CAL_WEEK_TOUCHED = true;
  CAL_WEEK_DIRTY = false;
  renderCalendarPanel_();
}

/* 6 daily slots: tt1-3 = TikTok (V1-V3), yt1-3 = YouTube Shorts (V4-V6).
   RAW_DATA.videoSchedules holds the backend shape { v1..v6, sw, publishedTikTok,
   publishedYouTube } per
   date+book; this maps it to slot keys for the UI. */
const SLOT_KEYS = ['tt1','tt2','tt3','yt1','yt2','yt3'];
const SLOT_PLATFORM = { tt1:'tiktok', tt2:'tiktok', tt3:'tiktok', yt1:'youtube', yt2:'youtube', yt3:'youtube' };
const SLOT_LABELS = { tt1:'TikTok 1', tt2:'TikTok 2', tt3:'TikTok 3', yt1:'YT Short 1', yt2:'YT Short 2', yt3:'YT Short 3' };
function emptyDaySlots_(){ return { tt1:false, tt2:false, tt3:false, yt1:false, yt2:false, yt3:false, sw:0, publishedTikTok:0, publishedYouTube:0 }; }

function getVideoSchedulesFromRaw_(){
  const map = RAW_DATA && RAW_DATA.videoSchedules ? RAW_DATA.videoSchedules : {};
  const out = {};
  Object.keys(map).forEach(dateStr => {
    out[dateStr] = {};
    const dayMap = map[dateStr] || {};
    Object.keys(dayMap).forEach(bookId => {
      const s = dayMap[bookId];
      if(s && typeof s === 'object'){
        out[dateStr][bookId] = {
          tt1: !!s.v1, tt2: !!s.v2, tt3: !!s.v3,
          yt1: !!s.v4, yt2: !!s.v5, yt3: !!s.v6,
          sw: parseInt(s.sw, 10) || 0,
          publishedTikTok: parseInt(s.publishedTikTok, 10) || 0,
          publishedYouTube: parseInt(s.publishedYouTube, 10) || 0
        };
      }
    });
  });
  return out;
}
function getDayData(dateStr){
  const backend = getVideoSchedulesFromRaw_();
  return backend[dateStr] || {};
}

/* ══ INTELLIGENT CALENDAR — pool awareness (PRD_intelligent_calendar.md) ══
   RAW_DATA.videoAvailability comes from the backend read payload:
   { bookId: { poolTotal, consumedDone, reservedScheduled, available,
               availableTikTok, availableYouTube, perWeek } }
   The same video cross-posts to TikTok AND YouTube, so each platform draws
   slots from the same pool independently. Books with no imported inventory
   (poolTotal === 0) are exempt — legacy behaviour, with an empty-state notice. */
/* Availability is tracked per platform AND per source week — spending Week 19
   leftovers never touches Week 21's own inventory. Books with no imported
   inventory (poolTotal === 0) are exempt — legacy behaviour. */
function getBookAvail_(bookId){
  return (RAW_DATA && RAW_DATA.videoAvailability ? RAW_DATA.videoAvailability[bookId] : null) || null;
}
function hasInventory_(bookId){
  const a = getBookAvail_(bookId);
  return !!(a && a.poolTotal > 0);
}
function sourceWeekAvail_(bookId, weekNum){
  const a = getBookAvail_(bookId);
  if(!a || !a.perWeek) return null;
  return a.perWeek[String(weekNum)] || null;
}
function platformAvail_(bookId, platform, weekNum){
  const a = getBookAvail_(bookId);
  if(!a || a.poolTotal === 0) return Infinity;
  const pw = sourceWeekAvail_(bookId, weekNum);
  if(!pw) return 0;
  return platform === 'tiktok' ? (pw.availableTikTok || 0) : (pw.availableYouTube || 0);
}
function adjustLocalAvail_(bookId, platform, weekNum, delta){
  const a = getBookAvail_(bookId);
  if(!a || a.poolTotal === 0) return;
  const key = platform === 'tiktok' ? 'availableTikTok' : 'availableYouTube';
  const pw = sourceWeekAvail_(bookId, weekNum);
  if(pw){
    pw[key] = Math.max(0, (pw[key] || 0) + delta);
    pw.available = Math.min(pw.availableTikTok || 0, pw.availableYouTube || 0);
  }
  a[key] = Math.max(0, (a[key] || 0) + delta);
  a.available = Math.min(a.availableTikTok || 0, a.availableYouTube || 0);
}
function getBookDaySlots(dateStr, bookId){
  const dayData = getDayData(dateStr);
  return dayData[bookId] || emptyDaySlots_();
}
function setVideoSlot(dateStr, bookId, slotKey, value){
  if(isPastDate_(dateStr)){ showToast('⚠ Cannot edit past dates'); return false; }
  const platform = SLOT_PLATFORM[slotKey];
  const sw = CAL_SOURCE_WEEK;
  if(value && hasInventory_(bookId) && platformAvail_(bookId, platform, sw) <= 0){
    showToast('⚠ Week ' + sw + ' has no ' + (platform === 'tiktok' ? 'TikTok' : 'YouTube') + ' videos left');
    return false;
  }
  if(!RAW_DATA.videoSchedules) RAW_DATA.videoSchedules = {};
  const raw = RAW_DATA.videoSchedules;
  if(!raw[dateStr]) raw[dateStr] = {};
  if(!raw[dateStr][bookId]) raw[dateStr][bookId] = { v1:false, v2:false, v3:false, v4:false, v5:false, v6:false, sw:sw };
  const row = raw[dateStr][bookId];
  const vKey = 'v' + (SLOT_KEYS.indexOf(slotKey) + 1);
  if(!!row[vKey] === value) return true;
  row[vKey] = value;
  if(sw) row.sw = sw;
  const hasAny = SLOT_KEYS.some((k, i) => !!row['v' + (i + 1)]);
  if(!hasAny){
    delete raw[dateStr][bookId];
    if(Object.keys(raw[dateStr]).length === 0) delete raw[dateStr];
  }
  adjustLocalAvail_(bookId, platform, sw, value ? -1 : 1);
  CAL_WEEK_DIRTY = true; // persisted by 💾 Save Week — one bulk POST, no races
  return true;
}
function toggleVideoSlot(dateStr, bookId, slotKey){
  if(isPastDate_(dateStr)){ showToast('⚠ Cannot edit past dates'); return; }
  const current = getBookDaySlots(dateStr, bookId);
  const ok = setVideoSlot(dateStr, bookId, slotKey, !current[slotKey]);
  if(ok) renderCalendarPanel_();
}
/* Persist the whole viewed week in ONE POST. The old per-day sync fired 7
   concurrent requests that raced each other's availability reads and row
   writes on the server — that's why weeks didn't persist. All 7 day rows
   (including their per-day source weeks) commit or fail together. */
/* One day-row snapshot from the local schedule state (source week defaults to
   the picker selection). Shared by the week save and the Album Scheduler. */
function videoDayRow_(dateStr){
  const raw = RAW_DATA.videoSchedules || {};
  const row = raw[dateStr] ? raw[dateStr][CAL_SELECTED_BOOK] : null;
  return {
    dateStr: dateStr,
    v1: !!(row && row.v1), v2: !!(row && row.v2), v3: !!(row && row.v3),
    v4: !!(row && row.v4), v5: !!(row && row.v5), v6: !!(row && row.v6),
    sourceWeek: row && row.sw ? row.sw : CAL_SOURCE_WEEK
  };
}
/* Shared persist engine: sends a set of day rows as ONE bulk POST (validated
   as a unit under a script lock on the server), with the sequential per-day
   fallback for backends that predate the bulk action and friendly
   pool-exhaustion errors. Used by Save Week AND the Album Scheduler — whose
   suggested dates can span campaign-week boundaries, which the backend's
   arbitrary date list accepts fine. */
async function postSaveVideoDays_(days, okMsg, pendingMsg, legacyMsg){
  try{
    const r = await postAction({
      action: 'saveVideoScheduleWeek',
      editor: EDITOR_NAME,
      bookId: CAL_SELECTED_BOOK,
      days: days
    });
    if(r && r.success){
      CAL_WEEK_DIRTY = false;
      await refreshAndRender(true);
      showToast(okMsg(r));
      return true;
    }
    if(r && r.__opaque){
      CAL_WEEK_DIRTY = false;
      showToast(pendingMsg);
      return true;
    }
    // Backend predates the bulk action — persist day-by-day instead. Saves are
    // AWAITED one at a time (never fired together), so the old backend's
    // per-day writer can't race itself and drop days.
    if(r && r.error && String(r.error).indexOf('Unknown action') === 0){
      console.warn('Backend lacks saveVideoScheduleWeek — falling back to sequential per-day saves. Redeploy Code.txt to pick up the bulk action.');
      showToast('⏳ Legacy backend — saving day by day…');
      let savedDays = 0, failedDay = '';
      for(const day of days){
        try{
          const dr = await postAction({
            action: 'saveVideoSchedule',
            editor: EDITOR_NAME,
            dateStr: day.dateStr,
            bookId: CAL_SELECTED_BOOK,
            v1: day.v1, v2: day.v2, v3: day.v3,
            v4: day.v4, v5: day.v5, v6: day.v6,
            sourceWeek: day.sourceWeek
          });
          if(dr && (dr.success || dr.deleted || dr.__opaque)) savedDays++;
          else { failedDay = day.dateStr + ': ' + ((dr && dr.error) || 'unknown'); break; }
        }catch(_){ failedDay = day.dateStr + ': network'; break; }
      }
      if(!failedDay){
        CAL_WEEK_DIRTY = false;
        await refreshAndRender(true);
        showToast(legacyMsg(savedDays));
        return true;
      }
      showToast('⚠ Save stopped at ' + failedDay + ' — try again');
      return false;
    }
    const friendly = r && r.error === 'pool_exhausted_tiktok'
      ? 'Week ' + (r.sourceWeek || '?') + ' TikTok pool exhausted (' + (r.availableTikTok || 0) + ' left' + (r.dateStr ? ' at ' + r.dateStr : '') + ')'
      : r && r.error === 'pool_exhausted_youtube'
        ? 'Week ' + (r.sourceWeek || '?') + ' YouTube pool exhausted (' + (r.availableYouTube || 0) + ' left' + (r.dateStr ? ' at ' + r.dateStr : '') + ')'
        : ((r && r.error) || 'unknown');
    showToast('⚠ Save failed: ' + friendly);
    return false;
  }catch(e){
    console.error('postSaveVideoDays_ error:', e);
    showToast('⚠ Save failed — check connection and try again');
    return false;
  }
}
async function saveCurrentWeek_(){
  if(!CAL_SELECTED_BOOK){ showToast('⚠ Select a book first'); return false; }
  const weekStart = getCampaignWeekStart_(CAL_SELECTED_BOOK, CAL_CURRENT_CAMPAIGN_WEEK);
  const days = [];
  for(let i=0; i<7; i++){
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    const dateStr = localDateStr_(d);
    if(isPastDate_(dateStr)) continue;
    days.push(videoDayRow_(dateStr));
  }
  if(!days.length){ showToast('⚠ This week is entirely in the past'); return false; }
  showToast('⏳ Saving Week ' + CAL_CURRENT_CAMPAIGN_WEEK + '…');
  return postSaveVideoDays_(
    days,
    r => '✅ Week ' + CAL_CURRENT_CAMPAIGN_WEEK + ' saved — ' + (r.slots || 0) + ' slots persisted',
    '⏳ Week ' + CAL_CURRENT_CAMPAIGN_WEEK + ' sent — verifying on next refresh',
    savedDays => '✅ Week ' + CAL_CURRENT_CAMPAIGN_WEEK + ' saved (' + savedDays + ' days, legacy mode)'
  );
}
/* Leave the scheduler: saves any unsaved edits first, then drops the book
   selection so the panel returns to the overview-only view. */
async function closeScheduler_(){
  if(CAL_WEEK_DIRTY && CAL_SELECTED_BOOK){
    showToast('⏳ Saving unsaved changes…');
    const ok = await saveCurrentWeek_();
    if(!ok){ showToast('⚠ Kept the scheduler open — save failed'); return; }
  }
  CAL_SELECTED_BOOK = '';
  CAL_WEEK_DIRTY = false;
  renderCalendarPanel_();
  const panel = document.getElementById('panel-calendar');
  if(panel) panel.scrollIntoView({behavior:'smooth', block:'start'});
}
/* Split mark-done: flip 'Posted TikTok' / 'Posted YouTube' for one week of
   the selected book. Platforms are independent — marking TK done never
   touches YT and vice versa. */
async function markWeekPosted(bookId, weekNum, platform, value){
  if(!bookId || !weekNum) return;
  const payload = { action:'markWeekPosted', editor: EDITOR_NAME, bookId: bookId, weekNum: parseInt(weekNum, 10) || 0 };
  if(platform === 'tiktok') payload.tikTok = value === true;
  else if(platform === 'youtube') payload.youTube = value === true;
  else return;
  showToast(value ? '⏳ Marking Week ' + weekNum + ' ' + (platform === 'tiktok' ? 'TikTok' : 'YouTube') + ' done…' : '⏳ Clearing Week ' + weekNum + ' ' + (platform === 'tiktok' ? 'TikTok' : 'YouTube') + '…');
  try{
    const r = await postAction(payload);
    if(r && (r.success || r.__opaque)){
      await refreshAndRender(true);
      showToast(value
        ? '✅ Week ' + weekNum + ' ' + (platform === 'tiktok' ? 'TikTok' : 'YouTube') + ' marked done — pool consumed'
        : '↩️ Week ' + weekNum + ' ' + (platform === 'tiktok' ? 'TikTok' : 'YouTube') + ' done-flag cleared — pool restored');
    }else{
      showToast('⚠ Could not update: ' + ((r && r.error) || 'unknown error'));
    }
  }catch(e){
    console.error('markWeekPosted error:', e);
    showToast('⚠ Network error — status unchanged');
  }
}
async function markScheduledVideosPublished(dateStr, bookId, platform){
  const slots=getBookDaySlots(dateStr,bookId);
  const scheduled=platform==='tiktok'?[slots.tt1,slots.tt2,slots.tt3].filter(Boolean).length:[slots.yt1,slots.yt2,slots.yt3].filter(Boolean).length;
  if(!scheduled){showToast('⚠ Schedule videos before marking them published');return;}
  const current=platform==='tiktok'?(slots.publishedTikTok||0):(slots.publishedYouTube||0);
  const entered=prompt(`How many ${platform==='tiktok'?'TikTok':'YouTube'} videos were published on ${dateStr}? (0-${scheduled})`,current);
  if(entered===null)return;

  const r=await postAction({action:'markVideoSchedulePublished',editor:EDITOR_NAME,dateStr,bookId,platform,count});
  if(r&&(r.success||r.__opaque)){showToast(`✅ ${count}/${scheduled} ${platform==='tiktok'?'TikTok':'YouTube'} published`);await refreshAndRender(true);}else showToast('⚠ '+(r?.error||'Could not save published count'));
}

  return SLOT_KEYS.reduce((n, k) => n + (slots[k] ? 1 : 0), 0);
}
function countDayVideos(dateStr){
  const dayData = getDayData(dateStr);
  let total = 0;
  Object.keys(dayData).forEach(bookId => {
    const s = dayData[bookId];

  });

}

function removeBookFromWeek(bookId, weekStart){
  const sched = RAW_DATA.videoSchedules || {};
  for(let i=0; i<7; i++){
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    const dateStr = localDateStr_(d);
    if(isPastDate_(dateStr)) continue;
    if(sched[dateStr] && sched[dateStr][bookId]){
      const row = sched[dateStr][bookId];
      const sw = parseInt(row.sw, 10) || 0;
      SLOT_KEYS.forEach((k, i2) => {
        if(row['v' + (i2 + 1)]) adjustLocalAvail_(bookId, SLOT_PLATFORM[k], sw, 1);
      });
      delete sched[dateStr][bookId];
      if(Object.keys(sched[dateStr]).length === 0) delete sched[dateStr];
    }
  }
  CAL_WEEK_DIRTY = true;
}

let CAL_SELECTED_BOOK = '';
let CAL_WEEK_DIRTY = false;   // unsaved slot edits — flushed by 💾 Save Week
let CAL_WEEK_TOUCHED = false; // user navigated weeks manually; until then the grid defaults to the latest week

/* Latest week that actually has spendable inventory for the book — the
   default source week, so the picker opens on real stock instead of Week 1.
   Availability already encodes platform-done weeks, no extra filter needed. */
function latestStockedWeek_(bookId){
  const a = getBookAvail_(bookId);
  if(!a || !a.perWeek) return 0;
  const weeks = Object.keys(a.perWeek).map(Number)
    .filter(w => {
      const pw = a.perWeek[w];
      return ((pw.availableTikTok || 0) > 0 || (pw.availableYouTube || 0) > 0);
    })
    .sort((a2, b2) => b2 - a2);
  return weeks.length ? weeks[0] : 0;
}

/* Fill the NEXT N non-past days of the viewed week (N = CAL_FILL_DAYS, picked
   beside the buttons), scoped to a platform: 'tiktok' = the 3 daily TikTok
   slots, 'youtube' = the 3 YT Short slots, 'both' = all 6. Slots draw from the
   selected SOURCE week's pool and stop per platform when it runs dry. Placement
   is local; ONE bulk POST persists the week afterwards. */
async function fillDaysAhead_(platform){
  if(!CAL_SELECTED_BOOK){ showToast('⚠ Select a book first'); return; }
  const daysAhead = CAL_FILL_DAYS || 3;
  const weekStart = getCampaignWeekStart_(CAL_SELECTED_BOOK, CAL_CURRENT_CAMPAIGN_WEEK);
  const keys = platform === 'tiktok'  ? ['tt1','tt2','tt3']
             : platform === 'youtube' ? ['yt1','yt2','yt3']
             : SLOT_KEYS;
  let placed = 0, filledDays = 0;
  for(let i=0; i<7; i++){
    if(filledDays >= daysAhead) break;
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    const dateStr = localDateStr_(d);
    if(isPastDate_(dateStr)) continue;
    keys.forEach(slotKey => {
      if(setVideoSlot(dateStr, CAL_SELECTED_BOOK, slotKey, true)) placed++;
    });
    filledDays++;
  }
  renderCalendarPanel_();
  if(!placed){
    showToast(filledDays
      ? '⚠ Week ' + CAL_SOURCE_WEEK + ' pool is dry for that platform — nothing left to place'
      : '⚠ Nothing to schedule — the rest of this week is in the past');
    return;
  }
  const platLabel = platform === 'tiktok' ? 'TikTok' : platform === 'youtube' ? 'YouTube' : 'TikTok + YouTube';
  const shortNote = filledDays < daysAhead ? ' (only ' + filledDays + ' non-past day' + (filledDays > 1 ? 's' : '') + ' left this week)' : '';
  showToast('📅 ' + platLabel + ' filled for ' + filledDays + ' day' + (filledDays > 1 ? 's' : '') + shortNote);
  await saveCurrentWeek_();
}

/* The one-click action: place every suggested day's slots locally (full days
   get all 6 slots; the final day gets only its remainder of videos), then
   persist ALL dates in one bulk POST. Pool limits are still enforced per
   platform by setVideoSlot. */
async function scheduleAlbumDates_(){
  if(!CAL_SELECTED_BOOK){ showToast('⚠ Select a book first'); return; }
  const dates = wizardSuggestedDates_();
  if(!dates.length){ showToast('⚠ Enter the number of videos in the album first'); return; }
  const count = CAL_WIZ_VIDEOS;
  const rem = count - (dates.length - 1) * 3; // videos on the final day (1-3)
  let placed = 0;
  dates.forEach((ds, i) => {
    const vids = (i === dates.length - 1) ? rem : 3;
    ['tt1','tt2','tt3'].slice(0, vids).forEach(k => { if(setVideoSlot(ds, CAL_SELECTED_BOOK, k, true)) placed++; });
    ['yt1','yt2','yt3'].slice(0, vids).forEach(k => { if(setVideoSlot(ds, CAL_SELECTED_BOOK, k, true)) placed++; });
  });
  renderCalendarPanel_();
  if(!placed){ showToast('⚠ Nothing placed — the Week ' + CAL_SOURCE_WEEK + ' pool is dry or dates are read-only'); return; }
  showToast('🎬 Scheduling ' + dates.length + ' date' + (dates.length > 1 ? 's' : '') + ' from the Week ' + CAL_SOURCE_WEEK + ' album…');
  const days = dates.map(ds => videoDayRow_(ds)).filter(d => !isPastDate_(d.dateStr));
  await postSaveVideoDays_(
    days,
    r => '✅ ' + dates.length + ' date' + (dates.length > 1 ? 's' : '') + ' scheduled — ' + (r.slots || 0) + ' slots persisted',
    '⏳ Album schedule sent — verifying on next refresh',
    savedDays => '✅ Album schedule saved (' + savedDays + ' days, legacy mode)'
  );
}

/* Split TikTok / YouTube posting status — ALWAYS rendered for a selected
   book, never gated on imported inventory (that gate was why the TT/YT
   buttons were invisible for books with no WeeklyContent import). Weeks come
   from the book's saved CampaignWeeks (book.weeks), merged with any inventoried
   weeks plus the current week so every relevant week shows a row. Each
   platform toggles independently via markWeekPosted — marking TK done never
   touches YT and vice versa. */
function buildPostingStatusHtml_(book){
  if(!book) return '';
  const av = getBookAvail_(book.id);
  const seen = {};
  const weeks = [];
  const addWeek = (w, tt, yt) => {
    const n = parseInt(w, 10);
    if(!(n >= 1) || seen[n]) return;
    seen[n] = 1;
    weeks.push({ weekNum: n, postedTikTok: !!tt, postedYouTube: !!yt });
  };
  (book.weeks || []).forEach(w => addWeek(w.weekNum, w.steps && w.steps['Posted TikTok'], w.steps && w.steps['Posted YouTube']));
  if(av && av.perWeek) Object.keys(av.perWeek).forEach(k => addWeek(k, av.perWeek[k].postedTikTok, av.perWeek[k].postedYouTube));
  addWeek(getBookCurrentWeek_(book.id), false, false);
  if(!weeks.length) return '';
  weeks.sort((a,z) => a.weekNum - z.weekNum);
  const rows = weeks.map(w => {
    const bothDone = w.postedTikTok && w.postedYouTube;
    const btnStyle = done => 'padding:3px 10px;font-size:.55rem;font-weight:700;' + (done ? 'background:var(--moss-lt);color:var(--moss-d);border-color:var(--moss-d);' : '');
    const ttBtn = '<button class="tbtn" style="' + btnStyle(w.postedTikTok) + '" onclick="markWeekPosted(\'' + CAL_SELECTED_BOOK + '\',' + w.weekNum + ',\'tiktok\',' + (!w.postedTikTok) + ')" title="Mark Week ' + w.weekNum + ' TikTok posts done (pool consumed for TikTok only)">' + (w.postedTikTok ? '✓ TikTok done' : '○ TikTok pending') + '</button>';
    const ytBtn = '<button class="tbtn" style="' + btnStyle(w.postedYouTube) + '" onclick="markWeekPosted(\'' + CAL_SELECTED_BOOK + '\',' + w.weekNum + ',\'youtube\',' + (!w.postedYouTube) + ')" title="Mark Week ' + w.weekNum + ' YouTube posts done (pool consumed for YouTube only)">' + (w.postedYouTube ? '✓ YouTube done' : '○ YouTube pending') + '</button>';
    return '<div class="cal-pool-week-row" style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--bd-lt);font-family:var(--fM);font-size:.6rem;' + (bothDone ? 'opacity:.55;' : '') + '">' +
      '<span style="font-weight:600;color:var(--ink);min-width:64px;">Week ' + w.weekNum + (bothDone ? ' · Done' : '') + '</span>' +
      '<span style="color:var(--muted);">' + (bothDone ? 'both platforms posted' : w.postedTikTok || w.postedYouTube ? 'one platform left' : 'not posted yet') + '</span>' +
      '<span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;">' + ttBtn + ytBtn + '</span>' +
      '</div>';
  }).join('');
  return '<div class="cal-pool-panel" style="background:var(--surf);border:1px solid var(--bd-lt);border-radius:var(--r);margin-bottom:16px;overflow:hidden;">' +
    '<div style="padding:8px 10px;font-family:var(--fD);font-size:.7rem;font-weight:600;color:var(--ink);border-bottom:1px solid var(--bd);background:var(--card);">📣 Posting Status — TikTok &amp; YouTube mark-done, independent per week</div>' +
    rows + '</div>';
}

function buildPublishingCalendarHtml_(books){
  const start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-start.getDay());
  const cells=[];
  for(let i=0;i<28;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const dateStr=localDateStr_(d);
    const day=getDayData(dateStr);const rows=Object.keys(day).filter(id=>books.some(b=>b.id===id)).map(id=>{
      const s=day[id],b=bookById_(id);
      const tt=[s.tt1,s.tt2,s.tt3].filter(Boolean).length,yt=[s.yt1,s.yt2,s.yt3].filter(Boolean).length;
      const pubTT=s.publishedTikTok||0,pubYT=s.publishedYouTube||0;
      const complete=tt+yt>0&&pubTT>=tt&&pubYT>=yt;
      return `<div style="padding:5px 0;border-top:1px solid var(--bd-lt);"><div style="font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${esc(b?b.title:id)}">${esc(b?b.title:id)}</div><div style="color:${complete?'var(--moss-d)':'var(--rust-d)'};font-size:.52rem;">TT ${pubTT}/${tt} · YT ${pubYT}/${yt} ${complete?'✓':'○'}</div></div>`;
    }).join('');
    const today=isDateToday_(dateStr);
    cells.push(`<div style="min-height:106px;padding:8px;border:1px solid var(--bd-lt);background:${today?'rgba(60,138,94,.07)':'var(--surf)'};overflow:hidden;"><div style="display:flex;justify-content:space-between;font-family:var(--fM);font-size:.56rem;color:var(--muted);font-weight:700;margin-bottom:4px;"><span>${DOW_LABELS[d.getDay()]}</span><span>${d.getDate()}</span></div>${rows||'<span style="font-family:var(--fM);font-size:.52rem;color:var(--muted)">No scheduled videos</span>'}</div>`);

  return `<div style="margin-top:24px;border-top:1px solid var(--bd);padding-top:18px;"><div class="sec-hdr">Publishing Calendar <span style="font-weight:400;font-size:.75em;color:var(--muted);text-transform:none;letter-spacing:0">— next four weeks · published / scheduled</span></div><div style="display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:6px;overflow-x:auto;padding-bottom:5px;min-width:900px;">${cells.join('')}</div><div style="font-family:var(--fM);font-size:.58rem;color:var(--muted);margin-top:8px;">Green check: all scheduled videos were marked published. Orange circle: publishing remains.</div></div>`;
}

function generateHistoricalTasks_(){
  if(!RAW_DATA || !RAW_DATA.books) return;
  const board = RAW_DATA.taskBoard || [];
  const existing = new Set(board.map(t => `${t.bookId}__${t.weekNum}__${t.stepKey}`));
  const completed = new Set();

  const logs = RAW_DATA.activityLogs || {};
  Object.keys(logs).forEach(bid => {
    (logs[bid] || []).forEach(e => {
      if(e.type === 'task_complete' && e.weekNum != null && e.stepKey){
        completed.add(`${bid}__${e.weekNum}__${e.stepKey}`);
      }
    });
  });

  const synthetic = [];
  activeBooks_().forEach(b => {
    const curWeek = Math.max(1, b.currentWeek || 1);
    const bookLinks = b.links || {};
    for(let w = 1; w <= curWeek; w++){
      CHECKLIST_STEP_ORDER.forEach(stepKey => {
        const sig = `${b.id}__${w}__${stepKey}`;
        if(existing.has(sig) || completed.has(sig)) return;
        if(w === curWeek && b.currentWeekSteps && b.currentWeekSteps[stepKey]) return;
        synthetic.push({
          bookId: b.id,
          bookTitle: b.title || 'Untitled',
          author: b.author || '',
          weekNum: w,
          stepKey: stepKey,
          bucket: STEP_TO_BUCKET[stepKey] || 'Other',
          status: 'open',
          claimedBy: '',
          links: bookLinks
        });
      });
    }
  });

  if(synthetic.length){
    RAW_DATA.taskBoard = board.concat(synthetic);
  }
}

async function saveFocusSession(){
  if(FOCUS_PHASE !== 'work') return;
  const elapsedSec = POMODORO_WORK_SEC - FOCUS_REMAINING;
  if(elapsedSec < 60){ showToast('⚠ Work at least 1 minute before saving'); return; }

  pauseFocusTimer();
  const minutes = +(elapsedSec / 60).toFixed(2);
  const task = currentFocusTask_();

  showToast('⏳ Saving session…');
  try{
    const r = await postAction({
      action:'saveTimeSession',
      author: task ? task.author : '',
      title: task ? task.bookTitle : 'Pomodoro Session',
      editor: EDITOR_NAME,
      durationMinutes: minutes,
      sessionType: 'Pomodoro',
      notes: 'Pomodoro focus session'
    });
    if(r && r.__opaque){
      showToast('⏳ Sent — verifying…');
      await new Promise(res=>setTimeout(res,2000));
      await refreshAndRender(true); 
      showToast('🍅 Session saved — refresh to confirm');
      resetFocusTimer();
      return;
    }
    if(r && r.success){
      const coins = Math.floor(minutes / 10) * COINS_PER_10MIN;
      showToast(r.deduplicated ? '🍅 Session already recorded — no double log' : `🍅 Saved ${Math.round(minutes * 100)/100} min · +${fmtCoins(coins)}`);
      resetFocusTimer();
      await refreshAndRender(true); 
    } else {
      showToast(`⚠ ${r?.error || 'Save failed'}`);
    }
  }catch(e){ console.error('saveFocusSession error:',e); showToast('⚠ '+(e.message||'Network error — session not saved')); }
}

function computeStreakWithGrace_(days){
  let cursor=localDayStart_(Date.now());
  let streak=0;
  if(days.has(cursor))streak++;
  cursor-=86400000;
  let graceLeft=1;
  while(true){
    if(days.has(cursor)){streak++;cursor-=86400000;}
    else if(graceLeft>0){graceLeft--;cursor-=86400000;}
    else break;
  }
  return{streak,graceUsed:graceLeft===0};
}
function myWallet_(){
  const wallets=(RAW_DATA&&RAW_DATA.shelfCoinWallets)||{};
  return wallets[(EDITOR_NAME||'').trim().toLowerCase()]||null;
}
function myWithdrawals_(){return((RAW_DATA&&RAW_DATA.shelfCoinWithdrawals)||[]).filter(w=>(w.editor||'').toLowerCase()===(EDITOR_NAME||'').toLowerCase());}
function computeCoins_(allActs){
  const claims    = allActs.filter(e=>e.type==='task_claim').length;
  const completes = allActs.filter(e=>e.type==='task_complete').length;
  const minutes   = myMinutesOr_(null, minutesInLogs_(allActs));

  const kesEarned = (RAW_DATA.payrollAdjustments||[])
    .filter(a=>(a.editor||'').toLowerCase()===EDITOR_NAME.toLowerCase()&&a.type==='addition'&&/task bounty/i.test(a.reason||''))
    .reduce((s,a)=>s+(a.amountKes||0),0);

  const days=new Set(allActs.filter(e=>e.ts).map(e=>localDayStart_(e.ts)));
  const{streak,graceUsed}=computeStreakWithGrace_(days);

  const coinsFromClaims    = claims * COINS_PER_CLAIM;
  const coinsFromBounties  = Math.round(kesEarned * COINS_PER_KES);
  const coinsFromTime      = Math.floor(minutes / 10) * COINS_PER_10MIN;
  const coinsFromStreak    = streak * COINS_PER_STREAK_DAY;
  const coinsFromBonus     = getBonusCoinsTotal_();
  const historicalCoins    = coinsFromClaims + coinsFromBounties + coinsFromTime + coinsFromStreak + coinsFromBonus;
  const wallet = myWallet_();
  const totalCoins         = wallet ? wallet.availableCoins : historicalCoins;
  const kesEquivalent       = totalCoins / COINS_PER_KES;

  let level = LEVELS[0], next = null;
  for (let i = 0; i < LEVELS.length; i++) {
    if (totalCoins >= LEVELS[i].min) {
      level = LEVELS[i];
      next  = LEVELS[i + 1] || null;
    }
  }
  const pctToNext = next ? Math.min(100, Math.round(((totalCoins - level.min) / (next.min - level.min)) * 100)) : 100;

  return {
    totalCoins, historicalCoins, kesEquivalent,
    availableCoins: wallet ? wallet.availableCoins : totalCoins,
    workInProgressCoins: wallet ? wallet.workInProgressCoins : 0,
    frozenCoins: wallet ? wallet.frozenCoins : 0,
    coinsFromClaims, coinsFromBounties, coinsFromTime,
    coinsFromStreak, coinsFromBonus,
    streak, graceUsed, level, next, pctToNext,
    minutes, completes: claims + completes, claims
  };
}

function renderAuthorGroupedTasks_(tasks,cardFn,emptyNote){

/* Claim every OPEN task under one author in one click. Posts are sequential
   and awaited — they cannot race each other on the server. Handles the
   opaque (no-cors) fallback the same way the manual batch claim does. */
async function claimAllForAuthor(gi){
  const author=AUTHOR_CLAIM_GROUPS_[gi];
  if(author==null){showToast('⚠ Group not found — refresh and retry');return;}
  const tasks=openTasks_().filter(t=>(t.author||'Unknown')===author && t.status==='open');
  if(!tasks.length){showToast('⚠ No open tasks left for '+author);return;}
  showToast('⏳ Claiming '+tasks.length+' task'+(tasks.length>1?'s':'')+' for '+author+'…');
  let ok=0,fail=0,opaque=0;
  for(const t of tasks){
    try{
      const r=await postAction({action:'claimTask',bookId:t.bookId,author:t.author,title:t.bookTitle,weekNum:t.weekNum,stepKey:t.stepKey,editor:EDITOR_NAME,mode:'hard'});
      if(r&&r.__opaque)opaque++;
      else if(r&&r.success)ok++;
      else fail++;
    }catch(e){fail++;}
  }
  if(opaque>0&&ok===0&&fail===0){
    showToast('⏳ Batch sent — verifying…');
    await new Promise(res=>setTimeout(res,2000));
    await refreshAndRender(true);
    showToast('🔒 Claims sent for '+author+' — refresh to confirm');
    return;
  }
  showToast(fail
    ?'🔒 Claimed '+ok+', '+fail+' failed for '+author
    :'🔒 Claimed '+ok+' for '+author+' — +'+(ok*COINS_PER_CLAIM).toLocaleString()+' 🪙');
  await refreshAndRender(true);
}

function bucketEntries_(items,getTsKey,getVal){const times=items.map(i=>getTsKey(i)).filter(Boolean);if(!times.length)return null;const minTs=Math.min(...times),maxTs=Math.max(...times);const rangeDays=Math.max(1,(maxTs-minTs)/86400000);let startFn,fmt;if(rangeDays<=21){startFn=localDayStart_;fmt=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}else if(rangeDays<=140){startFn=localWeekStart_;fmt=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}else{startFn=localMonthStart_;fmt=d=>d.toLocaleDateString(undefined,{month:'short',year:'2-digit'});}const buckets={};items.forEach(i=>{const ts=getTsKey(i);if(!ts)return;const start=startFn(ts);buckets[start]=(buckets[start]||0)+getVal(i);});const keys=Object.keys(buckets).map(Number).sort((a,z)=>a-z).slice(-20);return{keys,buckets,fmt};}
function bucketCumulative_(points){if(!points||!points.length)return null;const times=points.map(p=>p.ts);const minTs=Math.min(...times),maxTs=Math.max(...times);const rangeDays=Math.max(1,(maxTs-minTs)/86400000);let startFn,fmt;if(rangeDays<=21){startFn=localDayStart_;fmt=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}else if(rangeDays<=140){startFn=localWeekStart_;fmt=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}else{startFn=localMonthStart_;fmt=d=>d.toLocaleDateString(undefined,{month:'short',year:'2-digit'});}const buckets={};points.forEach(p=>{const start=startFn(p.ts);buckets[start]=p.cum;});const keys=Object.keys(buckets).map(Number).sort((a,z)=>a-z).slice(-26);return{keys,buckets,fmt};}
function catmullRomPath_(pts){if(pts.length<2)return'';if(pts.length===2)return`M ${pts[0][0]},${pts[0][1]} L ${pts[1][0]},${pts[1][1]}`;let d=`M ${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;const c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;d+=` C ${c1x},${c1y} ${c2x},${c2y} ${p2[0]},${p2[1]}`;}return d;}
function svgCurveChart_({keys,buckets,fmt,height=130,color1,color2,gradId,tooltipFn,valuePrefix,allowNegative}){if(!keys||!keys.length)return'<div class="empty-note">No data yet.</div>';const vals=keys.map(k=>buckets[k]);const max=Math.max(1,...vals);const min=allowNegative?Math.min(0,...vals):0;const span=Math.max(1,max-min);const stepW=Math.max(52,Math.min(88,720/Math.max(1,keys.length-1||1)));const totalW=Math.max(280,(keys.length-1)*stepW+40);const padTop=22,padBottom=26;const chartH=height;const pts=keys.map((k,i)=>{const v=buckets[k];const x=20+i*stepW;const y=padTop+(chartH-padTop-padBottom)*(1-((v-min)/span));return[x,y,v,k];});const linePts=pts.map(p=>[p[0],p[1]]);const linePath=catmullRomPath_(linePts);const baseY=padTop+(chartH-padTop-padBottom)*(1-((0-min)/span));
  const areaPath = linePath ? `${linePath} L ${pts[pts.length-1][0]},${baseY} L ${pts[0][0]},${baseY} Z` : '';
  const dots=pts.map(([x,y,v,k],i)=>`<g class="curve-interactive" onmousemove="showChartTooltip(event,${JSON.stringify(`<div class='tt-hdr'>${esc(fmt(new Date(k)))}</div><div class='tt-row'>${esc(tooltipFn(v))}</div>`).replace(/"/g,'&quot;')})" onmouseleave="hideChartTooltip()"><circle cx="${x}" cy="${y}" r="12" fill="transparent"/><circle cx="${x}" cy="${y}" r="4.5" fill="${color2}" stroke="#FFFDF8" stroke-width="2"/>${v?`<text x="${x}" y="${y-11}" text-anchor="middle" font-family="Courier New,monospace" font-size="10.5" font-weight="700" fill="var(--bark-dk)">${valuePrefix||''}${v}</text>`:''}<text x="${x}" y="${chartH-6}" text-anchor="middle" font-family="Courier New,monospace" font-size="9" fill="var(--muted)">${esc(fmt(new Date(k)))}</text></g>`).join('');return`<div style="overflow-x:auto;padding-bottom:4px"><svg viewBox="0 0 ${totalW} ${chartH}" style="width:100%;min-width:${Math.min(totalW,320)}px;height:auto;overflow:visible" preserveAspectRatio="xMinYMid meet"><defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color1}" stop-opacity=".38"/><stop offset="1" stop-color="${color1}" stop-opacity="0"/></linearGradient></defs><line x1="0" y1="${baseY}" x2="${totalW}" y2="${baseY}" stroke="var(--bd-lt)" stroke-width="1"/>${areaPath?`<path d="${areaPath}" fill="url(#${gradId})"/>`:''}<path d="${linePath}" fill="none" stroke="${color2}" stroke-width="2.75" stroke-linecap="round" class="animated-line" style="--len:1400"/>${dots}</svg></div>`;}
const PIE_COLORS=['#E0913C','#3C8A5E','#8B4A9C','#C15A3C','#A17A4C','#C6721E'];
function pieChartSVG_(entries,size=170){const total=entries.reduce((s,e)=>s+e.value,0)||1;let acc=0;const cx=size/2,cy=size/2,r=size/2-6;const slices=entries.map((e,i)=>{const start=acc/total*360;acc+=e.value;const end=acc/total*360;const large=(end-start)>180?1:0;const sx=cx+r*Math.cos((start-90)*Math.PI/180),sy=cy+r*Math.sin((start-90)*Math.PI/180);const ex=cx+r*Math.cos((end-90)*Math.PI/180),ey=cy+r*Math.sin((end-90)*Math.PI/180);const color=PIE_COLORS[i%PIE_COLORS.length];const pct=Math.round(e.value/total*100);return`<path d="M ${cx},${cy} L ${sx},${sy} A ${r},${r} 0 ${large} 1 ${ex},${ey} Z" fill="${color}" opacity=".92" onmousemove="showChartTooltip(event,'<div class=&quot;tt-hdr&quot;>${esc(e.label)}</div><div class=&quot;tt-row&quot;>${pct}% · ${esc(String(e.value))}</div>')" onmouseleave="hideChartTooltip()"/>`;}).join('');const legend=entries.map((e,i)=>`<span class="legend-item"><span class="legend-dot" style="background:${PIE_COLORS[i%PIE_COLORS.length]}"></span>${esc(e.label)} · ${Math.round(e.value/total*100)}%</span>`).join('');return`<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center"><svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex-shrink:0"><circle cx="${cx}" cy="${cy}" r="${r+3}" fill="var(--surf)"/>${slices}<circle cx="${cx}" cy="${cy}" r="${r*0.52}" fill="var(--card)"/></svg><div class="chart-legend" style="flex-direction:column;gap:8px">${legend}</div></div>`;}
function showBarTip(evt,{header,value}){showChartTooltip(evt,`<div class="tt-hdr">${header}</div><div class="tt-row">${value}</div>`);}

function buildTodayChartHTML_(){
  const allActs=myActivityAll_();
  const todays=allActs.filter(e=>isToday_(e.ts)).sort((a,z)=>(a.ts||0)-(z.ts||0));

  const tasksClaimed=todays.filter(e=>e.type==='task_claim').length;
  const minutesLogged=myMinutesOr_(t=>isToday_(t), minutesInLogs_(todays));
  const hoursLogged=Math.round(minutesLogged/60*10)/10;
  const earnedToday=(RAW_DATA.payrollAdjustments||[]).filter(a=>(a.editor||'').toLowerCase()===EDITOR_NAME.toLowerCase()&&a.type==='addition'&&a.recordedAt&&isToday_(new Date(a.recordedAt).getTime())).reduce((s,a)=>s+(a.amountKes||0),0);
  const coinsToday=tasksCompleted*0+tasksClaimed*COINS_PER_CLAIM+Math.floor(minutesLogged/10)*COINS_PER_10MIN+earnedToday*COINS_PER_KES;
  const tiles=`<div class="today-tiles"><div class="today-tile"><span class="v">${todays.length}</span><span class="l">Activities</span></div><div class="today-tile"><span class="v">${tasksCompleted}</span><span class="l">Completed</span></div><div class="today-tile"><span class="v">${tasksClaimed}</span><span class="l">Claimed</span></div><div class="today-tile"><span class="v">${hoursLogged}h</span><span class="l">Logged</span></div><div class="today-tile"><span class="v" style="color:var(--coin-dk);font-size:1rem">${fmtCoins(coinsToday)}</span><span class="l">Coins Today</span></div></div>`;
  if(!todays.length)return`<div class="chart-card"><div class="chart-card-hdr"><span class="chart-card-title">📅 Today</span></div>${tiles}<div class="empty-note">Nothing logged yet today.</div></div>`;
  TODAY_CHART_DATA={};
  todays.forEach(e=>{const h=new Date(e.ts).getHours();if(!TODAY_CHART_DATA[h])TODAY_CHART_DATA[h]={count:0,items:[]};TODAY_CHART_DATA[h].count++;TODAY_CHART_DATA[h].items.push(e);});
  const nowHour=new Date().getHours();
  const activeHours=Object.keys(TODAY_CHART_DATA).map(Number);
  const startHour=Math.min(...activeHours);
  const hours=[];for(let h=startHour;h<=nowHour;h++)hours.push(h);
  const max=Math.max(1,...hours.map(h=>(TODAY_CHART_DATA[h]&&TODAY_CHART_DATA[h].count)||0));
  const hourLabel=h=>{const d=new Date();d.setHours(h,0,0,0);return d.toLocaleTimeString(undefined,{hour:'numeric'});};
  const barW=40,gap=9,chartH=120;
  const totalW=Math.max(hours.length*(barW+gap),280);
  const bars=hours.map((h,i)=>{const d=TODAY_CHART_DATA[h]||{count:0,items:[]};const pct=d.count?Math.max(8,Math.round((d.count/max)*100)):4;const bH=Math.max(Math.round(chartH*pct/100),3);const x=i*(barW+gap);const y=chartH-bH;const isNow=h===nowHour;return`<g class="bar-interactive" onmousemove="showTodayBarTip(event,${h})" onmouseleave="hideChartTooltip()"><rect x="${x}" y="${y}" width="${barW}" height="${bH}" rx="6" fill="${isNow?'url(#todayNow)':'url(#todayGrad)'}" opacity="${d.count?1:.35}"/>${d.count?`<text x="${x+barW/2}" y="${y-6}" text-anchor="middle" font-family="Courier New,monospace" font-size="11" font-weight="700" fill="var(--bark-dk)">${d.count}</text>`:''}<text x="${x+barW/2}" y="${chartH+16}" text-anchor="middle" font-family="Courier New,monospace" font-size="9" fill="${isNow?'var(--moss-d)':'var(--muted)'}">${esc(hourLabel(h))}${isNow?'◀':''}</text></g>`;}).join('');
  return`<div class="chart-card"><div class="chart-card-hdr"><span class="chart-card-title">📅 Today</span><span class="chart-card-sub">Hover bars for details</span></div>${tiles}<div style="overflow-x:auto;padding-bottom:4px"><svg viewBox="0 0 ${totalW} ${chartH+28}" style="width:100%;min-width:${Math.min(totalW,320)}px;height:auto;overflow:visible" preserveAspectRatio="xMinYMid meet"><defs><linearGradient id="todayGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0913C"/><stop offset="1" stop-color="#296B45"/></linearGradient><linearGradient id="todayNow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2B15C"/><stop offset="1" stop-color="#3C8A5E"/></linearGradient></defs><line x1="0" y1="${chartH}" x2="${totalW}" y2="${chartH}" stroke="var(--bd-lt)" stroke-width="1"/>${bars}</svg></div></div>`;
}
function showTodayBarTip(evt,hour){
  const d=TODAY_CHART_DATA[hour];
  const startD=new Date();startD.setHours(hour,0,0,0);
  const endD=new Date(startD.getTime()+3600000);
  const label=startD.toLocaleTimeString(undefined,{hour:'numeric'})+' – '+endD.toLocaleTimeString(undefined,{hour:'numeric'});

function peakHoursAnalysis_(allActs){const byHour=new Array(24).fill(0);const byDow=new Array(7).fill(0);allActs.forEach(e=>{if(!e.ts)return;const d=new Date(e.ts);byHour[d.getHours()]++;byDow[d.getDay()]++;});let peakHour=0,peakHourVal=-1;byHour.forEach((v,h)=>{if(v>peakHourVal){peakHourVal=v;peakHour=h;}});let peakDow=0,peakDowVal=-1;byDow.forEach((v,d)=>{if(v>peakDowVal){peakDowVal=v;peakDow=d;}});return{byHour,byDow,peakHour,peakHourVal,peakDow,peakDowVal};}
function buildPeakHoursHTML_(allActs){

  const max=Math.max(1,...byHour);
  const hourLabel=h=>{const d=new Date();d.setHours(h,0,0,0);return d.toLocaleTimeString(undefined,{hour:'numeric'});};
  const barW=22,gap=4,chartH=90;const totalW=24*(barW+gap);
  const bars=byHour.map((v,h)=>{const pct=v?Math.max(6,Math.round((v/max)*100)):3;const bH=Math.max(Math.round(chartH*pct/100),2);const x=h*(barW+gap);const y=chartH-bH;const isPeak=h===peakHour&&v>0;return`<g class="bar-interactive" onmousemove="showBarTip(event,{header:'${esc(hourLabel(h))}',value:'${v} activit${v===1?'y':'ies'} all-time'})" onmouseleave="hideChartTooltip()"><rect x="${x}" y="${y}" width="${barW}" height="${bH}" rx="4" fill="${isPeak?'url(#peakGradHot)':'url(#peakGrad)'}"/>${h%3===0?`<text x="${x+barW/2}" y="${chartH+14}" text-anchor="middle" font-family="Courier New,monospace" font-size="8.5" fill="var(--muted)">${esc(hourLabel(h))}</text>`:''}</g>`;}).join('');
  const dowMax=Math.max(1,...byDow);
  const dowRows=DOW_LABELS.map((lbl,i)=>{const pct=Math.max(4,Math.round((byDow[i]/dowMax)*100));return`<div class="h-bar-row"><div class="h-bar-label" style="width:44px">${lbl}${i===peakDow?' 🔥':''}</div><div class="h-bar-track"><div class="h-bar-fill" style="width:${pct}%;background:${i===peakDow?'linear-gradient(90deg,var(--rust-d),var(--saffron))':'linear-gradient(90deg,#A17A4C,#7A5A2E)'}"></div></div><div class="h-bar-val">${byDow[i]}</div></div>`;}).join('');
  return`<div class="chart-card"><div class="chart-card-hdr"><span class="chart-card-title">🔥 Peak Hours</span><span class="chart-card-sub">Busiest at ${esc(hourLabel(peakHour))}</span></div><div style="overflow-x:auto;padding-bottom:4px;margin-bottom:20px"><svg viewBox="0 0 ${totalW} ${chartH+22}" style="width:100%;min-width:${Math.min(totalW,340)}px;height:auto;overflow:visible" preserveAspectRatio="xMinYMid meet"><defs><linearGradient id="peakGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A17A4C"/><stop offset="1" stop-color="#7A5A2E"/></linearGradient><linearGradient id="peakGradHot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0913C"/><stop offset="1" stop-color="#A03F26"/></linearGradient></defs><line x1="0" y1="${chartH}" x2="${totalW}" y2="${chartH}" stroke="var(--bd-lt)" stroke-width="1"/>${bars}</svg></div><div class="sec-hdr" style="margin-top:0">By Day of Week</div>${dowRows}</div>`;
}

function buildGanttHTML_(){const bids=myBookIds_();const books=bids.map(bid=>bookById_(bid)).filter(Boolean).sort((a,z)=>(z.currentWeek||1)-(a.currentWeek||1));if(!books.length)return'';const rows=books.map(b=>{const cur=Math.min(TOTAL_CAMPAIGN_WEEKS,b.currentWeek||1);const pct=Math.round((cur/TOTAL_CAMPAIGN_WEEKS)*100);return`<div class="gantt-row"><div class="gantt-label"><div class="t">${esc(b.title)}</div><div class="s">${esc(b.author||'')}</div></div><div><div class="gantt-track"><div class="gantt-done" style="width:${pct}%"></div><div class="gantt-marker" style="left:${pct}%"></div></div><div class="s" style="font-family:var(--fM);font-size:.58rem;color:var(--muted);margin-top:4px">Week ${cur} of ${TOTAL_CAMPAIGN_WEEKS} · ${pct}%</div></div></div>`;}).join('');return`<div class="chart-card"><div class="chart-card-hdr"><span class="chart-card-title">🗺️ Campaign Roadmap</span><span class="chart-card-sub">${TOTAL_CAMPAIGN_WEEKS}-week arc</span></div>${rows}</div>`;}

function buildSuggestions_(allActs,openBoard){
  const sug=[];
  if(allActs.length>=3){const{peakHour,peakHourVal}=peakHoursAnalysis_(allActs);const hourLabel=h=>{const d=new Date();d.setHours(h,0,0,0);return d.toLocaleTimeString(undefined,{hour:'numeric'});};if(peakHourVal>0){const nowH=new Date().getHours();const near=Math.abs(nowH-peakHour)<=1;sug.push({ico:'⚡',text:`You get the most done around <b>${esc(hourLabel(peakHour))}</b>.${near?" You're in that window right now — good time to knock out a task.":' Consider scheduling focused work around that hour.'}`});}}
  const overduePaid=openBoard.filter(t=>{const p=taskPriority_(t);return p.paid&&p.behind>0;});
  if(overduePaid.length>0)sug.push({ico:'⏰',text:`<b>${overduePaid.length} paid-client task${overduePaid.length>1?'s are':' is'}</b> overdue on the open board — each earns Coins too.`});
  const mine=myTasks_();
  if(mine.length>=4)sug.push({ico:'📦',text:`You're holding <b>${mine.length} claimed tasks</b>. Completing some before claiming more keeps your Coins flowing.`});
  else if(mine.length===0&&openBoard.length>0)sug.push({ico:'🎯',text:`Your list is clear — the open board has <b>${openBoard.length} task${openBoard.length>1?'s':''}</b>, each worth 500 🪙 just to claim.`});
  const g=computeCoins_(allActs);
  if(g.streak>=1)sug.push({ico:'🔥',text:`You're on a <b>${g.streak}-day streak</b> — that's +${COINS_PER_STREAK_DAY.toLocaleString()} 🪙 per day. Log something today to keep it.`});
  else if(allActs.length>0)sug.push({ico:'🌱',text:`No active streak. One task today starts a new one — and you get one grace day if you miss.`});
  if(!sug.length)sug.push({ico:'👋',text:'Claim tasks, log time, and complete work to unlock personalized suggestions here.'});
  return sug.slice(0,4);
}

async function markTaskComplete(bookId,author,title,weekNum,stepKey){
  showToast('⏳ Marking complete…');
  try{
    const t=(RAW_DATA.taskBoard||[]).find(x=>x.bookId===bookId&&x.weekNum===weekNum&&x.stepKey===stepKey);
    const k=t?taskKey_(t):null;
    const wasLocked = t && t.status==='locked';
    const r=await postAction({action:'completeTaskClaim',bookId,author,title,weekNum,stepKey,editor:EDITOR_NAME});
    if(r && r.__opaque){
      showToast('⏳ Sent — verifying…');
      await new Promise(res=>setTimeout(res,2000));
      await refreshAndRender(true); 
      const allActs = myActivityAll_();
      const ok = allActs.some(e=>e.type==='task_complete'&&e.bookId===bookId&&e.weekNum===weekNum&&e.stepKey===stepKey);
      showToast(ok ? '✅ Marked complete' : '⚠ May have failed — refresh and retry');
      return;
    }
    if(r&&r.success){
      const bonus = wasLocked ? COINS_PER_LOCKED_COMPLETE : 0;
      if(bonus > 0){ addBonusCoins_(bonus,'Locked task completed'); }
      if(k&&FOCUS_TASK_KEY===k)clearFocusTask();
      const coins=Math.round((r.payout||0)*COINS_PER_KES)+bonus;
      showToast(`✅ Done — ${fmtKes(r.payout)} and ${fmtCoins(COINS_PER_CLAIM)} moved to available`);
      await refreshAndRender(true); 
    }
    else showToast(`⚠ ${r?.error||'Failed — check connection'}`);
  }catch(e){ console.error('markTaskComplete error:',e); showToast('⚠ '+(e.message||'Failed — check connection')); }
}

function showToast(msg){const t=document.getElementById('_toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800);}

async function refreshAndRender(force = false){
  const active = document.activeElement;
  if (!force && active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT') && document.getElementById('main').contains(active)) {
    return; 
  }
  const data=await fetchFromBridge();
  if(!data||data.success===false){
    if(data&&data.error==='auth'){logoutEditor();return;}
    return; // transient poll failure — keep the last good payload on screen
  }
  RAW_DATA=data;
  generateHistoricalTasks_();
  renderAll();
}

async function submitEditorName(){
  const editorName=(document.getElementById('login-name')?.value||'').trim();
  const password=(document.getElementById('login-pass')?.value||'');
  if(!editorName){renderNamePicker('Enter your name to continue.');return;}
  if(!password){renderNamePicker('Enter your password to continue.');return;}
  const btn=document.querySelector('.login-card button');
  if(btn){btn.disabled=true;btn.textContent='Checking…';}
  try{
    const r=await postAction({action:'login',editor:editorName,password});
    if(r && r.__opaque){
      renderNamePicker('Login blocked by browser security. Ask admin to add Access-Control-Allow-Origin: * to doPost().');
      return;
    }
    if(r&&r.success&&r.token){SESSION_TOKEN=r.token;EDITOR_NAME=editorName;saveLogin_(editorName,r.token);startDashboard_();}
    else renderNamePicker(r?.error||'Incorrect name or password.');
  }catch(e){
    console.error('Login error:',e);
    let msg = e.message || 'Could not reach the server.';
    if(msg.includes('CORS')){
      msg = 'Backend CORS blocked. Ask admin to add .setHeaders({"Access-Control-Allow-Origin":"*"}) to doPost().';
    }else if(msg.includes('timed out')){
      msg = 'Server took too long to respond. Try again.';
    }else if(msg.includes('non-JSON')){
      msg = 'Server error — please contact admin.';
    }
    renderNamePicker(msg);
  }
}
function startDashboard_(){
  renderAll();
  initFocusTimer_();
  if(_pollInterval)clearInterval(_pollInterval);
  _pollInterval=setInterval(()=>{refreshAndRender().catch(()=>{});},60*1000);
}

async function boot(){
  try{
    const saved=getSavedLogin_();
    if(saved){EDITOR_NAME=saved.editorName;SESSION_TOKEN=saved.token;}
    RAW_DATA=await fetchFromBridge();
    if(!RAW_DATA.success){
      if(RAW_DATA.error==='auth'){
        // Stale/expired saved token: clear it once and reload. Anonymous
        // denial: show the login screen — never a reload loop.
        if(saved){logoutEditor();return;}
        renderNamePicker();return;
      }
      throw new Error(RAW_DATA.error||'Bridge returned an error');
    }
    generateHistoricalTasks_();
    if(saved){startDashboard_();return;}
    renderNamePicker();
  }catch(e){
    document.getElementById('main').innerHTML=`<div class="center-state"><div class="ico">⚠</div><div class="ttl">Couldn't load</div><p style="color:var(--red)">${esc(e.message)}</p></div>`;
  }
}

boot();
</script>
